<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIT 건강관리 포털</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f6fa,#111827);--surface:light-dark(#fff,#1f2937);--surface2:light-dark(#f8fafc,#273449);--text:light-dark(#172033,#f3f4f6);--muted:light-dark(#64748b,#aab6c8);--border:light-dark(#e2e8f0,#3b4658);--accent:light-dark(#2457c5,#8db2ff);--accentbg:light-dark(#eaf0ff,#243b64);--green:light-dark(#16845b,#5ed6a5);--amber:light-dark(#a8650b,#f5bd62);--red:light-dark(#b83c45,#ff8e96)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;font-size:15px}
.app{min-height:100vh;background:var(--bg)}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:3}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px}
.logo{background:#2457c5;color:white;border-radius:10px;padding:9px}
.sub{font-size:12px;color:var(--muted);font-weight:500}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 68px)}
aside{background:var(--surface);border-right:1px solid var(--border);padding:20px 13px}
.navlabel{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em;padding:12px 12px 8px}
.nav{width:100%;border:0;background:transparent;color:var(--text);padding:12px;border-radius:9px;text-align:left;display:flex;gap:11px;align-items:center;cursor:pointer;font-size:14px;margin:2px 0}
.nav.active,.nav:hover{background:var(--accentbg);color:var(--accent);font-weight:750}
.aside-note{margin:26px 7px 0;padding:13px;border:1px solid var(--border);border-radius:10px;font-size:12px;color:var(--muted);line-height:1.6}
main{padding:28px;max-width:1500px;width:100%;margin:0 auto}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:22px}
.pagehead h1{font-size:25px;margin:0 0 6px}
.pagehead p{margin:0;color:var(--muted)}
button,.button{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:650;font-size:14px}
.primary{background:#2457c5;color:#fff;border-color:#2457c5}
.danger{color:var(--red)}
button:hover{filter:brightness(.97)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:19px;min-width:0}
.metric-label{font-size:13px;color:var(--muted);font-weight:600}
.metric{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:10px 0 6px}
.metric small{font-size:14px;font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.twocol{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(290px,.7fr);gap:16px;margin-bottom:18px}
.panel h2{font-size:17px;margin:0 0 16px}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.panelhead h2{margin:0}
.barrow{display:grid;grid-template-columns:75px 1fr 52px;gap:12px;align-items:center;margin:17px 0;font-size:13px}
.bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:13px;font-weight:700;color:var(--muted)}
input,textarea,select{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:11px 12px;border-radius:8px;font:inherit;min-width:0}
textarea{min-height:84px;resize:vertical}
.section{margin-top:16px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}
.pill{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:750;background:var(--accentbg);color:var(--accent)}
.pill.good{background:light-dark(#e5f7ef,#174b3a);color:var(--green)}
.pill.warn{background:light-dark(#fff4dd,#503b1d);color:var(--amber)}
.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:680px}
th,td{padding:12px 13px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{background:var(--surface2);color:var(--muted);font-weight:750}
tbody tr:last-child td{border-bottom:0}
.muted{color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.notice{padding:12px 14px;border-radius:9px;background:var(--accentbg);color:var(--text);font-size:13px;line-height:1.6;margin-bottom:16px}
.right{display:flex;gap:8px;align-items:center}
.mobilemenu{display:none}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.twocol{grid-template-columns:1fr}.layout{grid-template-columns:190px minmax(0,1fr)}main{padding:20px}}
@media(max-width:700px){header{padding:0 14px}.mobilemenu{display:block}.layout{display:block}aside{display:none;position:fixed;top:68px;bottom:0;left:0;width:245px;z-index:5;box-shadow:0 8px 30px #0002}.layout.menuopen aside{display:block}main{padding:17px 12px}}
.preset-btn{background:var(--surface2);border:1px solid var(--border);padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all 0.2s}
.preset-btn:hover{background:var(--accentbg);color:var(--accent);border-color:var(--accent)}
.meal-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.meal-item{display:flex;justify-content:space-between;align-items:center;background:var(--surface);padding:8px 12px;border-radius:8px;border:1px solid var(--border);margin-top:8px}
.qty-btn{background:var(--surface2);border:1px solid var(--border);padding:2px 8px;border-radius:4px;cursor:pointer;font-weight:bold}
.note-box{background:var(--surface);border:1px dashed var(--accent);border-radius:8px;padding:10px;margin-top:10px}

.inbody-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.progress-row{margin:12px 0}.progress-row .bar{margin-top:6px}.preview-img{max-width:100%;max-height:360px;object-fit:contain;border:1px solid var(--border);border-radius:10px;margin-top:10px}.mini-note{font-size:12px;color:var(--muted)}.eval-box{padding:14px;border-radius:10px;background:var(--accentbg);margin-top:16px;line-height:1.65}.statline{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}

/* Fresh, friendly fitness dashboard refresh */
:root{color-scheme:light;--bg:#f7f7fb;--surface:#fff;--surface2:#f2f1fb;--text:#24243a;--muted:#77778f;--border:#e8e6f2;--accent:#6558d9;--accentbg:#eeecff;--green:#179b78;--amber:#bd7a18;--red:#d34b66}
body{background:radial-gradient(ellipse at 85% 0%,#eeeaff 0,transparent 35%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Malgun Gothic',sans-serif;letter-spacing:-.015em}
header{height:74px;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border-bottom:1px solid #eae8f4;padding:0 30px}
.logo{background:linear-gradient(135deg,#7868f0,#5144c7);border-radius:15px;padding:10px;box-shadow:0 7px 18px #6558d933}
.brand{font-size:19px;letter-spacing:-.04em}.layout{grid-template-columns:248px minmax(0,1fr)}
aside{background:rgba(255,255,255,.72);border-right:1px solid #eae8f4;padding:24px 15px}
.nav{padding:13px 14px;border-radius:13px;font-size:14px;transition:background .18s,transform .18s}.nav:hover{transform:translateX(2px)}.nav.active{background:#eeecff;color:#5d50ce;box-shadow:inset 3px 0 #6558d9}
main{padding:32px;max-width:1560px}.pagehead{margin-bottom:26px;align-items:center}.pagehead h1{font-size:clamp(25px,2.4vw,32px);letter-spacing:-.055em}.pagehead p{font-size:14px;line-height:1.6}
.card,.panel{border:1px solid rgba(226,223,241,.9);border-radius:21px;padding:22px;box-shadow:0 8px 30px rgba(49,42,104,.035);transition:box-shadow .2s,transform .2s}.card:hover{box-shadow:0 12px 32px rgba(49,42,104,.07)}
.cards{gap:16px}.metric{font-size:31px;letter-spacing:-.055em}.metric-label{font-size:12px;letter-spacing:.01em}
button,.button{border-radius:12px;padding:10px 15px;font-weight:700;transition:transform .15s,box-shadow .15s,background .15s}button:hover{filter:none;transform:translateY(-1px);box-shadow:0 5px 14px #2e245b12}.primary{background:linear-gradient(135deg,#7567ed,#594bcc);border-color:#6558d9;box-shadow:0 6px 14px #6558d92b}.primary:hover{box-shadow:0 8px 18px #6558d940}
input,textarea,select{border-radius:12px;border-color:#e3e0f0;background:#fff;padding:12px 13px;outline:none;transition:border-color .15s,box-shadow .15s}input:focus,textarea:focus,select:focus{border-color:#9389f0;box-shadow:0 0 0 4px #7668e51c}
label{font-size:12px;letter-spacing:.015em}.pill{border-radius:999px;padding:5px 10px}.bar{background:#eeedf5}.bar span{background:linear-gradient(90deg,#8c7ff6,#5d50d0)}
.meal-card{border:1px solid #e9e6f4!important;border-radius:18px!important;background:#fff!important;padding:18px!important;margin:12px 0!important}.preset-btn{border-radius:999px;background:#f3f1ff;border-color:#e5e0ff;color:#5c50c6}.preset-btn:hover{background:#e9e5ff}
.tablewrap{border-radius:15px;border-color:#e8e6f2}th{background:#f6f5fc}td,th{padding:13px 15px}
.aside-note{border-radius:15px;background:#faf9ff;border-color:#e8e5fa}
@media(max-width:1000px){main{padding:22px}.layout{grid-template-columns:205px minmax(0,1fr)}}
@media(max-width:700px){header{height:66px;padding:0 14px}.layout{display:block}main{padding:16px 12px}.pagehead{align-items:flex-start;flex-direction:column}.pagehead h1{font-size:26px}.cards{gap:10px}.card,.panel{padding:16px;border-radius:17px}.fieldgrid{gap:11px}}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><button class="mobilemenu" id="mobileMenu" aria-label="메뉴">☰</button><span class="logo">FM</span><span>FIT 관리포털 <span class="sub">개인 건강관리</span></span></div>
    <div class="right"><span class="pill warn" id="syncStatusBadge">오프라인 모드</span><span class="sub" id="todayTop"></span></div>
  </header>
  <div class="layout" id="layout">
    <aside>
      <div class="navlabel">WORKSPACE</div>
      <button class="nav active" data-page="dashboard">▦ 대시보드</button>
      <button class="nav" data-page="daily">▤ 식단·체중 기록</button>
      <button class="nav" data-page="exercise">🏋 웨이트 기록</button>
      <button class="nav" data-page="cardio">🏃 유산소 기록</button>
      <button class="nav" data-page="weekly">▥ 주별 관리</button>
      <button class="nav" data-page="monthly">▦ 월별 관리</button>
      <button class="nav" data-page="inbody">📈 인바디 분석·추이</button>
      <div class="navlabel">DATA MANAGEMENT</div>
      <button class="nav" data-page="reports">⇩ 실적·엑셀 다운로드</button>
      <button class="nav" data-page="settings">⚙ 기본 정보·목표 설정</button>
      <div class="aside-note"><b>사용 안내</b><br>로그인하면 각자의 클라우드 데이터가 안전하게 동기화됩니다.</div>
    </aside>
    <main id="main"></main>
  </div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)], todayISO=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const defaultData={profile:{height:173.7,weightStart:69,calorieTarget:1720,proteinTarget:138,bmr:1480,muscle:28.8,fatRate:26.5,weeklyWorkouts:4,weightGoal:65,notes:''},records:{},weekly:{},monthly:{}};
let db;try{db=JSON.parse(localStorage.getItem('fitManagerDB'))||structuredClone(defaultData)}catch(e){db=JSON.parse(JSON.stringify(defaultData))}let page='dashboard',selectedDate=todayISO();

const presets = [
  { name: '공기밥', cal: 300, protein: 6 },
  { name: '닭가슴살(100g)', cal: 120, protein: 23 },
  { name: '삶은 계란(1개)', cal: 75, protein: 6 },
  { name: '프로틴 쉐이크', cal: 150, protein: 25 },
  { name: '고구마(中)', cal: 130, protein: 2 },
  { name: '바나나(1개)', cal: 90, protein: 1 },
  { name: '라면(1봉)', cal: 500, protein: 10 }
];

function save(){try{localStorage.setItem('fitManagerDB',JSON.stringify(db));if(window.fitCloudSaveHook)window.fitCloudSaveHook(db);return true}catch(e){alert('저장 공간이 부족합니다.');return false}}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function n(v){return Number(v)||0}

function rec(d){
  if(!db.records[d]){
    db.records[d]={date:d,weight:'',workout:'',duration:'',sets:'',cardio:'',notes:'',files:[],review:'',
      meals:{ breakfast:{items:[],note:''}, lunch:{items:[],note:''}, dinner:{items:[],note:''}, snacks:{items:[],note:''} }
    };
  }
  let r=db.records[d];
  if(!r.meals){
    r.meals={ breakfast:{items:[],note:r.breakfast||''}, lunch:{items:[],note:r.lunch||''}, dinner:{items:[],note:r.dinner||''}, snacks:{items:[],note:r.snacks||''} };
  }
  return r;
}

function calcMealTotals(d){
  let r=rec(d), cal=0, protein=0;
  ['breakfast','lunch','dinner','snacks'].forEach(type=>{
    (r.meals[type].items||[]).forEach(it=>{
      cal += (n(it.cal) * n(it.qty||1));
      protein += (n(it.protein) * n(it.qty||1));
    });
  });
  return { cal, protein };
}

function weekDates(date){let d=new Date(date+'T12:00:00'),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return Array.from({length:7},(_,i)=>{let x=new Date(d);x.setDate(d.getDate()+i);return x.toISOString().slice(0,10)})}
function recordsFor(ds){return ds.map(d=>({date:d,...rec(d)})).filter(r=>{let t=calcMealTotals(r.date);return t.cal>0||r.weight||r.files?.length||r.workout;})}
function fmtDate(d){return d?d.replaceAll('-','.'):''}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}
function sum(ds){
  let rs=recordsFor(ds);
  return {rs,cal:ds.reduce((a,d)=>a+calcMealTotals(d).cal,0),protein:ds.reduce((a,d)=>a+calcMealTotals(d).protein,0),days:rs.filter(r=>String(r.workout||'').trim()).length,minutes:rs.reduce((a,r)=>a+n(r.duration),0)}
}

function head(title,desc,actions=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div><div class="right">${actions}</div></div>`}
function metric(label,value,foot=''){return `<div class="card"><div class="metric-label">${label}</div><div class="metric">${value}</div><div class="hint">${foot}</div></div>`}
function navTo(p){page=p;$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#layout').classList.remove('menuopen');render()}

function render(){const main=$('#main');if(page==='exercise'){main.innerHTML=exercisePage();wireExercise();return}if(page==='cardio'){main.innerHTML=cardioPage();wireCardio();return}if(page==='dashboard')main.innerHTML=dashboard();if(page==='daily'){main.innerHTML=daily();wireDaily();return}if(page==='weekly')main.innerHTML=weekly();if(page==='monthly')main.innerHTML=monthly();if(page==='inbody'){main.innerHTML=inbodyPage();wireInbody();return}if(page==='reports')main.innerHTML=reports();if(page==='settings')main.innerHTML=settings();wire();}

function dashboard(){
  let ds=weekDates(todayISO()),s=sum(ds),todayTotals=calcMealTotals(todayISO()),today=rec(todayISO()),goal=n(db.profile.weeklyWorkouts)||4,calGoal=n(db.profile.calorieTarget)||1720,proteinGoal=n(db.profile.proteinTarget)||138,weekPct=pct(s.days,goal);
  return `${head('대시보드','운동과 스마트 식단 실적을 한눈에 확인합니다.',`<button class="primary" data-go="daily">＋ 오늘 기록 입력</button>`)}
  <div class="cards">
    ${metric('오늘 섭취 칼로리',`${Math.round(todayTotals.cal).toLocaleString()}<small> / ${calGoal.toLocaleString()} kcal</small>`, `달성률 ${pct(todayTotals.cal, calGoal)}%`)}
    ${metric('오늘 단백질 섭취',`${Math.round(todayTotals.protein)}<small> / ${proteinGoal} g</small>`, `달성률 ${pct(todayTotals.protein, proteinGoal)}%`)}
    ${metric('이번 주 운동 횟수',`${s.days}<small>회</small>`, `목표 ${goal}회`)}
    ${metric('이번 주 운동 시간',`${s.minutes}<small>분</small>`, '누적 시간')}
  </div>
  <section class="panel"><div class="panelhead"><h2>📈 최근 인바디</h2><button data-go="inbody">인바디 분석 열기 →</button></div>${inbodySummary()}</section>
  <section class="panel"><div class="panelhead"><h2>최근 기록</h2><button data-go="reports">전체 기록 조회 →</button></div>${recordTable(recordsFor(Object.keys(db.records).sort().reverse()).slice(0,6))}</section>`
}

function daily(){
  let r=rec(selectedDate), totals=calcMealTotals(selectedDate), calGoal=n(db.profile.calorieTarget)||1720, proteinGoal=n(db.profile.proteinTarget)||138;
  let calPct=pct(totals.cal, calGoal), proteinPct=pct(totals.protein, proteinGoal);
  const mealTypes = [{ key: 'breakfast', name: '🌅 아침' }, { key: 'lunch', name: '☀️ 점심' }, { key: 'dinner', name: '🌙 저녁' }, { key: 'snacks', name: '☕ 간식 & 음료' }];
  return `${head('식단·체중 기록','수량 조절 및 특이사항 메모 작성이 가능합니다.',`<button data-action="today">오늘 날짜</button>`)}
  <section class="panel">
    <div class="fieldgrid">
      <div class="field"><label>기록 날짜</label><input type="date" id="date" value="${selectedDate}"></div>
      <div class="field"><label>오늘 체중 (kg)</label><input id="weight" type="number" step="0.1" min="0" value="${esc(r.weight)}" placeholder="예: 69.0"></div>
    </div>
    <div style="background:var(--accentbg); padding:15px; border-radius:10px; margin:16px 0;">
      <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-weight:bold;">
        <span>🔥 오늘 섭취: ${Math.round(totals.cal)} / ${calGoal.toLocaleString()} kcal (${calPct}%)</span>
        <span>💪 단백질: ${Math.round(totals.protein)} / ${proteinGoal} g (${proteinPct}%)</span>
      </div>
      <div class="bar" style="height:12px;"><span style="width:${calPct}%"></span></div>
    </div>
    <div style="margin-bottom:20px;">
      <label style="display:block; margin-bottom:8px;">⚡ 자주 먹는 음식 빠른 추가</label>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        ${[...presets,...(db.profile.customFoods||[])].map((p,i)=>`<button class="preset-btn" data-add-preset="${esc(p.name)}" data-cal="${p.cal}" data-protein="${p.protein}">＋ ${esc(p.name)} (${p.cal}kcal)</button>`).join('')}
      </div>
    </div>
    <div class="panel section" style="padding:14px;margin-bottom:18px;">
      <h3 style="margin:0 0 10px;font-size:15px;">📌 나만의 음식 등록</h3>
      <p class="mini-note">자주 먹는 음식을 저장하면 다음부터 빠른 추가 버튼으로 사용할 수 있어요. 영양정보는 제품 라벨이나 신뢰할 수 있는 자료를 확인해 입력하세요.</p>
      <div class="fieldgrid">
        <div class="field"><label>음식 이름</label><input id="customFoodName" placeholder="예: 그릭요거트 100g"></div>
        <div class="field"><label>기준 수량</label><input id="customFoodUnit" placeholder="예: 1개, 100g (선택)"></div>
        <div class="field"><label>칼로리 (kcal)</label><input id="customFoodCal" type="number" min="0" placeholder="예: 95"></div>
        <div class="field"><label>단백질 (g)</label><input id="customFoodProtein" type="number" min="0" placeholder="예: 10"></div>
      </div>

function wireDaily(){
  const d=$('#date');if(d)d.onchange=()=>{selectedDate=d.value||todayISO();render()};
  const w=$('#weight');if(w)w.onchange=()=>{let r=rec(selectedDate);r.weight=w.value;save()}; $$('.meal-note-input').forEach(ta=>{const updateNote=()=>{let r=rec(selectedDate);r.meals[ta.dataset.mealKey].note=ta.value.trim();save();const box=$('#mealEvaluation');if(box)box.innerHTML=mealEvaluation(selectedDate)};ta.onchange=updateNote;ta.oninput=updateNote});$$('[data-add-preset]').forEach(b=>{b.onclick=()=>{let r=rec(selectedDate);r.meals[$('#addMealType')?.value||'lunch'].items.push({name:b.dataset.addPreset,cal:Number(b.dataset.cal),protein:Number(b.dataset.protein),qty:1});save();render()}});const saveFood=$('#saveCustomFood');if(saveFood)saveFood.onclick=()=>{let name=$('#customFoodName').value.trim(),cal=$('#customFoodCal').value,protein=$('#customFoodProtein').value,unit=$('#customFoodUnit').value.trim();if(!name||cal===''||protein===''){alert('음식 이름, 칼로리, 단백질을 입력해 주세요.');return}db.profile.customFoods=db.profile.customFoods||[];const existing=db.profile.customFoods.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());const item={name,unit,cal:Number(cal),protein:Number(protein)};if(existing>=0)db.profile.customFoods[existing]=item;else db.profile.customFoods.push(item);save();alert('나만의 음식으로 등록했습니다.');render()};const mealNameInput=$('#addMealName');const applySavedFood=()=>{if(!mealNameInput)return;const typed=mealNameInput.value.trim().toLocaleLowerCase();const food=(db.profile.customFoods||[]).find(f=>String(f.name).trim().toLocaleLowerCase()===typed);if(food){$('#addMealCal').value=food.cal??'';$('#addMealProtein').value=food.protein??'';const qty=$('#addMealQty');if(qty&&!qty.value)qty.value=1;mealNameInput.dataset.savedFood='1'}else if(mealNameInput.dataset.savedFood==='1'){mealNameInput.dataset.savedFood='0';$('#addMealCal').value='';$('#addMealProtein').value=''}};if(mealNameInput){mealNameInput.addEventListener('input',applySavedFood);mealNameInput.addEventListener('change',applySavedFood);mealNameInput.addEventListener('blur',applySavedFood)}$('#btnAddMealItem').onclick=()=>{let type=$('#addMealType').value,name=$('#addMealName').value.trim();if(!name)return;applySavedFood();let r=rec(selectedDate);r.meals[type].items.push({name,cal:Number($('#addMealCal').value)||0,protein:Number($('#addMealProtein').value)||0,qty:Number($('#addMealQty').value)||1});save();render()}; $$('[data-qty-change]').forEach(b=>{let [t,i,diff]=b.dataset.qtyChange.split(':');b.onclick=()=>{let item=rec(selectedDate).meals[t].items[Number(i)];if(item){item.qty=Math.max(0.5,(Number(item.qty)||1)+Number(diff));save();render()}}});$$('[data-del-item]').forEach(b=>{let [t,i]=b.dataset.delItem.split(':');b.onclick=()=>{rec(selectedDate).meals[t].items.splice(Number(i),1);save();render()}});$('#btnSaveDaily').onclick=()=>{save();alert('저장되었습니다.');};const ev=$('#btnMealEvaluate');if(ev)ev.onclick=()=>{const box=$('#mealEvaluation');if(box)box.innerHTML=mealEvaluation(selectedDate)};
}

function weekly(){let ds=weekDates(selectedDate),s=sum(ds),goal=n(db.profile.weeklyWorkouts)||4,calGoal=n(db.profile.calorieTarget)||1720,proteinGoal=n(db.profile.proteinTarget)||138;return `${head('주별 관리','선택한 날짜가 포함된 주의 식단·운동·체중 기록입니다.',`<input type="date" id="periodDate" value="${selectedDate}">`)}<section class="panel"><div class="cards section">${metric('운동 횟수',`${s.days}회`,`목표 ${goal}회`)}${metric('하루 평균 열량',`${Math.round(s.cal/7).toLocaleString()} kcal`,`목표 ${calGoal} kcal`)}${metric('하루 평균 단백질',`${Math.round(s.protein/7)} g`,`목표 ${proteinGoal} g`)}${metric('기록 일수',`${s.rs.length}/7일`,'식단·체중·운동 기록')}</div><div class="progress-row">운동 목표 달성률 <b>${pct(s.days,goal)}%</b><div class="bar"><span style="width:${pct(s.days,goal)}%"></span></div></div><h2>요일별 기록</h2>${recordTable(ds.map(d=>({date:d,...rec(d)})).filter(r=>{let t=calcMealTotals(r.date);return t.cal>0||r.weight||String(r.workout||'').trim()}))}<h2 style="margin-top:20px">주간 체중 추이</h2>${ds.filter(d=>rec(d).weight).map(d=>`<div class="statline"><span>${fmtDate(d)}</span><b>${esc(rec(d).weight)} kg</b></div>`).join('')||'<p class="muted">체중 기록이 없습니다.</p>'}</section>`}
function monthly(){let ym=selectedDate.slice(0,7),ds=Array.from({length:new Date(Number(ym.slice(0,4)),Number(ym.slice(5,7)),0).getDate()},(_,i)=>`${ym}-${String(i+1).padStart(2,'0')}`),s=sum(ds),logged=ds.filter(d=>{let r=rec(d),t=calcMealTotals(d);return t.cal>0||r.weight||String(r.workout||'').trim()}).length,avgCal=Math.round(s.cal/ds.length),avgProtein=Math.round(s.protein/ds.length);return `${head('월별 관리','월간 실적과 꾸준함을 확인합니다.',`<input type="month" id="monthDate" value="${ym}">`)}<section class="panel"><div class="cards section">${metric('기록률',`${Math.round(logged/ds.length*100)}%`,`${logged}/${ds.length}일`)}${metric('총 섭취 열량',`${s.cal.toLocaleString()} kcal`,'월간 합계')}${metric('하루 평균 열량',`${avgCal.toLocaleString()} kcal`,'목표와 비교')}${metric('하루 평균 단백질',`${avgProtein} g`,'목표와 비교')}${metric('운동 일수',`${s.days}일`,`목표 참고: ${n(db.profile.weeklyWorkouts)||4}회/주`)}</div><h2>월간 코칭 요약</h2><p>${logged===0?'아직 기록이 없습니다. 먼저 식단·체중·운동을 기록해 보세요.':`이번 달 ${logged}일 기록했습니다. ${avgCal>(n(db.profile.calorieTarget)||1720)*1.1?'평균 열량이 목표보다 높습니다. 식사량과 간식 빈도를 점검해 보세요.':avgCal<(n(db.profile.calorieTarget)||1720)*0.75?'평균 열량이 목표보다 낮습니다. 지나친 제한은 피하고 컨디션을 함께 확인하세요.':'평균 열량은 목표 범위와 비교해 확인할 수 있습니다.'} ${avgProtein<(n(db.profile.proteinTarget)||138)*0.8?'단백질 섭취를 조금 더 챙겨보세요.':'단백질 섭취 기록도 꾸준히 이어가세요.'}`}</p>${recordTable(ds.map(d=>({date:d,...rec(d)})).filter(r=>{let t=calcMealTotals(r.date);return t.cal>0||r.weight||String(r.workout||'').trim()}))}</section>`}
function mealEvaluation(d){
  const t=calcMealTotals(d),calGoal=n(db.profile.calorieTarget)||1720,pGoal=n(db.profile.proteinTarget)||138,r=rec(d);
  const keys=['breakfast','lunch','dinner','snacks'];
  const notes=keys.map(k=>({meal:k,text:String(r.meals[k].note||'').trim()})).filter(x=>x.text);
  if(!t.cal&&!t.protein&&!notes.length)return '아직 음식 기록이 없습니다. 음식과 수량, 조리법·남긴 양·짠맛 관련 메모를 입력하면 목표 대비 평가가 표시됩니다.';
  const noteText=notes.map(x=>x.text).join(' '), allFood=keys.flatMap(k=>(r.meals[k].items||[]).map(it=>({meal:k,...it}))), soupWords=/국|찌개|탕|라면|우동|짬뽕|국밥|육수|soup|ramen/i;
  const brothLeft=/국물.{0,8}(적게|조금|반|거의 안|남겼|남김|안 먹|마시지 않)|국물을?\s*(남겼|안 먹|조금만|거의 안)|국물은?\s*(거의 안|조금만|남겼)|국물 남김/i.test(noteText);
  let estimatedReduction=0;
  if(brothLeft){
    const soupCal=allFood.filter(it=>soupWords.test(String(it.name||''))).reduce((a,it)=>a+n(it.cal)*n(it.qty||1),0);
    estimatedReduction=Math.min(150,Math.round(soupCal*0.12));
    if(!soupCal&&/라면|국밥|찌개|탕|짬뽕|우동|국/i.test(noteText))estimatedReduction=Math.min(80,Math.round(t.cal*0.05));
  }
  const adjustedCal=Math.max(0,Math.round(t.cal-estimatedReduction));
  const parts=[];
  parts.push(adjustedCal>calGoal*1.1?`메모를 반영한 추정 열량도 목표(${calGoal.toLocaleString()} kcal)보다 높습니다. 다음 식사는 튀김·기름진 소스나 간식 양을 줄이고 채소와 단백질 위주로 구성해 보세요.`:adjustedCal<calGoal*.75?`현재 추정 열량은 목표(${calGoal.toLocaleString()} kcal)의 75% 미만입니다. 하루 전체 기록인지 확인하고, 운동량이 많다면 균형 잡힌 식사로 보충하세요.`:`메모 반영 추정 열량은 ${calGoal.toLocaleString()} kcal 목표와 비교해 관리할 수 있는 범위입니다. 하루가 끝나기 전이라면 남은 식사 계획도 함께 고려하세요.`);
  parts.push(t.protein<pGoal*.8?`단백질은 ${Math.round(t.protein)} g으로 목표 ${pGoal} g의 80% 미만입니다. 다음 식사에 살코기·생선·달걀·두부·그릭요거트 중 하나를 추가해 보세요.`:`단백질은 ${Math.round(t.protein)} g입니다. 목표 ${pGoal} g 대비 ${pct(t.protein,pGoal)}% 달성했습니다.`);
  const sodiumFood=/라면|짬뽕|국밥|찌개|탕|김치|젓갈|장아찌|햄|소시지|베이컨|어묵|간장|쌈장|된장|소금|치킨|배달/i.test(allFood.map(it=>it.name).join(' '));
  const sodiumNote=/나트륨|염분|짠|짜게|짰|간이 세|짠맛|소금 많이|간장 많이/i.test(noteText);
  if(sodiumFood||sodiumNote){
    parts.push(sodiumNote?'나트륨 섭취가 많았다고 기록했어요. 다음 끼니는 국물·소스·절임 반찬을 줄이고, 간을 추가하기 전에 맛을 확인해 보세요.':'기록한 음식 중 나트륨이 높을 수 있는 메뉴가 있습니다. 특히 국물은 적게 먹고, 소스·김치·절임 반찬을 한 끼에 겹쳐 먹지 않도록 조절해 보세요.');
    parts.push('물은 갈증에 맞춰 충분히 마시고, 다음 끼니를 굶어 만회하기보다는 평소 식사 균형을 회복하는 편이 좋습니다.');
  }
  if(brothLeft){
    parts.push(`국물을 적게 먹었다는 메모를 반영해 열량을 약 ${estimatedReduction} kcal 낮춘 값으로 평가했어요. 이는 국물 섭취량을 실제로 계량한 값이 아니라 보수적인 추정치입니다.`);
  }
  if(/튀김|기름|볶음|돈까스|치킨|크림|마요/i.test(allFood.map(it=>it.name).join(' '))||/기름|튀김|소스 많이/i.test(noteText))parts.push('기름진 조리법이나 소스가 있었다면 다음에는 굽기·찜·에어프라이어 조리 또는 소스 별도 제공을 선택하면 열량을 줄이기 쉽습니다.');
  if(notes.length)parts.push('반영한 식사 메모: '+notes.map(x=>x.text).join(' / '));
  return `<b>기입 열량 ${Math.round(t.cal)} kcal · 메모 반영 추정 ${adjustedCal} kcal · 단백질 ${Math.round(t.protein)} g</b>${estimatedReduction?`<div class="mini-note">국물 섭취 메모 추정 조정: −${estimatedReduction} kcal</div>`:''}<ul style="margin:10px 0 0;padding-left:20px">${parts.map(x=>`<li style="margin:6px 0">${esc(x)}</li>`).join('')}</ul><div class="mini-note">참고: 음식명과 메모에 기반한 규칙형 추정이며, 실제 영양 분석이나 나트륨 함량 측정은 아닙니다.</div>`;
}
function inbodySummary(){let arr=db.inbodyRecords||[];if(!arr.length)return '<p class="muted">저장된 인바디 기록이 없습니다. 측정 결과를 추가해 추이를 확인하세요.</p>';let r=arr.slice().sort((a,b)=>a.date.localeCompare(b.date)).at(-1);return `<div class="cards">${metric('최근 측정일',esc(r.date))}${metric('체중',r.weight?esc(r.weight)+' kg':'—')}${metric('골격근량',r.muscle?esc(r.muscle)+' kg':'—')}${metric('체지방률',r.fatRate?esc(r.fatRate)+'%':'—')}</div>`}
function inbodyPage(){db.inbodyRecords=db.inbodyRecords||[];let arr=db.inbodyRecords.slice().sort((a,b)=>b.date.localeCompare(a.date));return `${head('인바디 분석·추이','이미지에서 값을 추출한 뒤 직접 수정하고 저장하세요.')}<section class="panel"><h2>인바디 이미지 등록</h2><div class="fieldgrid"><div class="field"><label>측정 결과 이미지</label><input id="inbodyImage" type="file" accept="image/*"><div id="ocrStatus" class="mini-note">이미지를 선택하면 OCR로 숫자를 읽어옵니다. 결과는 반드시 확인해 주세요.</div><img id="inbodyPreview" class="preview-img" style="display:none"></div><div class="field"><label>측정일</label><input id="ibDate" type="date" value="${todayISO()}"><label>체중 (kg)</label><input id="ibWeight" type="number" step="0.1"><label>골격근량 (kg)</label><input id="ibMuscle" type="number" step="0.1"><label>체지방량 (kg)</label><input id="ibFatMass" type="number" step="0.1"><label>체지방률 (%)</label><input id="ibFatRate" type="number" step="0.1"><label>BMI</label><input id="ibBMI" type="number" step="0.1"><label>메모</label><textarea id="ibNotes" placeholder="측정 조건, 컨디션 등"></textarea><button class="primary" id="ibSave">인바디 기록 저장</button></div></div></section><section class="panel"><h2>측정 기록 및 추이</h2>${arr.length?arr.map(r=>`<div class="statline"><div><b>${esc(r.date)}</b><div class="mini-note">체중 ${esc(r.weight||'—')} kg · 골격근량 ${esc(r.muscle||'—')} kg · 체지방률 ${esc(r.fatRate||'—')}%</div><div class="mini-note">${esc(r.notes||'')}</div></div><div><button data-ib-edit="${esc(r.id)}">불러오기</button> <button class="danger" data-ib-delete="${esc(r.id)}">삭제</button></div></div>`).join(''):'<p class="muted">저장된 기록이 없습니다.</p>'}</section>`}
function wireInbody(){const file=$('#inbodyImage');if(file)file.onchange=async()=>{let f=file.files[0];if(!f)return;let img=$('#inbodyPreview');img.src=URL.createObjectURL(f);img.style.display='block';let st=$('#ocrStatus');if(!window.Tesseract){st.textContent='OCR 라이브러리를 불러오지 못했습니다. 값을 직접 입력해 주세요.';return}st.textContent='이미지 글자를 인식하는 중...';try{let out=await Tesseract.recognize(f,'eng+kor');let text=out.data.text;st.textContent='인식 결과를 확인하고 각 칸에 맞는 값을 직접 수정해 주세요.';const patterns=[['ibWeight',/(?:weight|체중)[^0-9]{0,12}(\d{2,3}(?:\.\d)?)/i],['ibMuscle',/(?:skeletal muscle|골격근량)[^0-9]{0,12}(\d{1,2}(?:\.\d)?)/i],['ibFatMass',/(?:body fat mass|체지방량)[^0-9]{0,12}(\d{1,2}(?:\.\d)?)/i],['ibFatRate',/(?:percent body fat|체지방률)[^0-9]{0,12}(\d{1,2}(?:\.\d)?)/i],['ibBMI',/(?:BMI)[^0-9]{0,8}(\d{1,2}(?:\.\d)?)/i]];patterns.forEach(([id,re])=>{let m=text.match(re);if(m&&$('#'+id))$('#'+id).value=m[1]})}catch(e){st.textContent='인식 실패: 직접 입력해 주세요.'}};$('#ibSave').onclick=()=>{let r={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date:$('#ibDate').value||todayISO(),weight:$('#ibWeight').value,muscle:$('#ibMuscle').value,fatMass:$('#ibFatMass').value,fatRate:$('#ibFatRate').value,bmi:$('#ibBMI').value,notes:$('#ibNotes').value};if(!r.weight&&!r.muscle&&!r.fatRate&&!r.fatMass){alert('인바디 수치를 하나 이상 입력해 주세요.');return}db.inbodyRecords=db.inbodyRecords||[];db.inbodyRecords.push(r);save();render()};$$('[data-ib-delete]').forEach(b=>b.onclick=()=>{if(confirm('이 인바디 기록을 삭제할까요?')){db.inbodyRecords=(db.inbodyRecords||[]).filter(r=>r.id!==b.dataset.ibDelete);save();render()}});$$('[data-ib-edit]').forEach(b=>b.onclick=()=>{let r=(db.inbodyRecords||[]).find(x=>x.id===b.dataset.ibEdit);if(!r)return;$('#ibDate').value=r.date;$('#ibWeight').value=r.weight;$('#ibMuscle').value=r.muscle;$('#ibFatMass').value=r.fatMass;$('#ibFatRate').value=r.fatRate;$('#ibBMI').value=r.bmi;$('#ibNotes').value=r.notes;db.inbodyRecords=db.inbodyRecords.filter(x=>x.id!==r.id);save();window.scrollTo({top:0,behavior:'smooth'})});}

function cardioRows(){let rows=(db.cardioLogs||{})[selectedDate]||[];return rows.length?`<div class="tablewrap"><table><thead><tr><th>종류</th><th>시간</th><th>강도</th><th>거리(km)</th><th>메모</th><th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${esc(r.machine)}</td><td>${esc(r.minutes)}분</td><td>${esc(r.intensity||'보통')}</td><td>${esc(r.distance||'—')}</td><td>${esc(r.notes||'')}</td><td><button data-cardio-remove="${i}">삭제</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">아직 등록한 유산소 운동이 없습니다.</p>'}
function cardioPage(){db.cardioLogs=db.cardioLogs||{};return `${head('유산소 기록','헬스장 유산소 기구와 야외 활동을 등록하고 시간·강도를 기록하세요.')}<section class="panel"><div class="fieldgrid"><div class="field"><label>날짜</label><input id="cardioDate" type="date" value="${selectedDate}"></div><div class="field"><label>유산소 기구/운동</label><select id="cardioMachine">${cardioMachines.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>운동 시간 (분)</label><input id="cardioMinutes" type="number" min="1" step="1" placeholder="예: 25"></div><div class="field"><label>강도</label><select id="cardioIntensity"><option>가벼움</option><option selected>보통</option><option>높음</option></select></div><div class="field"><label>거리 (km, 선택)</label><input id="cardioDistance" type="number" min="0" step="0.1" placeholder="선택 입력"></div><div class="field"><label>메모 (선택)</label><input id="cardioNotes" placeholder="예: 경사도 5, 속도 6"></div></div><button class="primary" id="cardioAdd" style="margin-top:14px;">유산소 추가</button></section><section class="panel section"><h2>오늘의 유산소 목록</h2><div id="cardioRows">${cardioRows()}</div><button class="primary" id="cardioSave" style="margin-top:14px;">유산소 기록 저장</button></section>`}
function wireCardio(){const date=$('#cardioDate');date.onchange=()=>{selectedDate=date.value||todayISO();render()};$('#cardioAdd').onclick=()=>{let minutes=$('#cardioMinutes').value;if(!minutes||Number(minutes)<=0){alert('운동 시간을 분 단위로 입력해 주세요.');return}db.cardioLogs=db.cardioLogs||{};db.cardioLogs[selectedDate]=db.cardioLogs[selectedDate]||[];db.cardioLogs[selectedDate].push({machine:$('#cardioMachine').value,minutes,distance:$('#cardioDistance').value,intensity:$('#cardioIntensity').value,notes:$('#cardioNotes').value});save();render()};$$('[data-cardio-remove]').forEach(b=>b.onclick=()=>{db.cardioLogs[selectedDate].splice(Number(b.dataset.cardioRemove),1);save();render()});$('#cardioSave').onclick=()=>{save();alert('유산소 기록을 저장했습니다.');render()}}
</script>

<!-- 사용자별 개별 계정 로그인 및 클라우드 동기화 쉴드 레이어 -->
<style>
#fitCloudShield{position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:18px}
#fitCloudShield .fit-card{width:min(100%,480px);background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:25px;box-shadow:0 18px 60px #0002}
#fitCloudShield h1{font-size:22px;margin:0 0 8px}
#fitCloudShield .fit-fields,#fitCloudShield .fit-actions{display:grid;gap:10px;margin-top:14px}
#fitCloudShield .fit-status{padding:10px;border-radius:8px;background:var(--accentbg);font-size:13px;margin-top:10px;word-break:break-all}
#fitCloudLogout{display:none}
#fitCloudLogout.visible{display:inline-flex}
</style>
<div id="fitCloudShield" role="dialog">
  <div class="fit-card">
    <h1>FIT 건강관리 포털</h1>
    <p style="color:var(--muted);font-size:13px;">이메일로 로그인하여 개별 클라우드 데이터를 동기화하세요.</p>
    <div id="fitCloudForm">
      <div class="fit-fields">
        <div class="field"><label>이메일</label><input id="fitCloudEmail" type="email" placeholder="email@example.com"></div>
        <div class="field"><label>비밀번호</label><input id="fitCloudPassword" type="password" placeholder="비밀번호 (6자 이상)"></div>
      </div>
      <div class="fit-actions">
        <button class="primary" id="fitCloudLogin" type="button">로그인</button>
        <button id="fitCloudSignup" type="button">새 계정 만들기</button>
      </div>
    </div>
    <div id="fitCloudStatus" class="fit-status">계정 정보를 입력하세요.</div>
  </div>
</div>

<script>
(function(){
  const SUPABASE_URL='https://krbqcwjtpkkuqouhwxph.supabase.co', KEY='sb_publishable_uOx8W7EG9l4j4ClQ7orB3g_ED0MCgCN';
  let supa=null, user=null, ignore=false, busy=false, timer=null;

  function say(msg){
    const el = document.getElementById('fitCloudStatus');
    if(el) el.textContent = msg;
  }

  window.fitApp = { get db(){return db}, set db(v){db=v}, save:save, render:render };

  async function getRow(){
    const {data,error} = await supa.from('fit_manager_data').select('data').eq('user_id', user.id).maybeSingle();
    if(error) throw error;
    return data || null;
  }

  async function put(x){
    const {error} = await supa.from('fit_manager_data').upsert({user_id:user.id, data:x, updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(error) throw error;
  }

  async function activate(data){
    ignore = true;
    db = data;
    save();
    render();
    document.getElementById('fitCloudShield').style.display='none';
    const logoutBtn = document.getElementById('fitCloudLogout');
    if(logoutBtn) logoutBtn.classList.add('visible');
    const badge = document.getElementById('syncStatusBadge');
    if(badge){ badge.textContent='클라우드 동기화'; badge.className='pill good'; }
    ignore = false;
    say('로그인 완료');
  }

  async function signedIn(u){
    user = u;
    say('개별 클라우드 데이터 로딩 중...');
    try{
      const row = await getRow();
      if(row && row.data){ await activate(row.data); }
      else { await put(db); await activate(db); }
    } catch(e) {
      document.getElementById('fitCloudShield').style.display='flex';
      say('동기화 오류: ' + (e.message || e));
    }
  }

  async function handleLogin(){
    const email = document.getElementById('fitCloudEmail').value.trim();
    const password = document.getElementById('fitCloudPassword').value;
    if(!email || !password){ say('이메일과 비밀번호를 모두 입력해 주세요.'); return; }
    say('로그인 인증 중...');
    try {
      if(!supa && window.supabase){ supa = window.supabase.createClient(SUPABASE_URL, KEY); }
      const { data, error } = await supa.auth.signInWithPassword({ email, password });
      if(error) throw error;
      await signedIn(data.user);
    } catch(e) {
      say('로그인 실패: ' + (e.message || String(e)));
    }
  }

  async function handleSignup(){
    const email = document.getElementById('fitCloudEmail').value.trim();
    const password = document.getElementById('fitCloudPassword').value;
    if(!email || password.length < 6){ say('올바른 이메일과 6자 이상의 비밀번호를 입력해 주세요.'); return; }
    say('회원가입 요청 중...');
    try {
      if(!supa && window.supabase){ supa = window.supabase.createClient(SUPABASE_URL, KEY); }
      const { data, error } = await supa.auth.signUp({ email, password });
      if(error) throw error;
      if(data.session) await signedIn(data.session.user);
      else say('회원가입이 완료되었습니다. 로그인해 주세요.');
    } catch(e) {
      say('회원가입 실패: ' + (e.message || String(e)));
    }
  }

  window.fitCloudSaveHook = function(currentDB){
    if(user && !ignore){
      if(timer) clearTimeout(timer);
      timer = setTimeout(async ()=>{
        if(busy) return;
        busy = true;
        try { await put(currentDB); } catch(e){}
        finally { busy = false; }
      }, 800);
    }
  };

  document.addEventListener('DOMContentLoaded', ()=>{
    document.getElementById('fitCloudLogin').addEventListener('click', handleLogin);
    document.getElementById('fitCloudSignup').addEventListener('click', handleSignup);

    const logout = document.createElement('button');
    logout.id = 'fitCloudLogout';
    logout.textContent = '로그아웃';
    logout.addEventListener('click', async ()=>{
      if(supa) await supa.auth.signOut();
      user = null;
      document.getElementById('fitCloudShield').style.display='flex';
      say('로그아웃되었습니다.');
    });

    const targetHeader = document.querySelector('header .right');
    if(targetHeader) targetHeader.insertBefore(logout, targetHeader.firstChild);

    try {
      if(window.supabase){
        supa = window.supabase.createClient(SUPABASE_URL, KEY);
        supa.auth.getSession().then(({data})=>{
          if(data && data.session) signedIn(data.session.user);
        }).catch(()=>{ say('계정 정보를 입력 후 로그인하세요.'); });
      } else {
        say('Supabase 라이브러리를 로드하지 못했습니다.');
      }
    } catch(err){
      say('초기화 에러: ' + err.message);
    }
  });
})();
</script>
</body>
</html>
