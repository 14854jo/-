<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f6fa,#111827);--surface:light-dark(#fff,#1f2937);--surface2:light-dark(#f8fafc,#273449);--text:light-dark(#172033,#f3f4f6);--muted:light-dark(#64748b,#aab6c8);--border:light-dark(#e2e8f0,#3b4658);--accent:light-dark(#2457c5,#8db2ff);--accentbg:light-dark(#eaf0ff,#243b64);--green:light-dark(#16845b,#5ed6a5);--amber:light-dark(#a8650b,#f5bd62);--red:light-dark(#b83c45,#ff8e96)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;font-size:15px}
.app{min-height:100vh;background:var(--bg)}

.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px}

.sub{font-size:12px;color:var(--muted);font-weight:500}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 68px)}
aside{background:var(--surface);border-right:1px solid var(--border);padding:20px 13px}
.navlabel{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em;padding:12px 12px 8px}

.primary{background:#2457c5;color:#fff;border-color:#2457c5}

.section{margin-top:16px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}

.pill.good{background:light-dark(#e5f7ef,#174b3a);color:var(--green)}

.muted{color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.notice{padding:12px 14px;border-radius:9px;background:var(--accentbg);color:var(--text);font-size:13px;line-height:1.6;margin-bottom:16px}

<body>
<div class="app" id="app">

      <div class="aside-note"><b>사용 안내</b><br>로그인하면 각자의 클라우드 데이터가 안전하게 동기화됩니다.</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)], todayISO=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const defaultData={profile:{height:173.7,weightStart:69,calorieTarget:1720,proteinTarget:138,bmr:1480,muscle:28.8,fatRate:26.5,weeklyWorkouts:4,weightGoal:65,notes:''},records:{},weekly:{},monthly:{}};
let db;try{db=JSON.parse(localStorage.getItem('fitManagerDB'))||structuredClone(defaultData)}catch(e){db=JSON.parse(JSON.stringify(defaultData))}let page='dashboard',selectedDate=todayISO();
let wsProfile=null,wsProfiles=[],wsEntries=[],editingInbodyId=null;

const presets = [
  { name: '공기밥', cal: 300, protein: 6 },
  { name: '닭가슴살(100g)', cal: 120, protein: 23 },
  { name: '삶은 계란(1개)', cal: 75, protein: 6 },
  { name: '프로틴 쉐이크', cal: 150, protein: 25 },
  { name: '고구마(中)', cal: 130, protein: 2 },
  { name: '바나나(1개)', cal: 90, protein: 1 },
  { name: '라면(1봉)', cal: 500, protein: 10 }
];

function save(){try{localStorage.setItem('fitManagerDB',JSON.stringify(db));if(window.fitCloudSaveHook)window.fitCloudSaveHook(db);return true}catch(e){alert('저장 공간이 부족합니다.');return false}}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function n(v){return Number(v)||0}

function rec(d){
  if(!db.records[d]){
    db.records[d]={date:d,weight:'',workout:'',duration:'',sets:'',cardio:'',notes:'',files:[],review:'',
      meals:{ breakfast:{items:[],note:''}, lunch:{items:[],note:''}, dinner:{items:[],note:''}, snacks:{items:[],note:''} }
    };
  }
  let r=db.records[d];
  if(!r.meals){
    r.meals={ breakfast:{items:[],note:r.breakfast||''}, lunch:{items:[],note:r.lunch||''}, dinner:{items:[],note:r.dinner||''}, snacks:{items:[],note:r.snacks||''} };
  }
  return r;
}

function calcMealTotals(d){
  let r=rec(d), cal=0, protein=0;
  ['breakfast','lunch','dinner','snacks'].forEach(type=>{
    (r.meals[type].items||[]).forEach(it=>{
      cal += (n(it.cal) * n(it.qty||1));
      protein += (n(it.protein) * n(it.qty||1));
    });
  });
  return { cal, protein };
}

function weekDates(date){let d=new Date(date+'T12:00:00'),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return Array.from({length:7},(_,i)=>{let x=new Date(d);x.setDate(d.getDate()+i);return x.toISOString().slice(0,10)})}
function recordsFor(ds){return ds.map(d=>({date:d,...rec(d)})).filter(r=>{let t=calcMealTotals(r.date);return t.cal>0||r.weight||r.files?.length||r.workout;})}
function fmtDate(d){return d?d.replaceAll('-','.'):''}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}
function sum(ds){
  let rs=recordsFor(ds);
  return {rs,cal:ds.reduce((a,d)=>a+calcMealTotals(d).cal,0),protein:ds.reduce((a,d)=>a+calcMealTotals(d).protein,0),days:rs.filter(r=>String(r.workout||'').trim()).length,minutes:rs.reduce((a,r)=>a+n(r.duration),0)}
}

function head(title,desc,actions=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div><div class="right">${actions}</div></div>`}
function metric(label,value,foot=''){return `<div class="card"><div class="metric-label">${label}</div><div class="metric">${value}</div><div class="hint">${foot}</div></div>`}
function navTo(p){page=p;$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#layout').classList.remove('menuopen');render()}

function render(){const main=$('#main');if(page==='exercise'){main.innerHTML=exercisePage();wireExercise();return}if(page==='cardio'){main.innerHTML=cardioPage();wireCardio();return}if(page==='workspace'){main.innerHTML=workspacePage();wireWorkspace();return}if(page==='companion'){main.innerHTML=companionPage();wireCompanion();return}if(page==='dashboard')main.innerHTML=dashboard();if(page==='daily'){main.innerHTML=daily();wireDaily();return}if(page==='weekly')main.innerHTML=weekly();if(page==='monthly')main.innerHTML=monthly();if(page==='inbody'){main.innerHTML=inbodyPage();wireInbody();return}if(page==='reports')main.innerHTML=reports();if(page==='settings')main.innerHTML=settings();wire();if(page==='dashboard')loadDashboardRanking();}

function dashboard(){
  let ds=weekDates(todayISO()),s=sum(ds),todayTotals=calcMealTotals(todayISO()),today=rec(todayISO()),goal=n(db.profile.weeklyWorkouts)||4,calGoal=n(db.profile.calorieTarget)||1720,proteinGoal=n(db.profile.proteinTarget)||138,weekPct=pct(s.days,goal);
  return `${head('대시보드','운동과 스마트 식단 실적을 한눈에 확인합니다.',`<button class="primary" data-go="daily">＋ 오늘 기록 입력</button>`)}
  <div class="cards">
    ${metric('오늘 섭취 칼로리',`${Math.round(todayTotals.cal).toLocaleString()}<small> / ${calGoal.toLocaleString()} kcal</small>`, `달성률 ${pct(todayTotals.cal, calGoal)}%`)}
    ${metric('오늘 단백질 섭취',`${Math.round(todayTotals.protein)}<small> / ${proteinGoal} g</small>`, `달성률 ${pct(todayTotals.protein, proteinGoal)}%`)}
    ${metric('이번 주 운동 횟수',`${s.days}<small>회</small>`, `목표 ${goal}회`)}
    ${metric('이번 주 운동 시간',`${s.minutes}<small>분</small>`, '누적 시간')}
  </div>
  <section class="panel community-preview"><div class="panelhead"><h2>🏆 운동 공유 랭킹</h2><button data-go="workspace">워크스페이스 열기 →</button></div><p class="mini-note">공유를 선택한 운동만 순위와 피드에 반영됩니다. 체중·체지방은 별도 동의가 있어야 표시됩니다.</p><div id="dashboardRanks"><div class="empty">랭킹을 불러오는 중…</div></div><div class="actions"><button data-go="companion">🐾 내 동물과 포인트 확인</button></div></section>
  <section class="panel"><div class="panelhead"><h2>📈 최근 인바디</h2><button data-go="inbody">인바디 분석 열기 →</button></div>${inbodySummary()}</section>
  <section class="panel"><div class="panelhead"><h2>최근 기록</h2><button data-go="reports">전체 기록 조회 →</button></div>${recentActivitySummary()}</section>`
}

const FIT_ANIMALS=[
  {id:'cat',name:'고양이',emoji:'🐱'},{id:'dog',name:'강아지',emoji:'🐶'},{id:'fox',name:'여우',emoji:'🦊'},
  {id:'rabbit',name:'토끼',emoji:'🐰'},{id:'bear',name:'곰',emoji:'🐻'},{id:'panda',name:'판다',emoji:'🐼'},
  {id:'penguin',name:'펭귄',emoji:'🐧'},{id:'otter',name:'수달',emoji:'🦦'},{id:'duck',name:'오리',emoji:'🦆'}
];
function animalInfo(id){return FIT_ANIMALS.find(a=>a.id===id)||FIT_ANIMALS[0]}
function animalOptions(selected){return FIT_ANIMALS.map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${a.emoji} ${a.name}</option>`).join('')}
const GROWTH_STAGES=[{name:'아기',need:0},{name:'꼬마',need:50},{name:'성장기',need:100},{name:'성체',need:150},{name:'슈퍼스타',need:200}];
const BEAR_DUCK_STAGES={
  bear:[{name:'곰 알',need:0},{name:'아기 곰',need:50},{name:'새끼 곰',need:100},{name:'청소년 곰',need:150},{name:'성체 곰',need:200},{name:'영웅 곰 (전설)',need:250}],
  duck:[{name:'오리 알',need:0},{name:'아기 오리',need:50},{name:'활동적인 오리',need:100},{name:'청소년 오리',need:150},{name:'성체 오리',need:200},{name:'영웅 오리 (전설)',need:250}]
};
const GROWTH_EMOJI={cat:['🐾','🐱','😺','🐈','🐈‍⬛'],dog:['🐾','🐶','🐕✨','🐕💪','🐕👑'],fox:['🐾','🦊','🦊✨','🦊💫','🦊👑'],rabbit:['🐾','🐰','🐇','🐇','🐰'],bear:['🥚','🐻','🐻🌿','🐻🧢','🐻💪','🐻👑'],panda:['🐾','🐼','🐼✨','🐼💫','🐼👑'],penguin:['🥚','🐣','🐧✨','🐧💫','🐧👑'],otter:['🐾','🦦','🦦✨','🦦💫','🦦👑'],duck:['🥚','🐣','🐤','🦆✨','🦆🎓','🦆👑']};
const GROWTH_LABELS={bear:BEAR_DUCK_STAGES.bear.map(x=>x.name),duck:BEAR_DUCK_STAGES.duck.map(x=>x.name)};
function animalGrowthStages(id){return BEAR_DUCK_STAGES[id]||GROWTH_STAGES}
function animalGrowthEmoji(id,level){const seq=GROWTH_EMOJI[id]||GROWTH_EMOJI.cat;return seq[Math.min(seq.length-1,Math.max(0,level-1))]}
function animalLevelLabel(id,level){if(BEAR_DUCK_STAGES[id])return ['Lv.1','Lv.10','Lv.20','Lv.30','Lv.40','Lv.50+'][Math.min(5,Math.max(0,level-1))];return `LEVEL ${level}`}
function growthPathHtml(id,level){const a=animalInfo(id),stages=animalGrowthStages(id),labels=GROWTH_LABELS[id]||stages.map(x=>x.name),stage=Math.min(stages.length,Math.max(1,level));return `<div class="growth-path" style="grid-template-columns:repeat(${stages.length},minmax(0,1fr))" aria-label="동물 성장 단계">${stages.map((g,i)=>`<div class="growth-step ${i+1<stage?'done':''} ${i+1===stage?'current':''}"><div class="growth-step-art">${animalGrowthEmoji(id,i+1)}</div><b>${labels[i]||g.name}</b><span>친밀도 ${g.need}</span></div>`).join('')}</div><div class="mini-note" style="margin-top:8px">${esc(a.name)} 성장 단계 · 친밀도 50점마다 성장${stage>=stages.length?' · 전설 단계 달성!':''}</div>`}
function rankRows(profiles,limit=5){
  if(!profiles?.length)return '<div class="empty">아직 워크스페이스에 참여한 사람이 없습니다. 워크스페이스에 처음 참여해 보세요.</div>';
  return profiles.slice(0,limit).map((p,i)=>{const a=animalInfo(p.animal_type),rawLevel=Math.floor((Number(p.intimacy)||0)/50)+1,level=Math.min(animalGrowthStages(p.animal_type).length,rawLevel);return `<div class="rank-row"><span class="rank-no">${i+1}</span><span class="rank-animal">${animalGrowthEmoji(p.animal_type,level)}</span><div class="rank-person"><b>${esc(p.display_name||'FIT 러너')}</b><span>${esc(p.pet_name||a.name)} · ${animalLevelLabel(p.animal_type,level)} · 친밀도 ${Number(p.intimacy)||0}</span></div><b class="rank-points">${Number(p.points)||0} P</b></div>`}).join('')
}
async function loadDashboardRanking(){
  const box=$('#dashboardRanks');if(!box)return;
  if(!window.fitWorkspace){box.innerHTML='<div class="empty">로그인 후 워크스페이스를 불러올 수 있습니다.</div>';return}
  try{const rows=await window.fitWorkspace.listProfiles();if($('#dashboardRanks'))$('#dashboardRanks').innerHTML=rankRows(rows,3)}
  catch(e){if($('#dashboardRanks'))$('#dashboardRanks').innerHTML='<div class="notice">공유 워크스페이스를 처음 사용할 때는 Supabase SQL 설정이 필요합니다. 설정 파일을 실행한 뒤 다시 방문해 주세요.</div>';}
}
function workspacePage(){
  const p=wsProfile||{};const a=animalInfo(p.animal_type||'cat');
  return `${head('운동 공유 워크스페이스','원하는 운동 기록을 공유하고 다른 멤버의 꾸준함과 변화를 함께 확인하세요.')}
  <div class="notice">🔒 기본 운동 기록과 인바디 데이터는 개인 계정에 그대로 유지됩니다. 아래에서 직접 공유한 운동만 멤버에게 보이며, 체중·체지방은 체크한 경우에만 공유됩니다. 운동 공유 성공 시 하루 한 번 20P와 친밀도 5점을 받습니다.</div>
  <section class="panel"><div class="panelhead"><h2>👤 워크스페이스 프로필</h2><span id="wsProfileStatus" class="pill">불러오는 중</span></div>

function getWorkoutSummary(date){
  const parts=[];const weights=(db.exerciseLogs||{})[date]||[];const cardio=(db.cardioLogs||{})[date]||[];const d=rec(date);
  weights.forEach(x=>parts.push(`🏋 ${x.group||''} · ${x.machine||x.exercise||'웨이트'} ${x.weight?x.weight+'kg':'중량 미기록'} × ${x.sets||'?'}세트 × ${x.reps||'?'}회`));
  cardio.forEach(x=>parts.push(`🏃 ${x.machine||'유산소'} · ${x.minutes||0}분${x.intensity?' · 강도 '+x.intensity:''}${x.distance?' · '+x.distance+'km':''}`));
  if(String(d.workout||'').trim())parts.push('운동 메모: '+String(d.workout).trim());
  if(String(d.cardio||'').trim()&&!cardio.length)parts.push('유산소 메모: '+String(d.cardio).trim());
  return parts.join('\n');
}
function latestInbodyFor(date){return (db.inbodyRecords||[]).filter(x=>x.date<=date).sort((a,b)=>b.date.localeCompare(a.date))[0]||null}
function workspaceFeedHtml(entries,profiles){
  if(!entries?.length)return '<div class="empty">아직 공유된 운동이 없습니다. 첫 기록을 공유해 보세요.</div>';
  const pmap=new Map((profiles||[]).map(p=>[p.user_id,p]));const ordered=[...entries].sort((a,b)=>(a.entry_date||'').localeCompare(b.entry_date||'')||(a.created_at||'').localeCompare(b.created_at||''));const previous={};
  ordered.forEach(e=>{const old=previous[e.user_id]||{};e._weightDiff=(e.weight_kg!=null&&old.weight!=null)?Number(e.weight_kg)-Number(old.weight):null;e._fatDiff=(e.body_fat_rate!=null&&old.fat!=null)?Number(e.body_fat_rate)-Number(old.fat):null;if(e.weight_kg!=null)old.weight=Number(e.weight_kg);if(e.body_fat_rate!=null)old.fat=Number(e.body_fat_rate);previous[e.user_id]=old});
  return [...ordered].reverse().map(e=>{const p=pmap.get(e.user_id)||{},a=animalInfo(p.animal_type);const weight=e.weight_kg==null?'':`<span class="share-metric">체중 ${Number(e.weight_kg).toFixed(1)}kg${e._weightDiff===null?'':` <small class="${e._weightDiff<0?'trend-good':e._weightDiff>0?'trend-neutral':''}">${e._weightDiff>0?'+':''}${e._weightDiff.toFixed(1)}</small>`}</span>`;const fat=e.body_fat_rate==null?'':`<span class="share-metric">체지방 ${Number(e.body_fat_rate).toFixed(1)}%${e._fatDiff===null?'':` <small class="${e._fatDiff<0?'trend-good':e._fatDiff>0?'trend-neutral':''}">${e._fatDiff>0?'+':''}${e._fatDiff.toFixed(1)}%p</small>`}</span>`;
    return `<article class="feed-card"><div class="feed-avatar">${animalGrowthEmoji(p.animal_type,Math.floor((Number(p.intimacy)||0)/50)+1)}</div><div class="feed-body"><div class="feed-top"><b>${esc(p.display_name||'FIT 러너')} <span class="muted">· ${esc(p.pet_name||a.name)}</span></b><span>${esc(e.entry_date||'')}</span></div><h3>${esc(e.title||'오늘의 운동')}</h3><p class="feed-summary">${esc(e.workout_summary||'운동 기록').replace(/\n/g,'<br>')}</p><div class="feed-meta"><span>⏱ ${Number(e.duration_minutes)||0}분</span>${weight}${fat}<span class="pill good">+${Number(e.points_earned)||20}P</span></div></div></article>`
  }).join('');
}

    const hasWeight=$('#wsShareWeight').checked,hasFat=$('#wsShareFat').checked;const r=db.records?.[dateValue]||{};const ib=latestInbodyFor(dateValue);let weight=null,fat=null;

function renderCompanionStats(p){if(!p)return;wsProfile=p;const a=animalInfo(p.animal_type),intimacy=Number(p.intimacy)||0,stages=animalGrowthStages(p.animal_type),level=Math.min(stages.length,Math.floor(intimacy/50)+1),progress=level>=stages.length?50:intimacy%50,petName=p.pet_name||'콩이',stageName=stages[level-1].name,levelLabel=animalLevelLabel(p.animal_type,level);const set=(id,v)=>{const el=$('#'+id);if(el)el.innerHTML=v};set('companionAnimal',animalGrowthEmoji(p.animal_type,level));set('companionName',esc(petName));set('companionLevel',`${levelLabel} · ${esc(stageName)}`);set('companionPoints',`${Number(p.points)||0}<small> P</small>`);set('companionIntimacy',`${intimacy}<small> 점</small>`);set('companionLevelMetric',levelLabel.replace(/^Lv\./,'Lv.'));set('growthLevelBadge',levelLabel);set('companionStage',stageName);const fill=$('#affinityFill');if(fill)fill.style.width=(progress/50*100)+'%';set('affinityText',level>=stages.length?`친밀도 ${intimacy} · 최고 성장 단계!`:`친밀도 ${intimacy} · 다음 레벨까지 ${50-progress}점`);const art=$('#companionAnimal');if(art)art.style.fontSize=(58+Math.min(5,level)*4)+'px';const growth=$('#companionGrowth');if(growth)growth.innerHTML=growthPathHtml(p.animal_type,level);const nameInput=$('#companionPetName');if(nameInput)nameInput.value=petName;const wsName=$('#wsPetName');if(wsName)wsName.value=petName;const wsAnimal=$('#wsAnimal');if(wsAnimal)wsAnimal.value=p.animal_type}
async function wireCompanion(){const status=$('#companionStatus');try{if(!window.fitWorkspace)throw new Error('로그인 연결이 준비되지 않았습니다.');wsProfile=await window.fitWorkspace.ensureProfile();renderCompanionStats(wsProfile);if(status)status.textContent='운동 기록을 공유하면 포인트를 적립할 수 있습니다.'}catch(e){if(status)status.textContent='워크스페이스 설정이 필요합니다: '+(e.message||e)}
  $('#savePetName')?.addEventListener('click',async()=>{const btn=$('#savePetName'),name=$('#companionPetName')?.value.trim();try{if(!name||name.length>16)throw new Error('동물 이름을 1~16자로 입력해 주세요.');if(btn)btn.disabled=true;const current=wsProfile||await window.fitWorkspace.ensureProfile();wsProfile=await window.fitWorkspace.saveProfile(current.display_name||'FIT 러너',current.animal_type||'cat',name);renderCompanionStats(wsProfile);if(status)status.textContent=`${name}의 이름을 저장했어요!`;}catch(e){if(status)status.textContent=e.message||String(e)}finally{if(btn)btn.disabled=false}});
  $('#feedCompanion')?.addEventListener('click',async()=>{const btn=$('#feedCompanion');if(btn)btn.disabled=true;try{const updated=await window.fitWorkspace.feedCompanion();renderCompanionStats(updated);if(status)status.textContent='간식을 줬어요! 친밀도가 10점 올랐습니다. 성장 과정에서 변화를 확인해 보세요. 🐾'}catch(e){if(status)status.textContent=e.message||String(e)}finally{if(btn)btn.disabled=false}});
  const petAction=(kind)=>{const p=db.profile||(db.profile={});if(p.petInteractionDate!==todayISO()){p.petInteractionDate=todayISO();p.petInteractionCount=0}p.petInteractionCount=(Number(p.petInteractionCount)||0)+1;save();const cnt=$('#petInteractionCount');if(cnt)cnt.textContent=p.petInteractionCount;const a=animalInfo(wsProfile?.animal_type||'cat'),name=wsProfile?.pet_name||p.petName||'콩이';const lines=kind==='stroke'?[`${name}가 기분 좋게 눈을 감았어요. 😌`,`쓰담쓰담! ${name}가 꼬리를 흔들어요. 💗`,`${name}가 당신에게 몸을 기대요. 🥰`,`기분이 좋아진 ${name}가 반짝반짝 빛나요. ✨`]:[`${name}와 신나게 놀았어요! 🎉`,`${name}가 폴짝 뛰며 즐거워해요. 🐾`,`${name}가 장난감을 물고 돌아왔어요. 🧸`,`${name}가 더 놀자고 조르는 중이에요! 💕`];const box=$('#petReaction'),art=$('#companionAnimal');if(box)box.textContent=lines[Math.floor(Math.random()*lines.length)];if(art){art.classList.remove('pet-bounce','pet-wiggle');void art.offsetWidth;art.classList.add(kind==='stroke'?'pet-bounce':'pet-wiggle');setTimeout(()=>art.classList.remove('pet-bounce','pet-wiggle'),900)}const panel=$('.pet-play-panel');if(panel){panel.classList.remove('pet-heart-pop');void panel.offsetWidth;panel.classList.add('pet-heart-pop');setTimeout(()=>panel.classList.remove('pet-heart-pop'),700)}};

function wireDaily(){
  const d=$('#date');if(d)d.onchange=()=>{selectedDate=d.value||todayISO();render()};
  const w=$('#weight');if(w)w.onchange=()=>{let r=rec(selectedDate);r.weight=w.value;save()}; $$('.meal-note-input').forEach(ta=>{const updateNote=()=>{let r=rec(selectedDate);r.meals[ta.dataset.mealKey].note=ta.value.trim();save();const box=$('#mealEvaluation');if(box)box.innerHTML=mealEvaluation(selectedDate)};ta.onchange=updateNote;ta.oninput=updateNote});$$('[data-add-preset]').forEach(b=>{b.onclick=()=>{let r=rec(selectedDate);r.meals[$('#addMealType')?.value||'lunch'].items.push({name:b.dataset.addPreset,cal:Number(b.dataset.cal),protein:Number(b.dataset.protein),qty:1});save();render()}});const saveFood=$('#saveCustomFood');if(saveFood)saveFood.onclick=()=>{let name=$('#customFoodName').value.trim(),cal=$('#customFoodCal').value,protein=$('#customFoodProtein').value,unit=$('#customFoodUnit').value.trim();if(!name||cal===''||protein===''){alert('음식 이름, 칼로리, 단백질을 입력해 주세요.');return}db.profile.customFoods=db.profile.customFoods||[];const existing=db.profile.customFoods.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());const item={name,unit,cal:Number(cal),protein:Number(protein)};if(existing>=0)db.profile.customFoods[existing]=item;else db.profile.customFoods.push(item);save();alert('나만의 음식으로 등록했습니다.');render()};const mealNameInput=$('#addMealName');const applySavedFood=()=>{if(!mealNameInput)return;const typed=mealNameInput.value.trim().toLocaleLowerCase();const food=(db.profile.customFoods||[]).find(f=>String(f.name).trim().toLocaleLowerCase()===typed);if(food){$('#addMealCal').value=food.cal??'';$('#addMealProtein').value=food.protein??'';const qty=$('#addMealQty');if(qty&&!qty.value)qty.value=1;mealNameInput.dataset.savedFood='1'}else if(mealNameInput.dataset.savedFood==='1'){mealNameInput.dataset.savedFood='0';$('#addMealCal').value='';$('#addMealProtein').value=''}};if(mealNameInput){mealNameInput.addEventListener('input',applySavedFood);mealNameInput.addEventListener('change',applySavedFood);mealNameInput.addEventListener('blur',applySavedFood)}$('#btnAddMealItem').onclick=()=>{let type=$('#addMealType').value,name=$('#addMealName').value.trim();if(!name)return;applySavedFood();let r=rec(selectedDate);r.meals[type].items.push({name,cal:Number($('#addMealCal').value)||0,protein:Number($('#addMealProtein').value)||0,qty:Number($('#addMealQty').value)||1});save();render()}; $$('[data-qty-change]').forEach(b=>{let [t,i,diff]=b.dataset.qtyChange.split(':');b.onclick=()=>{let item=rec(selectedDate).meals[t].items[Number(i)];if(item){item.qty=Math.max(0.5,(Number(item.qty)||1)+Number(diff));save();render()}}});$$('[data-del-item]').forEach(b=>{let [t,i]=b.dataset.delItem.split(':');b.onclick=()=>{rec(selectedDate).meals[t].items.splice(Number(i),1);save();render()}});$('#btnSaveDaily').onclick=()=>{save();alert('저장되었습니다.');};const ev=$('#btnMealEvaluate');if(ev)ev.onclick=()=>{const box=$('#mealEvaluation');if(box)box.innerHTML=mealEvaluation(selectedDate)};

function inbodyPage(){db.inbodyRecords=db.inbodyRecords||[];const arr=sortedInbody();return `${head('인바디 분석·추이','입력값을 검증하고, 최근 측정 변화와 목표까지의 방향을 함께 확인합니다.')}<section class="panel"><div class="panelhead"><h2>🧾 인바디 결과 입력</h2><span class="pill">값 확인 후 저장</span></div><div class="notice">인바디 결과지에 표시된 값을 그대로 입력하세요. 이미지 자동 인식(OCR)은 참고 후보만 채우며 숫자·단위·항목을 직접 확인해야 합니다. BMI와 체지방량은 다른 입력값과 비교해 확인합니다.</div><div class="fieldgrid inbody-entry-grid"><div class="field inbody-upload-field"><label for="inbodyImage">결과지 사진/스크린샷 (선택)</label><input id="inbodyImage" type="file" accept="image/*"><div id="ocrStatus" class="mini-note">이미지를 올리면 텍스트를 인식하고 후보 값을 입력합니다. 잘못 읽을 수 있으니 반드시 확인하세요.</div><img id="inbodyPreview" class="preview-img" style="display:none" alt="업로드한 인바디 결과 미리보기"><details class="ocr-details"><summary>OCR 읽기 결과 보기</summary><pre id="ocrRawText">아직 인식한 텍스트가 없습니다.</pre></details></div><div class="field inbody-fields"><label for="ibDate">측정일</label><input id="ibDate" type="date" value="${todayISO()}" max="${todayISO()}" required><div class="field"><label for="ibWeight">체중 (Weight, kg)</label><input id="ibWeight" type="number" min="20" max="350" step="0.1" placeholder="예: 72.4"><span class="mini-note">결과지의 ‘체중’ 값</span></div><div class="field"><label for="ibMuscle">골격근량 (SMM, kg)</label><input id="ibMuscle" type="number" min="1" max="100" step="0.1" placeholder="예: 31.2"><span class="mini-note">‘골격근량’ 또는 SMM 값이며, 제지방량과 다릅니다.</span></div><div class="field"><label for="ibFatMass">체지방량 (Body Fat Mass, kg)</label><input id="ibFatMass" type="number" min="0" max="150" step="0.1" placeholder="예: 18.1"></div><div class="field"><label for="ibFatRate">체지방률 (PBF, %)</label><input id="ibFatRate" type="number" min="1" max="70" step="0.1" placeholder="예: 24.9"><span class="mini-note">% 기호는 입력하지 말고 숫자만 입력</span></div><div class="field"><label for="ibHeight">키 (cm, BMI 검증용 · 선택)</label><input id="ibHeight" type="number" min="100" max="250" step="0.1" placeholder="예: 173.5"><span class="mini-note">BMI 대조를 원할 때만 입력하세요. 자동으로 추정하지 않습니다.</span></div><div class="field"><label for="ibBMI">BMI (kg/m²)</label><input id="ibBMI" type="number" min="10" max="70" step="0.1" placeholder="예: 23.1"></div><div class="field"><label for="ibNotes">측정 메모 (선택)</label><textarea id="ibNotes" placeholder="예: 아침 공복, 운동 전 측정"></textarea></div><div class="actions"><button class="primary" id="ibSave">${editingInbodyId?'수정 저장':'인바디 기록 저장'}</button><button id="ibCancelEdit" style="display:${editingInbodyId?'inline-flex':'none'}">수정 취소</button></div></div></div></section><section class="panel section"><div class="panelhead"><h2>📈 월별 변화 그래프</h2><span class="mini-note">최근 6개월 · 월 마지막 측정값</span></div>${inbodyTrendCharts(arr)}${inbodyFeedback(arr)}</section><section class="panel section"><div class="panelhead"><h2>측정 기록</h2><span class="pill">총 ${arr.length}건</span></div>${inbodyHistoryHtml(arr)}</section>`}
function parseInbodyOCRCandidates(raw){const lines=String(raw||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const specs=[{id:'ibWeight',name:'체중',re:/(?:\bweight\b|체중|몸무게)/i,min:20,max:350},{id:'ibMuscle',name:'골격근량',re:/(?:\bSMM\b|skeletal\s*muscle(?:\s*mass)?|골격근량|골격근)/i,min:1,max:100},{id:'ibFatMass',name:'체지방량',re:/(?:body\s*fat\s*mass|fat\s*mass|체지방량)/i,min:0,max:150},{id:'ibFatRate',name:'체지방률',re:/(?:percent\s*body\s*fat|body\s*fat\s*(?:percentage|percent)|\bPBF\b|체지방률|체지방\s*율)/i,min:1,max:70},{id:'ibBMI',name:'BMI',re:/\bBMI\b/i,min:10,max:70}];const anyLabel=/(?:\bweight\b|체중|몸무게|\bSMM\b|skeletal\s*muscle|골격근|body\s*fat\s*mass|fat\s*mass|체지방량|percent\s*body\s*fat|body\s*fat\s*(?:percentage|percent)|\bPBF\b|체지방률|체지방\s*율|\bBMI\b)/i;const out=[];for(const spec of specs){let found=null;for(let i=0;i<lines.length&&!found;i++){const line=lines[i];const match=line.match(spec.re);if(!match)continue;let candidates=[];const remainder=line.slice((match.index||0)+match[0].length);candidates.push(remainder);for(let j=i+1;j<Math.min(lines.length,i+3);j++){if(anyLabel.test(lines[j]))break;candidates.push(lines[j])}for(const part of candidates){const m=String(part).match(/(?:^|[^A-Za-z])([0-9]{1,3}(?:[.,][0-9]{1,2})?)(?![A-Za-z])/);if(!m)continue;const v=Number(m[1].replace(',','.'));if(Number.isFinite(v)&&v>=spec.min&&v<=spec.max){found=v;break}}}if(found!==null){const el=$('#'+spec.id);if(el&&!el.value)el.value=found.toFixed(1);out.push(`${spec.name} ${found.toFixed(1)}`)}}return out}
function validateInbodyInput(){const date=$('#ibDate').value;if(!date){alert('측정일을 입력해 주세요.');return null}if(date>todayISO()){alert('측정일은 오늘 이후 날짜로 입력할 수 없습니다.');return null}const heightRaw=$('#ibHeight')?.value||'';let heightCm=null;if(heightRaw!==''){heightCm=Number(heightRaw);if(!Number.isFinite(heightCm)||heightCm<100||heightCm>250){alert('BMI 검증용 키는 100~250cm 범위로 입력해 주세요.');$('#ibHeight').focus();return null}}const specs=[['ibWeight','체중',20,350],['ibMuscle','골격근량',1,100],['ibFatMass','체지방량',0,150],['ibFatRate','체지방률',1,70],['ibBMI','BMI',10,70]],v={date,notes:$('#ibNotes').value.trim(),heightCm};for(const [id,label,min,max] of specs){const raw=$('#'+id).value;if(raw===''){v[id]=null;continue}const num=Number(raw);if(!Number.isFinite(num)||num<min||num>max){alert(`${label}은 ${min}~${max} 범위의 숫자로 입력해 주세요. 결과지에 해당 값이 없다면 비워 둘 수 있습니다.`);$('#'+id).focus();return null}v[id]=num}if(specs.every(([id])=>v[id]===null)){alert('인바디 수치를 하나 이상 입력해 주세요.');return null}const warnings=[];if(v.ibFatMass!==null&&v.ibWeight!==null&&v.ibFatMass>v.ibWeight)warnings.push('체지방량이 체중보다 큽니다. 항목이나 단위를 잘못 입력했는지 확인해 주세요.');if(v.ibMuscle!==null&&v.ibWeight!==null&&v.ibMuscle>v.ibWeight)warnings.push('골격근량이 체중보다 큽니다. 입력값을 다시 확인해 주세요.');if(v.ibFatMass!==null&&v.ibFatRate!==null&&v.ibWeight!==null){const expected=v.ibWeight*v.ibFatRate/100;const diff=Math.abs(expected-v.ibFatMass);if(diff>Math.max(2,v.ibWeight*.04))warnings.push(`체지방량 ${v.ibFatMass.toFixed(1)}kg과 체중·체지방률로 계산한 참고값 ${expected.toFixed(1)}kg의 차이가 큽니다.`)}if(v.ibBMI!==null&&v.ibWeight!==null&&v.heightCm!==null){const h=v.heightCm/100,calc=v.ibWeight/(h*h);if(Math.abs(calc-v.ibBMI)>1.5)warnings.push(`입력 BMI ${v.ibBMI.toFixed(1)}과 입력한 키·체중으로 계산한 BMI 약 ${calc.toFixed(1)}의 차이가 큽니다.`)}if(warnings.length&&!confirm('입력값을 한 번 더 확인해 주세요.\n\n'+warnings.join('\n')+'\n\n이 값으로 저장할까요?'))return null;return {date,weight:v.ibWeight===null?'':v.ibWeight,muscle:v.ibMuscle===null?'':v.ibMuscle,fatMass:v.ibFatMass===null?'':v.ibFatMass,fatRate:v.ibFatRat function wireInbody(){const file=$('#inbodyImage');if(file)file.onchange=async()=>{const f=file.files?.[0];if(!f)return;const img=$('#inbodyPreview');img.src=URL.createObjectURL(f);img.style.display='block';const st=$('#ocrStatus'),rawBox=$('#ocrRawText');if(!window.Tesseract){st.textContent='OCR 라이브러리를 불러오지 못했습니다. 결과지 값을 직접 입력해 주세요.';return}st.textContent='결과지를 읽는 중입니다…';try{const out=await Tesseract.recognize(f,'eng+kor');const text=out.data.text||'';if(rawBox)rawBox.textContent=text||'인식된 텍스트가 없습니다.';const candidates=parseInbodyOCRCandidates(text);st.textContent=candidates.length?`자동 인식 후보: ${candidates.join(' · ')}. 입력칸을 결과지와 비교해 수정한 뒤 저장하세요.`:'항목 이름과 숫자를 정확히 찾지 못했어요. 자동 입력하지 않았으니 결과지 값을 직접 입력해 주세요.'}catch(e){st.textContent='인식 실패: OCR이 숫자나 항목을 잘못 읽을 수 있습니다. 결과지 값을 직접 입력해 주세요.'}};
 const saveBtn=$('#ibSave');saveBtn.onclick=()=>{const v=validateInbodyInput();if(!v)return;const id=editingInbodyId||(crypto.randomUUID?crypto.randomUUID():String(Date.now()));const r={id,...v};db.inbodyRecords=db.inbodyRecords||[];const index=db.inbodyRecords.findIndex(x=>x.id===id);if(index>=0)db.inbodyRecords[index]=r;else db.inbodyRecords.push(r);db.inbodyRecords.sort((a,b)=>String(a.date).localeCompare(String(b.date)));editingInbodyId=null;save();render()};$('#ibCancelEdit')?.addEventListener('click',()=>{editingInbodyId=null;render()});$$('[data-ib-delete]').forEach(b=>b.onclick=()=>{if(confirm('이 인바디 기록을 삭제할까요?')){db.inbodyRecords=(db.inbodyRecords||[]).filter(r=>r.id!==b.dataset.ibDelete);if(String(editingInbodyId)===String(b.dataset.ibDelete))editingInbodyId=null;save();render()}});$$('[data-ib-edit]').forEach(b=>b.onclick=()=>{const r=(db.inbodyRecords||[]).find(x=>String(x.id)===String(b.dataset.ibEdit));if(!r)return;editingInbodyId=r.id;$('#ibDate').value=r.date||todayISO();$('#ibWeight').value=r.weight??'';$('#ibMuscle').value=r.muscle??'';$('#ibFatMass').value=r.fatMass??'';$('#ibFatRate').value=r.fatRate??'';$('#ibBMI').value=r.bmi??'';$('#ibHeight').value=r.heightCm??'';$('#ibNotes').value=r.notes??'';$('#ibSave').textContent='수정 저장';$('#ibCancelEdit').style.display='inline-flex';window.scrollTo({top:0,behavior:'smooth'})})}

  const ageN=Number(age),h=Number(height),tf=Number(targetFat),tm=Number(targetMuscle);
  if(!ageN||ageN<18||!sex||!h||h<100||h>250)return '<div class="notice">나이(만 18세 이상), 성별, 키를 입력하면 해당 연령대의 체지방률·골격근지수 참고 평균과 목표 가이드를 보여 줍니다.</div>';
  const decade=Math.min(7,Math.max(2,Math.floor(ageN/10))),index=decade-2,ref=BODY_REFERENCE[sex]?.[index];
  if(!ref)return '<div class="notice">평균값 비교를 위해 성별을 남성 또는 여성으로 선택해 주세요.</div>';
  const ageBand=decade===7?(ageN>=80?'70대 참고값':'70대'):`${decade}0대`,limbKg=ref.smi*Math.pow(h/100,2);
  const ib=(db.inbodyRecords||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]||{};
  const currentFat=ib.fatRate!==''&&ib.fatRate!=null&&Number.isFinite(Number(ib.fatRate))?Number(ib.fatRate):null;
  const currentMuscle=ib.muscle!==''&&ib.muscle!=null&&Number.isFinite(Number(ib.muscle))?Number(ib.muscle):null;
  let feedback=[];
  if(currentFat===null)feedback.push('현재 체지방률이 등록되어 있지 않아요. 인바디 분석 화면에서 최근 측정치를 입력하면 목표와 비교할 수 있습니다.');
  else if(Number.isFinite(tf)&&tf>0){const diff=currentFat-tf;if(diff>0.2)feedback.push(`현재 체지방률 ${currentFat.toFixed(1)}%에서 목표 ${tf.toFixed(1)}%까지 약 ${diff.toFixed(1)}%p 차이가 있습니다. 월간 변화와 식사 기록을 보며 무리하지 않게 조정하세요.`);else if(diff< -0.2)feedback.push(`현재 체지방률 ${currentFat.toFixed(1)}%가 설정한 목표 ${tf.toFixed(1)}%보다 낮습니다. 더 낮추기보다 컨디션과 근력 유지도 함께 확인하세요.`);else feedback.push(`최근 체지방률 ${currentFat.toFixed(1)}%가 설정한 목표 ${tf.toFixed(1)}%에 가깝습니다. 같은 측정 조건으로 추이를 확인하세요.`)}
  else if(currentFat>ref.fat+3)feedback.push(`최근 체지방률 ${currentFat.toFixed(1)}%는 같은 성별·연령대 InBody Report 평균 ${ref.fat.toFixed(1)}%보다 높습니다. 평균은 개인에게 꼭 맞는 목표가 아니므로 허리둘레·컨디션·검진 결과와 함께 판단하세요.`);
  else if(currentFat!==null)feedback.push(`최근 체지방률 ${currentFat.toFixed(1)}%는 참고 평균 ${ref.fat.toFixed(1)}% 부근 또는 그보다 낮습니다. 체지방을 더 줄여야 한다고 단정하지 말고 근력·컨디션도 함께 보세요.`);
  if(Number.isFinite(tm)&&tm>0&&currentMuscle!==null){const diff=tm-currentMuscle;if(diff>0.1)feedback.push(`최근 골격근량 ${currentMuscle.toFixed(1)}kg에서 개인 목표 ${tm.toFixed(1)}kg까지 약 ${diff.toFixed(1)}kg 차이입니다. 주요 근육군 근력운동을 주 2회 이상 하고 중량·반복 수를 점진적으로 올려 보세요.`);else feedback.push(`최근 골격근량 ${currentMuscle.toFixed(1)}kg이 설정 목표 ${tm.toFixed(1)}kg에 도달했거나 넘었습니다. 중량만 높이기보다 자세와 회복도 유지하세요.`)}
  else if(currentMuscle===null)feedback.push('최근 골격근량이 없어요. 인바디 분석에 골격근량을 저장하고, 선택적으로 개인 근육량 목표를 입력해 보세요.');
  const fatInput=Number.isFinite(tf)&&tf>0?`<span class="goal-chip">체지방 목표 ${tf.toFixed(1)}%</span>`:'<span class="goal-chip">체지방 목표 미설정</span>';
  const muscleInput=Number.isFinite(tm)&&tm>0?`<span class="goal-chip">근육량 목표 ${tm.toFixed(1)}kg</span>`:'<span class="goal-chip">근육량 목표 미설정</span>';
  return `<div class="bodyguide-grid"><div class="bodyguide-metric"><span>${ageBand} · 체지방률 참고 평균</span><b>${ref.fat.toFixed(1)}%</b><span>현재 인바디: ${currentFat===null?'미등록':currentFat.toFixed(1)+'%'}</span></div><div class="bodyguide-metric"><span>${ageBand} · 골격근지수(SMI) 참고 평균</span><b>${ref.smi.toFixed(1)} kg/m²</b><span>키 ${h.toFixed(1)}cm일 때 사지 근육량 환산 약 ${limbKg.toFixed(1)}kg</span></div></div><div class="actions">${fatInput}${muscleInput}</div><h3 style="font-size:15px;margin:18px 0 8px">🎯 목표 달성 가이드</h3><ul class="guide-list">${feedback.map(x=>`<li>${esc(x)}</li>`).join('')}<li>기본 루틴 예시: 주요 근육군 근력운동을 주 2일 이상, 중강도 유산소를 주 150~300분 범위에서 현재 체력에 맞춰 점진적으로 진행하세요.</li><li>체지방을 줄이는 목표라면 식사량을 급격히 줄이기보다 기록한 평균 섭취량과 월간 체중 추세를 보고 한 달 단위로 작은 조정을 해 보세요. 근육 증가가 목표라면 충분히 먹고 훈련 사이 회복을 확보하세요.</li><li>체중·체지방률은 같은 시간대, 비슷한 수분·식사 조건에서 측정해 월별 추이를 비교하세요.</li></ul><p class="source-note">참고값: InBody Report 2024 한국 측정자 데이터의 연령·성별 평균(20대~70대). SMI는 키 제곱으로 보정한 사지 골격근지수로, 인바디의 전체 골격근량(kg)과 같은 지표가 아닙니다. ‘평균’은 이상적인 목표나 진단 기준이 아닙니다. <a href="https://www.inbody.co.kr/assets/download/2024InBody%20Report_ENG_web.pdf" target="_blank" rel="noopener">자료 출처</a>. 만 18~19세는 20대 참고값, 80세 이상은 70대 참고값을 적용합니다. 성인 신체활동 참고: <a href="https://www.who.int/initiatives/behealthy/physical-activity/" target="_blank" rel="noopener">WHO 권고</a>.</p>`;
}

'복근':['복근 크런치 머신','케이블 크런치','로만체어 레그레이즈']
};
const cardioMachines=['트레드밀(러닝머신)','실내 자전거','스핀 바이크','일립티컬(천국의 계단형 제외)','스텝밀(천국의 계단)','로잉머신','클라이밍 머신','에어바이크','야외 달리기','걷기','수영','기타 유산소'];
let weightDraft=[],weightDraftDate='';
function exerciseRows(){return weightDraft.length?`<div class="tablewrap"><table><thead><tr><th>부위</th><th>기구/운동</th><th>중량</th><th>세트</th><th>횟수</th><th></th></tr></thead><tbody>${weightDraft.map((r,i)=>`<tr><td>${esc(r.group||'')}</td><td>${esc(r.machine||r.exercise||'')}</td><td>${esc(r.weight||'—')} kg</td><td>${esc(r.sets||'—')}</td><td>${esc(r.reps||'—')}</td><td><button data-ex-remove="${i}">삭제</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">아직 등록한 웨이트 운동이 없습니다.</p>'}
function exercisePage(){db.exerciseLogs=db.exerciseLogs||{};if(weightDraftDate!==selectedDate){weightDraftDate=selectedDate;weightDraft=JSON.parse(JSON.stringify(db.exerciseLogs[selectedDate]||[]))}return `${head('웨이트 기록','운동 부위와 헬스장 기구를 선택해 중량·세트·횟수를 기록하세요.')}<section class="panel"><div class="fieldgrid"><div class="field"><label>날짜</label><input id="exDate" type="date" value="${selectedDate}"></div><div class="field"><label>운동 부위</label><select id="exGroup">${Object.keys(weightExercises).map(g=>`<option>${g}</option>`).join('')}</select></div><div class="field"><label>운동 기구</label><select id="exMachine">${weightExercises['가슴'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>중량 (kg)</label><input id="exWeight" type="number" min="0" step="0.5" placeholder="예: 25"></div><div class="field"><label>세트 수</label><input id="exSets" type="number" min="1" step="1" placeholder="예: 3"></div><div class="field"><label>세트당 횟수</label><input id="exReps" type="number" min="1" step="1" placeholder="예: 12"></div></div><button class="primary" id="exAdd" style="margin-top:14px;">운동 추가</button><p class="mini-note">기구 목록은 부위별로 나뉘며, 추가한 운동은 아래 목록에서 저장할 수 있습니다.</p></section><section class="panel section"><h2>오늘의 웨이트 목록</h2><div id="exRows">${exerciseRows()}</div><button class="primary" id="exSave" style="margin-top:14px;">웨이트 기록 저장</button></section>`}
function wireExercise(){const group=$('#exGroup'),machine=$('#exMachine');group.onchange=()=>{machine.innerHTML=(weightExercises[group.value]||[]).map(x=>`<option>${x}</option>`).join('')};$('#exDate').onchange=()=>{selectedDate=$('#exDate').value||todayISO();render()};$('#exAdd').onclick=()=>{weightDraft.push({group:group.value,machine:machine.value,weight:$('#exWeight').value,sets:$('#exSets').value,reps:$('#exReps').value});render()};$$('[data-ex-remove]').forEach(b=>b.onclick=()=>{weightDraft.splice(Number(b.dataset.exRemove),1);render()});$('#exSave').onclick=()=>{db.exerciseLogs=db.exerciseLogs||{};db.exerciseLogs[selectedDate]=weightDraft;save();alert('웨이트 기록을 저장했습니다.');render()}}
function cardioRows(){let rows=(db.cardioLogs||{})[selectedDate]||[];return rows.length?`<div class="tablewrap"><table><thead><tr><th>종류</th><th>시간</th><th>강도</th><th>거리(km)</th><th>메모</th><th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${esc(r.machine)}</td><td>${esc(r.minutes)}분</td><td>${esc(r.intensity||'보통')}</td><td>${esc(r.distance||'—')}</td><td>${esc(r.notes||'')}</td><td><button data-cardio-remove="${i}">삭제</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">아직 등록한 유산소 운동이 없습니다.</p>'}
function cardioPage(){db.cardioLogs=db.cardioLogs||{};return `${head('유산소 기록','헬스장 유산소 기구와 야외 활동을 등록하고 시간·강도를 기록하세요.')}<section class="panel"><div class="fieldgrid"><div class="field"><label>날짜</label><input id="cardioDate" type="date" value="${selectedDate}"></div><div class="field"><label>유산소 기구/운동</label><select id="cardioMachine">${cardioMachines.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>운동 시간 (분)</label><input id="cardioMinutes" type="number" min="1" step="1" placeholder="예: 25"></div><div class="field"><label>강도</label><select id="cardioIntensity"><option>가벼움</option><option selected>보통</option><option>높음</option></select></div><div class="field"><label>거리 (km, 선택)</label><input id="cardioDistance" type="number" min="0" step="0.1" placeholder="선택 입력"></div><div class="field"><label>메모 (선택)</label><input id="cardioNotes" placeholder="예: 경사도 5, 속도 6"></div></div><button class="primary" id="cardioAdd" style="margin-top:14px;">유산소 추가</button></section><section class="panel section"><h2>오늘의 유산소 목록</h2><div id="cardioRows">${cardioRows()}</div><button class="primary" id="cardioSave" style="margin-top:14px;">유산소 기록 저장</button></section>`}
function wireCardio(){const date=$('#cardioDate');date.onchange=()=>{selectedDate=date.value||todayISO();render()};$('#cardioAdd').onclick=()=>{let minutes=$('#cardioMinutes').value;if(!minutes||Number(minutes)<=0){alert('운동 시간을 분 단위로 입력해 주세요.');return}db.cardioLogs=db.cardioLogs||{};db.cardioLogs[selectedDate]=db.cardioLogs[selectedDate]||[];db.cardioLogs[selectedDate].push({machine:$('#cardioMachine').value,minutes,distance:$('#cardioDistance').value,intensity:$('#cardioIntensity').value,notes:$('#cardioNotes').value});save();render()};$$('[data-cardio-remove]').forEach(b=>b.onclick=()=>{db.cardioLogs[selectedDate].splice(Number(b.dataset.cardioRemove),1);save();render()});$('#cardioSave').onclick=()=>{save();alert('유산소 기록을 저장했습니다.');render()}}
</script>

<!-- 사용자별 개별 계정 로그인 및 클라우드 동기화 쉴드 레이어 -->
<style>
#fitCloudShield{position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:18px}
#fitCloudShield .fit-card{width:min(100%,480px);background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:25px;box-shadow:0 18px 60px #0002}
#fitCloudShield h1{font-size:22px;margin:0 0 8px}
#fitCloudShield .fit-fields,#fitCloudShield .fit-actions{display:grid;gap:10px;margin-top:14px}
#fitCloudShield .fit-status{padding:10px;border-radius:8px;background:var(--accentbg);font-size:13px;margin-top:10px;word-break:break-all}
#fitCloudLogout{display:none}
#fitCloudLogout.visible{display:inline-flex}
</style>
<div id="fitCloudShield" role="dialog">
  <div class="fit-card">
    <h1>FIT 건강관리 포털</h1>
    <p style="color:var(--muted);font-size:13px;">이메일로 로그인하여 개별 클라우드 데이터를 동기화하세요.</p>
    <div id="fitCloudForm">
      <div class="fit-fields">
        <div class="field"><label>이메일</label><input id="fitCloudEmail" type="email" placeholder="email@example.com"></div>
        <div class="field"><label>비밀번호</label><input id="fitCloudPassword" type="password" placeholder="비밀번호 (6자 이상)"></div>
      </div>
      <div class="fit-actions">
        <button class="primary" id="fitCloudLogin" type="button">로그인</button>
        <button id="fitCloudSignup" type="button">새 계정 만들기</button>
      </div>
    </div>
    <div id="fitCloudStatus" class="fit-status">계정 정보를 입력하세요.</div>
  </div>
</div>

<script>
(function(){
  const SUPABASE_URL='https://krbqcwjtpkkuqouhwxph.supabase.co', KEY='sb_publishable_uOx8W7EG9l4j4ClQ7orB3g_ED0MCgCN';
  let supa=null, user=null, ignore=false, busy=false, timer=null;

  function say(msg){
    const el = document.getElementById('fitCloudStatus');
    if(el) el.textContent = msg;
  }

  window.fitApp = { get db(){return db}, set db(v){db=v}, save:save, render:render };
  const animalIds=['cat','dog','fox','rabbit','bear','panda','penguin','otter','duck'];
  function randomAnimal(){return animalIds[Math.floor(Math.random()*animalIds.length)]}
  async function ensureWorkspaceProfile(){
    if(!supa||!user)throw new Error('먼저 로그인해 주세요.');
    const {data,error}=await supa.from('fit_workspace_profiles').select('user_id,display_name,animal_type,pet_name,points,intimacy,updated_at').eq('user_id',user.id).maybeSingle();
    if(error)throw error;
    if(data)return data;
    const suffix=String(Math.floor(1000+Math.random()*9000));
    const created={user_id:user.id,display_name:'FIT 러너 '+suffix,animal_type:randomAnimal(),pet_name:'콩이'};
    const out=await supa.from('fit_workspace_profiles').insert(created).select('user_id,display_name,animal_type,pet_name,points,intimacy,updated_at').single();
    if(out.error)throw out.error;return out.data;
  }
  window.fitWorkspace={
    ensureProfile:ensureWorkspaceProfile,
    async listProfiles(){if(!supa||!user)throw new Error('먼저 로그인해 주세요.');const {data,error}=await supa.from('fit_workspace_profiles').select('user_id,display_name,animal_type,pet_name,points,intimacy,updated_at').order('points',{ascending:false}).order('intimacy',{ascending:false}).limit(100);if(error)throw error;return data||[]},
    async listEntries(){if(!supa||!user)throw new Error('먼저 로그인해 주세요.');const {data,error}=await supa.from('fit_workspace_entries').select('id,user_id,entry_date,title,workout_summary,duration_minutes,weight_kg,body_fat_rate,points_earned,created_at').order('entry_date',{ascending:false}).order('created_at',{ascending:false}).limit(50);if(error)throw error;return data||[]},
    async saveProfile(displayName,animalType,petName){if(!supa||!user)throw new Error('먼저 로그인해 주세요.');if(!animalIds.includes(animalType))throw new Error('동물 선택이 올바르지 않습니다.');const normalizedPetName=String(petName||'콩이').trim();if(!normalizedPetName||normalizedPetName.length>16)throw new Error('동물 이름을 1~16자로 입력해 주세요.');await ensureWorkspaceProfile();const {data,error}=await supa.from('fit_workspace_profiles').update({display_name:displayName,animal_type:animalType,pet_name:normalizedPetName,updated_at:new Date().toISOString()}).eq('user_id',user.id).select('user_id,display_name,animal_type,pet_name,points,intimacy,updated_at').single();if(error)throw error;return data},
    async publishEntry(payload){if(!supa||!user)throw new Error('먼저 로그인해 주세요.');await ensureWorkspaceProfile();const entry={user_id:user.id,entry_date:payload.entry_date,title:String(payload.title||'오늘의 운동').slice(0,80),workout_summary:String(payload.workout_summary||'').slice(0,1200),duration_minutes:Math.max(0,Math.round(Number(payload.duration_minutes)||0)),weight_kg:payload.weight_kg==null?null:payload.weight_kg,body_fat_rate:payload.body_fat_rate==null?null:payload.body_fat_rate};const {data,error}=await supa.from('fit_workspace_entries').insert(entry).select('id,user_id,entry_date,title,workout_summary,duration_minutes,weight_kg,body_fat_rate,points_earned,created_at').single();if(error){if(error.code==='23505')throw new Error('이 날짜의 운동은 이미 공유했습니다. 하루 한 번만 포인트를 받을 수 있습니다.');throw error}return data},
    async feedCompanion(){if(!supa||!user)throw new Error('먼저 로그인해 주세요.');await ensureWorkspaceProfile();const {data,error}=await supa.rpc('fit_feed_companion');if(error)throw error;return data}
  };

  async function getRow(){
    const {data,error} = await supa.from('fit_manager_data').select('data').eq('user_id', user.id).maybeSingle();
    if(error) throw error;
    return data || null;
  }

  async function put(x){
    const {error} = await supa.from('fit_manager_data').upsert({user_id:user.id, data:x, updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(error) throw error;
  }

  async function activate(data){
    ignore = true;
    db = data;
    save();
    render();
    document.getElementById('fitCloudShield').style.display='none';
    const logoutBtn = document.getElementById('fitCloudLogout');
    if(logoutBtn) logoutBtn.classList.add('visible');
    const badge = document.getElementById('syncStatusBadge');
    if(badge){ badge.textContent='클라우드 동기화'; badge.className='pill good'; }
    ignore = false;
    say('로그인 완료');
  }

  async function signedIn(u){
    user = u;
    say('개별 클라우드 데이터 로딩 중...');
    try{
      const row = await getRow();
      if(row && row.data){ await activate(row.data); }
      else { await put(db); await activate(db); }
    } catch(e) {
      document.getElementById('fitCloudShield').style.display='flex';
      say('동기화 오류: ' + (e.message || e));
    }
  }

  async function handleLogin(){
    const email = document.getElementById('fitCloudEmail').value.trim();
    const password = document.getElementById('fitCloudPassword').value;
    if(!email || !password){ say('이메일과 비밀번호를 모두 입력해 주세요.'); return; }
    say('로그인 인증 중...');
    try {
      if(!supa && window.supabase){ supa = window.supabase.createClient(SUPABASE_URL, KEY); }
      const { data, error } = await supa.auth.signInWithPassword({ email, password });
      if(error) throw error;
      await signedIn(data.user);
    } catch(e) {
      say('로그인 실패: ' + (e.message || String(e)));
    }
  }

  async function handleSignup(){
    const email = document.getElementById('fitCloudEmail').value.trim();
    const password = document.getElementById('fitCloudPassword').value;
    if(!email || password.length < 6){ say('올바른 이메일과 6자 이상의 비밀번호를 입력해 주세요.'); return; }
    say('회원가입 요청 중...');
    try {
      if(!supa && window.supabase){ supa = window.supabase.createClient(SUPABASE_URL, KEY); }
      const { data, error } = await supa.auth.signUp({ email, password });
      if(error) throw error;
      if(data.session) await signedIn(data.session.user);
      else say('회원가입이 완료되었습니다. 로그인해 주세요.');
    } catch(e) {
      say('회원가입 실패: ' + (e.message || String(e)));
    }
  }

  window.fitCloudSaveHook = function(currentDB){
    if(user && !ignore){
      if(timer) clearTimeout(timer);
      timer = setTimeout(async ()=>{
        if(busy) return;
        busy = true;
        try { await put(currentDB); } catch(e){}
        finally { busy = false; }
      }, 800);
    }
  };

  document.addEventListener('DOMContentLoaded', ()=>{
    document.getElementById('fitCloudLogin').addEventListener('click', handleLogin);
    document.getElementById('fitCloudSignup').addEventListener('click', handleSignup);

    const logout = document.createElement('button');
    logout.id = 'fitCloudLogout';
    logout.textContent = '로그아웃';
    logout.addEventListener('click', async ()=>{
      if(supa) await supa.auth.signOut();
      user = null;
      document.getElementById('fitCloudShield').style.display='flex';
      say('로그아웃되었습니다.');
    });

    const targetHeader = document.querySelector('header .right');
    if(targetHeader) targetHeader.insertBefore(logout, targetHeader.firstChild);

    try {
      if(window.supabase){
        supa = window.supabase.createClient(SUPABASE_URL, KEY);
        supa.auth.getSession().then(({data})=>{
          if(data && data.session) signedIn(data.session.user);
        }).catch(()=>{ say('계정 정보를 입력 후 로그인하세요.'); });
      } else {
        say('Supabase 라이브러리를 로드하지 못했습니다.');
      }
    } catch(err){
      say('초기화 에러: ' + err.message);
    }
  });
})();
</script>
</body>
