<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f6fa,#111827);--surface:light-dark(#fff,#1f2937);--surface2:light-dark(#f8fafc,#273449);--text:light-dark(#172033,#f3f4f6);--muted:light-dark(#64748b,#aab6c8);--border:light-dark(#e2e8f0,#3b4658);--accent:light-dark(#2457c5,#8db2ff);--accentbg:light-dark(#eaf0ff,#243b64);--green:light-dark(#16845b,#5ed6a5);--amber:light-dark(#a8650b,#f5bd62);--red:light-dark(#b83c45,#ff8e96)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;font-size:15px}
.app{min-height:100vh;background:var(--bg)}

.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 68px)}

.primary{background:#2457c5;color:#fff;border-color:#2457c5}

.section{margin-top:16px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}
.pill{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:750;background:var(--accentbg);color:var(--accent)}
.pill.good{background:light-dark(#e5f7ef,#174b3a);color:var(--green)}

/* SD companion characters: vector art + lightweight game-like motion */
.companion-art{position:relative;overflow:visible;width:184px;height:184px;flex:0 0 184px;border-radius:34px;background:radial-gradient(circle at 50% 32%,#fff 0,#f4efff 58%,#e7f5ed 100%);box-shadow:inset 0 0 0 1px #ffffffaa,0 14px 28px rgba(88,69,170,.12);isolation:isolate}
.companion-art.pet-bounce,.companion-art.pet-wiggle{animation:none!important}
.pet-svg{display:block;width:100%;height:100%;overflow:visible;position:relative;z-index:1;filter:drop-shadow(0 5px 2px rgba(55,47,86,.10))}
.pet-svg-mini{width:38px;height:38px;filter:none;vertical-align:middle}

.pet-duck-wrap{position:relative;display:block;width:100%;height:100%;min-width:0;min-height:0;isolation:isolate}
.pet-duck-wrap .pet-duck-image{object-fit:contain;object-position:center bottom;filter:drop-shadow(0 5px 2px rgba(55,47,86,.10));}
.pet-duck-wrap:after{position:absolute;z-index:2;right:7%;top:2%;font-size:clamp(12px,18%,25px);line-height:1;filter:drop-shadow(0 2px 2px #fff8);pointer-events:none}
.pet-duck-wrap.duck-stage-3:after{content:'✦';color:#ffca55}
.pet-duck-wrap.duck-stage-4:after{content:'🌸';font-size:clamp(12px,20%,25px)}
.pet-duck-wrap.duck-stage-5:after,.pet-duck-wrap.duck-stage-6:after{content:'👑';font-size:clamp(14px,23%,28px)}
.pet-duck-mini{width:38px;height:38px;flex:0 0 38px;overflow:visible}
.pet-duck-mini .pet-duck-image{width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(55,47,86,.08))}
.pet-duck-mini:after{right:-1px;top:-2px;font-size:10px}
.rank-animal{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;font-size:0}
.feed-avatar{overflow:visible}
.feed-avatar .pet-svg-mini{width:42px;height:42px}
.pet-floor{transform-origin:120px 189px;animation:petShadow 3.2s ease-in-out infinite}
.pet-body{transform-box:fill-box;transform-origin:50% 88%;animation:petBreath 2.7s ease-in-out infinite}
.pet-head{transform-box:fill-box;transform-origin:50% 90%;animation:petHeadBob 3.6s ease-in-out infinite}
.pet-tail{transform-box:fill-box;transform-origin:15% 70%;animation:petTail 2.8s ease-in-out infinite}
.pet-blink{transform-box:fill-box;transform-origin:center;animation:petBlink 4.8s infinite}
.pet-sparkle{transform-box:fill-box;transform-origin:center;animation:petSparkle 2.2s ease-in-out infinite}
.pet-treat-flight,.pet-levelup-label,.pet-floating-hearts{position:absolute;pointer-events:none;z-index:3;opacity:0}
.pet-treat-flight{font-size:27px;left:58%;top:62%;transform:translate(-50%,-50%) scale(.35)}
.pet-levelup-label{top:6px;left:50%;white-space:nowrap;transform:translate(-50%,8px) scale(.7);font-weight:950;font-size:13px;letter-spacing:.06em;color:#9d6907;text-shadow:0 1px #fff,0 0 12px #ffd76b}
.pet-floating-hearts{top:22px;left:0;right:0;text-align:center;font-size:20px;white-space:nowrap}
.companion-art.pet-bounce .pet-svg{animation:petHappyBounce .72s ease}
.companion-art.pet-wiggle .pet-svg{animation:petPlayWiggle .75s ease}
.companion-art.pet-feeding .pet-svg{animation:petChew .95s ease-in-out 2}
.companion-art.pet-feeding .pet-treat-flight{animation:petTreatFly .95s ease-in 1 forwards}
.companion-art.pet-level-up{box-shadow:inset 0 0 0 2px #ffe28c,0 0 0 5px #ffe5a855,0 0 34px #ffd86b99}
.companion-art.pet-level-up .pet-svg{animation:petLevelJump 1.05s cubic-bezier(.2,.85,.3,1.3) 1}
.companion-art.pet-level-up .pet-levelup-label{animation:petLevelLabel 1.6s ease-out 1 forwards}
.companion-art.pet-level-up .pet-floating-hearts,.companion-art.pet-bounce .pet-floating-hearts{animation:petHearts .85s ease-out 1 forwards}
.companion-art.pet-arrival .pet-svg{animation:petArrival .95s cubic-bezier(.2,.85,.3,1.25) 1}
.companion-art.pet-arrival:after{content:'✨';position:absolute;inset:8px 0 auto;text-align:center;font-size:28px;animation:petArrivalSparkle 1s ease-out 1;pointer-events:none}
.pet-growth-current{margin-top:16px;padding:13px 15px;background:#f8f6ff;border:1px solid #e8e2ff;border-radius:14px;display:flex;align-items:center;gap:12px}
.pet-growth-icon{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:#ece7ff;display:grid;place-items:center;color:#6254d7;font-size:19px}
.pet-growth-current b{display:block;font-size:13px;margin-bottom:4px}.pet-growth-current span{font-size:12px;color:var(--muted);line-height:1.5}
@keyframes petBreath{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-1.5px) scaleY(1.025)}}
@keyframes petHeadBob{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-2px) rotate(-1deg)}65%{transform:translateY(0) rotate(1deg)}}
@keyframes petTail{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
@keyframes petShadow{0%,100%{transform:scaleX(1);opacity:.75}50%{transform:scaleX(.91);opacity:.54}}
@keyframes petBlink{0%,44%,48%,100%{opacity:1}46%{opacity:.12}}
@keyframes petSparkle{0%,100%{opacity:.6;transform:scale(.82) rotate(0)}50%{opacity:1;transform:scale(1.14) rotate(15deg)}}
@keyframes petHappyBounce{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-13px) scale(1.045)}58%{transform:translateY(1px) scale(.98)}78%{transform:translateY(-3px)}}
@keyframes petPlayWiggle{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-7deg) translateY(-3px)}40%{transform:rotate(7deg) translateY(-6px)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
@keyframes petChew{0%,100%{transform:scale(1)}20%,60%{transform:scale(1.035,.97)}40%,80%{transform:scale(.99,1.02)}}
@keyframes petTreatFly{0%{opacity:0;left:14%;top:72%;transform:translate(-50%,-50%) scale(.45) rotate(-25deg)}20%{opacity:1}80%{opacity:1;left:53%;top:48%;transform:translate(-50%,-50%) scale(1) rotate(12deg)}100%{opacity:0;left:59%;top:50%;transform:translate(-50%,-50%) scale(.25)}}
@keyframes petLevelJump{0%{transform:scale(.94) translateY(0)}35%{transform:scale(1.12) translateY(-18px) rotate(-4deg)}55%{transform:scale(1.04) translateY(0) rotate(4deg)}75%{transform:scale(1.09) translateY(-7px)}100%{transform:scale(1) translateY(0)}}
@keyframes petLevelLabel{0%{opacity:0;transform:translate(-50%,8px) scale(.6)}25%{opacity:1;transform:translate(-50%,-3px) scale(1.1)}65%{opacity:1;transform:translate(-50%,-8px) scale(1)}100%{opacity:0;transform:translate(-50%,-20px) scale(.95)}}
@keyframes petHearts{0%{opacity:0;transform:translateY(12px) scale(.7)}25%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-20px) scale(1.1)}}
@keyframes petArrival{0%{opacity:.35;transform:translateY(18px) scale(.55)}65%{opacity:1;transform:translateY(-8px) scale(1.08)}100%{transform:translateY(0) scale(1)}}
@keyframes petArrivalSparkle{0%{opacity:0;transform:scale(.3)}45%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1.6)}}
@media(max-width:700px){.companion-art{width:148px;height:148px;flex-basis:148px;border-radius:30px}.rank-animal{width:34px;height:34px;flex-basis:34px}.feed-avatar .pet-svg-mini{width:36px;height:36px}}
@media(prefers-reduced-motion:reduce){.pet-floor,.pet-body,.pet-head,.pet-tail,.pet-blink,.pet-sparkle{animation:none!important}.companion-art.pet-bounce .pet-svg,.companion-art.pet-wiggle .pet-svg,.companion-art.pet-feeding .pet-svg,.companion-art.pet-level-up .pet-svg,.companion-art.pet-arrival .pet-svg{animation:none!important}}

.vg-root{--vg-ink:#3a2f4a;--vg-cream:#fffaf0;--vg-gold:#ffbf2e;--vg-gold-d:#d98a00;--vg-sky1:#c9ecff;--vg-sky2:#eaf7ff;--vg-panel:#fffdf8;--vg-line:#eadfcb;font-family:'Jua','Inter','Malgun Gothic',sans-serif;color:var(--vg-ink)}

.vg-layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;align-items:start}
.vg-stage{position:relative;border-radius:22px;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 2px var(--vg-line),0 10px 30px rgba(60,40,90,.12);background:linear-gradient(180deg,var(--vg-sky1) 0%,var(--vg-sky2) 55%,#f4fbe9 100%)}

const MEAL_KEYS=['breakfast','lunch','dinner','snacks'];

function normalizedKorean(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[.,!?。！？，、]/g,' ').replace(/\s+/g,' ').trim()}
function noteFlat(s){return normalizedKorean(s).replace(/\s+/g,'')}
function mealHasExplicitWholeFoodNotEaten(d,key){const r=rec(d),note=String(r.meals[key]?.note||''),flat=noteFlat(note);const brothNeg=/(국물|육수|스프).{0,12}(안먹|안마시|못먹|못마시|먹지않|마시지않|거의안|남기|남겼|버리|손대지)/.test(flat);if(brothNeg)return false;const noEat=/(안먹었|안먹음|먹지않|못먹었|못먹음|전혀안먹|손대지않|그대로남겼)/.test(flat);if(!noEat)return false;const keys=['라면','밥','면','치킨','닭가슴살','계란','달걀','빵','피자','샐러드','고기','튀김','김밥','햄버거','우동','국수','과일','요거트','두부','만두'];return (r.meals[key]?.items||[]).some(it=>{const name=noteFlat(it.name);return keys.some(k=>name.includes(k)&&flat.includes(k))})}
function ruleMealAnalysis(d){
  const r=rec(d),signature=mealNoteSignature(d),adjustments=[],feedback=[],interpretations=[];
  const allItems=MEAL_KEYS.flatMap(key=>(r.meals[key].items||[]).map(it=>({...it,meal_key:key,calorie_total:n(it.cal)*n(it.qty||1),protein_total:n(it.protein)*n(it.qty||1)})));

  const noodleRx=/라면|우동|짬뽕|국수|냉면|쌀국수|칼국수|파스타|면|ramen|noodle|pasta/i;

  for(const key of MEAL_KEYS){

function getWorkoutSummary(date){
  const parts=[];const weights=(db.exerciseLogs||{})[date]||[];const cardio=(db.cardioLogs||{})[date]||[];const d=rec(date);

  cardio.forEach(x=>parts.push(`🏃 ${x.machine||'유산소'} · ${x.minutes||0}분${x.intensity?' · 강도 '+x.intensity:''}${x.distance?' · '+x.distance+'km':''}`));
  if(String(d.workout||'').trim())parts.push('운동 메모: '+String(d.workout).trim());
  if(String(d.cardio||'').trim()&&!cardio.length)parts.push('유산소 메모: '+String(d.cardio).trim());
  return parts.join('\n');
}

    if(!window.fitWorkspace)throw new Error('로그인 연결이 아직 준비되지 않았습니다. 새로고침 후 다시 시도해 주세요.');
    wsProfile=await window.fitWorkspace.ensureProfile();
    const nm=$('#wsDisplayName'),an=$('#wsAnimal'),pet=$('#wsPetName');if(nm)nm.value=wsProfile.display_name||'';if(an)an.value=wsProfile.animal_type||'cat';if(pet)pet.value=wsProfile.pet_name||'콩이';const ps=$('#wsProfileStatus');if(ps)ps.textContent='참여 중';
    const [profiles,entries]=await Promise.all([window.fitWorkspace.listProfiles(),window.fitWorkspace.listEntries()]);wsProfiles=profiles||[];wsEntries=entries||[];
    await vgCommunityLoad(wsEntries).catch(()=>{});const rr=$('#wsRankRows'),ff=$('#wsFeed');if(rr)rr.innerHTML=rankRows(wsProfiles,50);if(ff)ff.innerHTML=workspaceFeedHtml(wsEntries,wsProfiles);
    if(status)status.textContent=`참여 멤버 ${wsProfiles.length}명 · 공유 운동 ${wsEntries.length}건`;
  }catch(e){const ps=$('#wsProfileStatus');if(ps)ps.textContent='설정 확인 필요';if(status)status.textContent='워크스페이스를 불러오지 못했습니다. 아래 SQL 설정 파일을 Supabase SQL Editor에서 실행했는지 확인하세요. 오류: '+(e.message||e);const rr=$('#wsRankRows'),ff=$('#wsFeed');if(rr)rr.innerHTML='<div class="empty">워크스페이스 DB 설정이 필요합니다.</div>';if(ff)ff.innerHTML='<div class="empty">DB 설정 후 공유 기록이 표시됩니다.</div>';const ep=$('#wsProfileError');if(ep)ep.textContent=e.message||String(e)}
}
function dailyMealShareData(date){
  const r=(db.records||{})[date]||{},foodItems=[],notes=[];
  for(const key of MEAL_KEYS){const meal=r.meals?.[key]||{},items=Array.isArray(meal.items)?meal.items:[];for(const it of items){const name=String(it.name||'').trim();if(!name)continue;const qty=Math.max(.1,n(it.qty)||1);foodItems.push(`${name}${qty!==1?` ×${qty}`:''}`)}const note=String(meal.note||'').trim();if(note)notes.push(note)}
  const totals=calcMealTotals(date);const foodText=foodItems.join(' · ');const memoParts=[];if(foodText)memoParts.push(`음식 목록: ${foodText}`);memoParts.push(`하루 합계(메모 반영 추정): ${totals.cal} kcal · 단백질 ${totals.protein} g`);if(notes.length)memoParts.push(`식사 메모: ${notes.join(' / ')}`);return {date,foodItems,foodText,notes,calories:totals.cal,protein:totals.protein,memo:memoParts.join('\n').slice(0,1200),hasFood:foodItems.length>0};
}
function renderMealSharePreview(date){const box=$('#mealSharePreview');if(!box)return;const data=dailyMealShareData(date);if(!data.hasFood){box.innerHTML='<b>이 날짜에는 등록된 음식이 없습니다.</b><div class="mini-note">먼저 식단·체중 기록에서 음식을 입력하고 저장해 주세요.</div>';return}box.innerHTML=`<h3>${esc(date)} · 하루 전체 식단</h3><div>${data.foodItems.map(x=>`<span class="meal-food-chip">${esc(x)}</span>`).join('')}</div><div class="day-summary-totals"><span>🔥 ${data.calories.toLocaleString()} kcal</span><span>💪 단백질 ${data.protein} g</span></div>${data.notes.length?`<div class="mini-note">식사 메모: ${esc(data.notes.join(' / '))}</div>`:''}<div class="mini-note" style="margin-top:8px">공유하면 위 음식 목록과 하루 합계가 한 게시글에 함께 표시됩니다.</div>`}
function groupedDailyMealFeedHtml(meals,profiles){
  if(!meals?.length)return '<div class="empty">아직 공유된 하루 식단이 없습니다. 오늘 기록을 첫 공유해 보세요.</div>';
  const pmap=new Map((profiles||[]).map(p=>[p.user_id,p]));const groups=new Map();
  [...meals].sort((a,b)=>String(a.meal_date||'').localeCompare(String(b.meal_date||''))||String(a.created_at||'').localeCompare(String(b.created_at||''))).forEach(m=>{const key=`${m.user_id}|${m.meal_date}`;if(!groups.has(key))groups.set(key,{user_id:m.user_id,date:m.meal_date,rows:[]});groups.get(key).rows.push(m)});
  return [...groups.values()].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).map(g=>{const p=pmap.get(g.user_id)||{},whole=g.rows.filter(x=>String(x.meal_type||'')==='하루 전체').sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));let foodNames=[],calories=0,protein=0,memo='';if(whole.length){const m=whole[0];calories=Number(m.calories)||0;protein=Number(m.protein_g)||0;memo=String(m.memo||'');foodNames=[String(m.food_name||'하루 전체 식단')]}else{foodNames=g.rows.map(x=>String(x.food_name||'')).filter(Boolean);calories=g.rows.reduce((s,x)=>s+(Number(x.calories)||0),0);protein=g.rows.reduce((s,x)=>s+(Number(x.protein_g)||0),0);memo=g.rows.map(x=>x.memo?`${x.meal_type||'식사'}: ${x.memo}`:'').filter(Boolean).join('\n')}
    const foodSummary=whole.length?(memo.match(/음식 목록:\s*([^\n]+)/)?.[1]||foodNames[0]):foodNames.join(' · ');const detail=memo.replace(/^음식 목록:.*(?:\n|$)/,'').trim();
    return `<article class="meal-feed-card"><div class="feed-top"><b>${esc(p.display_name||'FIT 러너')}</b><span>${esc(g.date||'')}</span></div><h3>🥗 하루 전체 식단</h3><div class="meal-feed-meta"><span>🔥 ${Math.round(calories).toLocaleString()} kcal</span><span>💪 단백질 ${Math.round(protein*10)/10} g</span></div>${foodSummary?`<div class="meal-feed-body"><b>음식</b> · ${esc(foodSummary)}</div>`:''}${detail?`<div class="meal-feed-body">${esc(detail)}</div>`:''}</article>`
  }).join('');
}

async function wireCompanion(){
  if(VG.ticker){clearInterval(VG.ticker);VG.ticker=null}
  VG.view='mine';VG.mode=null;VG.sel=null;VG.friend=null;VG.ter=null;VG.full=false;document.body.classList.remove('vg-noscroll');
  document.querySelectorAll('body > #vgSide').forEach(e=>e.remove());if(vgMob()){const sd=document.getElementById('vgSide');if(sd)document.body.appendChild(sd)}
  vgBindOnce();
  const stage=$('#vgStage');
  try{
    if(!window.fitVillage)throw new Error('로그인 연결이 아직 준비되지 않았습니다. 잠시 후 다시 열어 주세요.');
    if(!VG.catalog.length){VG.catalog=await window.fitVillage.catalog();VG.cat={};VG.catalog.forEach(c=>VG.cat[c.item_key]=c)}
    vgSetState(await window.fitVillage.init());
    window.fitVillage.giftInbox().then(l=>{if(l&&l.length)vgGiftArrived(l)}).catch(()=>{});
    VG.ready=true;VG.setup=false;if(vgMob()&&!VG.zoomSet){VG.zoom=.7;VG.zoomSet=true}VG.sheet=false;
    window.fitVillage.likedToday().then(s=>{VG.liked=s}).catch(()=>{});
    vgAll(true);
    VG.ticker=setInterval(vgTick,1000);
  }catch(e){
    VG.ready=false;
    if(e.setup){stage.innerHTML=`<div style="padding:28px"><div class="vg-setup"><b style="font-size:18px">🛠 마을 데이터베이스 설정이 필요합니다</b><br>Supabase → SQL Editor에서 <b>fit_village_setup.sql</b>을 한 번 실행한 뒤 이 페이지를 새로고침해 주세요.</div></div>`}
    else stage.innerHTML=`<div style="padding:28px"><div class="vg-setup"><b style="font-size:18px">마을을 열 수 없어요</b><br>${esc(e.message||String(e))}<br><button class="vg-btn gold sm" id="vgRetry" style="margin-top:10px">다시 불러오기</button></div></div>`;
    $('#vgRetry')?.addEventListener('click',wireCompanion);
  }

/* =====================================================================

const VG_HU=14;   // 높이 1층 = 14px
const VG_TT={

  dirt:{n:'흙',i:'🟫',a:'#d9a873',b:'#d19f69',s1:'#b07a48',s2:'#9a683b',e:'#c49260'},
  sand:{n:'모래',i:'🏖️',a:'#f6e2a8',b:'#f1da9b',s1:'#d8b874',s2:'#c7a663',e:'#e8cf8e'},
  stone:{n:'돌',i:'🪨',a:'#c4c7cf',b:'#babec7',s1:'#9198a5',s2:'#7f8693',e:'#aeb3bd'},

const VG_BG={sky:{n:'하늘섬',i:'☁️'},spring:{n:'봄 산수화',i:'🌸'},sea:{n:'바다 섬',i:'🌊'},forest:{n:'숲속',i:'🌲'},night:{n:'별밤',i:'🌙'}};

function vgTerMap(st){if(VG.ter&&st===VG.state)return VG.ter.draft;const m=new Map();(st&&st.terrain||[]).forEach(c=>m.set(c.x+','+c.y,{h:Number(c.h)||0,t:c.t||'grass'}));return m}
function vgHAt(x,y,st){const c=vgTerMap(st||(VG.view==='friend'?VG.friendState:VG.state)).get(x+','+y);return c?c.h:0}
function vgTAt(x,y,st){const c=vgTerMap(st||VG.state).get(x+','+y);return c?c.t:'grass'}

/* 칸 하나 (윗면 + 옆면) */
function vgTileSvg(x,y,G,c){const [cx,cy]=G.c(x,y),h=c?c.h:0,tt=VG_TT[c?c.t:'grass']||VG_TT.grass,o=h*VG_HU,ty=cy-o,dt=`data-tile="${x},${y}"`;let s='';
  if(h>0){s+=`<polygon ${dt} class="vg-tside" points="${cx-36},${ty} ${cx},${ty+18} ${cx},${cy+18} ${cx-36},${cy}" fill="${tt.s1}"/><polygon ${dt} class="vg-tside" points="${cx},${ty+18} ${cx+36},${ty} ${cx+36},${cy} ${cx},${cy+18}" fill="${tt.s2}"/>`;
    for(let k=1;k<h;k++){const yy=cy-k*VG_HU;s+=`<path d="M${cx-36},${yy} L${cx},${yy+18} L${cx+36},${yy}" stroke="#00000018" stroke-width="1.2" fill="none" pointer-events="none"/>`}
    s+=`<path d="M${cx-36},${ty} L${cx},${ty+18} L${cx+36},${ty}" stroke="#ffffff55" stroke-width="1.5" fill="none" pointer-events="none"/>`}
  s+=`<polygon class="vg-tile" ${dt} points="${cx},${ty-18} ${cx+36},${ty} ${cx},${ty+18} ${cx-36},${ty}" fill="${(x+y)%2?tt.a:tt.b}" stroke="${tt.e}" stroke-width=".8"/>`;
  const t=c?c.t:'grass',hs=(x*7+y*13)%5;
  if(t==='grass'&&hs===0)s+=`<path d="M${cx-8},${ty+4} l2,-6 l2,6 M${cx+10},${ty-4} l1.5,-5 l1.5,5" stroke="#6fbf55" stroke-width="1.4" fill="none" pointer-events="none"/>`;
  else if(t==='water')s+=`<path class="vg-wave" d="M${cx-16},${ty-2} q4,-3 8,0 t8,0 M${cx+2},${ty+6} q4,-3 8,0 t8,0" stroke="#ffffffaa" stroke-width="1.6" fill="none" stroke-linecap="round" pointer-events="none"/>`;
  else if(t==='flower'){const C=['#ff8fb1','#fff27a','#ffffff','#c99bff'];for(let k=0;k<4;k++){const px=cx+((x*11+y*5+k*17)%40)-20,py=ty+((x*5+y*9+k*7)%16)-8;s+=`<circle cx="${px}" cy="${py}" r="2.4" fill="${C[(x+y+k)%4]}" pointer-events="none"/>`}}
  else if(t==='stone'&&hs<3)s+=`<ellipse cx="${cx+((x*9)%20)-10}" cy="${ty+((y*7)%10)-5}" rx="5" ry="2.6" fill="#9ea3ad" pointer-events="none"/>`;
  else if(t==='sand'&&hs<2)s+=`<circle cx="${cx-6}" cy="${ty+3}" r="1.2" fill="#d9b86a" pointer-events="none"/><circle cx="${cx+9}" cy="${ty-3}" r="1.2" fill="#d9b86a" pointer-events="none"/>`;
  else if(t==='snow'&&hs<2)s+=`<circle cx="${cx+8}" cy="${ty+2}" r="1.6" fill="#ffffff" pointer-events="none"/>`;
  return s}

/* 섬 아래 (떠 있는 바위) · 바다 배경이면 물결 */
function vgIslandBase(G,N,D,bg){const L=[G.ox-N*36,G.top+N*18],B=[G.ox,G.top+N*36],R=[G.ox+N*36,G.top+N*18];
  if(bg==='sea')return `<ellipse cx="${G.ox}" cy="${B[1]+D-2}" rx="${N*44}" ry="${N*14}" fill="#ffffff55"/><ellipse class="vg-foam" cx="${G.ox}" cy="${B[1]+D-4}" rx="${N*40}" ry="${N*12}" fill="none" stroke="#ffffffaa" stroke-width="3" stroke-dasharray="14 10"/>`;
  const y0=L[1]+D,yb=B[1]+D,s=N/8;
  const pts=[[L[0],y0],[B[0],yb],[R[0],y0],[R[0]-60*s,y0+70*s],[G.ox+120*s,yb+60*s],[G.ox+40*s,yb+140*s],[G.ox,yb+190*s],[G.ox-50*s,yb+130*s],[G.ox-130*s,yb+70*s],[L[0]+55*s,y0+80*s]];
  const P=pts.map(p=>p.join(',')).join(' ');
  return `<defs><linearGradient id="vgRock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a6b45"/><stop offset=".45" stop-color="#7a5a48"/><stop offset="1" stop-color="#4e4458"/></linearGradient></defs>
   <polygon points="${P}" fill="url(#vgRock)"/>
   <polygon points="${B[0]},${yb} ${R[0]},${y0} ${R[0]-60*s},${y0+70*s} ${G.ox+120*s},${yb+60*s} ${G.ox+40*s},${yb+140*s} ${G.ox},${yb+190*s}" fill="#00000022"/>
   <path d="M${L[0]+70*s},${y0+40*s} l${10*s},${8*s} l${-6*s},${10*s} M${G.ox+90*s},${yb+30*s} l${-8*s},${10*s} l${6*s},${8*s}" stroke="#00000025" stroke-width="2" fill="none"/>
   <circle cx="${G.ox-30*s}" cy="${yb+70*s}" r="${7*s}" fill="#ffffff14"/><circle cx="${G.ox+60*s}" cy="${yb+40*s}" r="${5*s}" fill="#ffffff14"/>`}

/* 배경 (그림이 있으면 그림, 없으면 그려서) */
function vgBgHtml(bg){bg=VG_BG[bg]?bg:'sky';let s='';
  const mt=(y,amp,col,seed,op)=>{let d=`M0,600 L0,${y}`;for(let i=0;i<=20;i++){const x=i*50,v=y-amp*Math.abs(Math.sin(i*1.7+seed))-amp*.4*Math.sin(i*.6+seed*2);d+=` L${x},${v.toFixed(1)}`}return `<path d="${d} L1000,600 Z" fill="${col}" opacity="${op||1}"/>`};
  if(bg==='sky')s=`<defs><linearGradient id="bgS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd6ff"/><stop offset=".7" stop-color="#dff2ff"/><stop offset="1" stop-color="#f4fbff"/></linearGradient></defs><rect width="1000" height="600" fill="url(#bgS)"/>${mt(470,60,'#c9e3f5',1,.8)}${mt(520,40,'#b7d8ef',3,.8)}<ellipse cx="200" cy="560" rx="260" ry="40" fill="#fff" opacity=".7"/><ellipse cx="820" cy="575" rx="300" ry="45" fill="#fff" opacity=".75"/>`;
  else if(bg==='spring')s=`<defs><linearGradient id="bgP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe3ea"/><stop offset=".6" stop-color="#fff4e6"/><stop offset="1" stop-color="#f6efd9"/></linearGradient></defs><rect width="1000" height="600" fill="url(#bgP)"/><circle cx="800" cy="120" r="60" fill="#ffd8c2" opacity=".7"/>${mt(330,110,'#a9c9c4',2,.55)}${mt(400,90,'#7fb0a6',5,.65)}${mt(480,70,'#5e9a8e',8,.75)}<path d="M0,560 Q250,520 500,560 T1000,555 L1000,600 L0,600Z" fill="#9fcde0" opacity=".7"/>${Array.from({length:40},(_,i)=>`<circle cx="${(i*97)%1000}" cy="${80+(i*53)%380}" r="${2+(i%3)}" fill="#ffb3c8" opacity=".7"/>`).join('')}`;
  else if(bg==='sea')s=`<defs><linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd2ff"/><stop offset=".38" stop-color="#d8f1ff"/><stop offset=".4" stop-color="#5cc3e6"/><stop offset="1" stop-color="#2f9fcf"/></linearGradient></defs><rect width="1000" height="600" fill="url(#bgA)"/><circle cx="160" cy="110" r="46" fill="#fff6c8"/><path d="M640,240 q40,-60 80,0 Z" fill="#7cbf6a"/><path d="M90,245 q30,-40 60,0 Z" fill="#8ccd78"/>${Array.from({length:30},(_,i)=>`<path d="M${(i*137)%1000},${260+(i*61)%330} q10,-6 20,0" stroke="#ffffff99" stroke-width="2" fill="none"/>`).join('')}`;
  else if(bg==='forest')s=`<defs><linearGradient id="bgF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7efc9"/><stop offset=".6" stop-color="#eef7df"/><stop offset="1" stop-color="#cfe6b4"/></linearGradient></defs><rect width="1000" height="600" fill="url(#bgF)"/>${Array.from({length:26},(_,i)=>{const x=i*40-10,h=120+((i*37)%90);return `<path d="M${x},${360} l25,-${h} l25,${h} Z" fill="${i%2?'#6aa57a':'#5b9670'}" opacity=".8"/>`}).join('')}<rect y="350" width="1000" height="250" fill="#a6d38b"/>${Array.from({length:22},(_,i)=>{const x=i*48+5,h=90+((i*29)%70);return `<path d="M${x},${420} l22,-${h} l22,${h} Z" fill="#4f8a5e"/>`}).join('')}`;
  else s=`<defs><linearGradient id="bgN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171a45"/><stop offset=".7" stop-color="#3c3577"/><stop offset="1" stop-color="#5a4a8a"/></linearGradient></defs><rect width="1000" height="600" fill="url(#bgN)"/><circle cx="820" cy="110" r="42" fill="#fff4c8"/><circle cx="836" cy="100" r="38" fill="#2a2a60"/>${Array.from({length:70},(_,i)=>`<circle class="vg-star" style="animation-delay:-${i%5}s" cx="${(i*151)%1000}" cy="${(i*67)%420}" r="${(i%3)*.6+.8}" fill="#fff"/>`).join('')}${mt(500,60,'#2b2a5a',4,.9)}`;
  return `<div class="vg-bg bg-${bg}"><svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">${s}</svg><img src="images/bg/bg_${bg}.webp" alt="" onload="this.classList.add('on')" onerror="this.remove()"></div>`}

/* 배경 고르기 */
function vgBgPick(){const cur=(VG.state.village||{}).bg||'sky';
  const m=vgModal(`<h3>🖼️ 마을 배경</h3><p class="vg-mp">친구가 놀러 와도 같은 배경이 보여요.</p><div class="vg-bgl">${Object.entries(VG_BG).map(([k,b])=>`<button class="vg-bgo ${k===cur?'on':''}" data-bg="${k}"><div class="vg-bgp">${vgBgHtml(k)}</div><b>${b.i} ${b.n}</b></button>`).join('')}</div>`,'vg-wide');
  m.querySelectorAll('[data-bg]').forEach(b=>b.onclick=async()=>{const k=b.dataset.bg;try{vgSetState(await window.fitVillage.setBg(k));m.remove();vgRenderStage();vgToast(`🖼️ 배경을 ${VG_BG[k].n}(으)로 바꿨어요`)}catch(e){vgToast(e.setup?'Supabase에 fit_village_update37.sql 실행이 필요합니다.':(e.message||String(e)),true)}})}

/* 지형 편집 */
function vgTerStart(){VG.mode=null;VG.sel=null;VG.ter={tool:'up',big:false,draft:new Map(),orig:new Map()};(VG.state.terrain||[]).forEach(c=>VG.ter.orig.set(c.x+','+c.y,{h:Number(c.h)||0,t:c.t}));
  VG.ter.draft=new Map([...VG.ter.orig].map(([k,v])=>[k,{...v}]));vgRenderStage();vgRenderSide()}
function vgTerCells(){const T=VG.ter,keys=new Set([...T.draft.keys(),...T.orig.keys()]),out=[];let cost=0;
  keys.forEach(k=>{const a=T.orig.get(k)||{h:0,t:'grass'},b=T.draft.get(k)||{h:0,t:'grass'};if(a.h===b.h&&a.t===b.t)return;const [x,y]=k.split(',').map(Number);out.push({x,y,h:b.h,t:b.t});cost+=(b.h-a.h)*100});return {cells:out,cost}}
function vgTerApply(x,y){const T=VG.ter,N=vgSize(VG.state.village.land_level),R=T.big?1:0;
  for(let dx=-R;dx<=R;dx++)for(let dy=-R;dy<=R;dy++){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=N||Y>=N)continue;const k=X+','+Y,c=T.draft.get(k)||{h:0,t:'grass'};
    if(T.tool==='up')c.h=Math.min(4,c.h+1);else if(T.tool==='down')c.h=Math.max(0,c.h-1);else if(T.tool==='flat')c.h=0;else c.t=T.tool;
    if(c.h===0&&c.t==='grass')T.draft.delete(k);else T.draft.set(k,c)}
  vgRenderStage()}
function vgTerBar(){const T=VG.ter,{cells,cost}=vgTerCells();
  const tools=[['up','⬆️','올리기'],['down','⬇️','내리기'],['flat','➖','평평'],...Object.entries(VG_TT).map(([k,t])=>[k,t.i,t.n])];
  return `<div class="vg-terbar"><div class="vg-tert">${tools.map(([k,i,n])=>`<button class="${T.tool===k?'on':''}" data-tt="${k}"><span>${i}</span><small>${n}</small></button>`).join('')}<button class="${T.big?'on':''}" data-tbig="1"><span>${T.big?'▣':'▫'}</span><small>${T.big?'3×3':'1칸'}</small></button></div>
   <div class="vg-terf"><small>칸을 눌러 꾸미세요 · ${cells.length}칸 바뀜 · ${cost>0?`🪙 −${vgN(cost)}`:cost<0?`🪙 +${vgN(-cost)} 돌려받음`:'비용 없음'} (높이 1층 = 100)</small><button class="vg-btn sm" id="vgTerX">취소</button><button class="vg-btn sm gold" id="vgTerS" ${cells.length?'':'disabled'}>저장</button></div></div>`}
async function vgTerSave(){const {cells}=vgTerCells();if(!cells.length){VG.ter=null;vgRenderStage();return}
  try{const r=await window.fitVillage.terrainSave(cells);VG.ter=null;vgSetState(r);vgRenderHud();vgRenderStage();vgRenderSide();vgToast(`🏔️ 지형 저장 완료 (${r.changed}칸${r.cost>0?` · −${vgN(r.cost)}코인`:r.cost<0?` · +${vgN(-r.cost)}코인`:''})`)}
  catch(e){vgToast(e.setup?'Supabase에 fit_village_update37.sql 실행이 필요합니다.':(e.message||String(e)),true)}}

function vgWheelSvg(){let s='';const R=120;VG_RL.forEach((seg,i)=>{const a0=(i*45-90)*Math.PI/180,a1=((i+1)*45-90)*Math.PI/180,am=((i+.5)*45-90)*Math.PI/180;

const VG_SPOT_POOL=['tree','flower','bush','lamp','bench','pond','mushroom_house','fountain','fence'];
function vgSpotMake(){const cre=VG.catalog.filter(c=>c.kind==='animal').map(c=>c.item_key).filter(k=>VG_CRE[k]||VG.cat[k]?.image_url);
  const pick=a=>a.splice(Math.floor(Math.random()*a.length),1)[0];const cp=[...cre],dp=[...VG_SPOT_POOL],objs=[];
  for(let r=0;r<3;r++)for(let c=0;c<4;c++){const animal=(r+c)%2===0||dp.length===0;const key=animal&&cp.length?pick(cp):pick(dp);const x=50+c*87+(Math.random()*12-6),y=100+r*72+(Math.random()*8-4);objs.push({key,x,y,s:animal?.64:.6})}
  const kinds=['hide','hue','big','small','extra'],idx=[];while(idx.length<5){const i=Math.floor(Math.random()*objs.length);if(!idx.includes(i))idx.push(i)}
  const gray=['pebble_golem','fountain','stone_path','crystal_golem','lamp'];
  const diffs=idx.map(i=>{let k=kinds[Math.floor(Math.random()*kinds.length)];if(k==='hue'&&gray.includes(objs[i].key))k='extra';const o=objs[i];return {i,k,cx:k==='extra'?o.x+24:o.x,cy:k==='extra'?o.y-46:o.y-22,found:false}});return {objs,diffs}}
function vgSpotSvg(sc,right){const dm={};if(right)sc.diffs.forEach(d=>dm[d.i]=d);let g='';
  sc.objs.forEach((o,i)=>{const d=dm[i];if(d&&d.k==='hide')return;let s=o.s;if(d&&d.k==='big')s*=1.35;if(d&&d.k==='small')s*=.68;
    g+=`<g transform="translate(${o.x.toFixed(1)},${o.y.toFixed(1)}) scale(${s})"${d&&d.k==='hue'?' filter="url(#vgHue)"':''}>${vgArt(o.key)}</g>`;
    if(d&&d.k==='extra')g+=`<g transform="translate(${d.cx},${d.cy})"><path d="M0,-9 L2.6,-2.8 L9,-2.8 L3.8,1.4 L5.6,8 L0,4.2 L-5.6,8 L-3.8,1.4 L-9,-2.8 L-2.6,-2.8Z" fill="#ffd34d" stroke="#3b2417" stroke-width="1.6" stroke-linejoin="round"/></g>`});
  return `<svg viewBox="0 0 360 270" class="vg-spot-svg" data-side="${right?1:0}"><defs><filter id="vgHue"><feColorMatrix type="hueRotate" values="150"/></filter><linearGradient id="vgSpotSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9ecff"/><stop offset="1" stop-color="#eaf7ff"/></linearGradient></defs><rect width="360" height="270" fill="url(#vgSpotSky)"/><circle cx="318" cy="30" r="16" fill="#ffe27a"/><ellipse cx="180" cy="190" rx="230" ry="130" fill="#a4e080"/><ellipse cx="180" cy="196" rx="200" ry="104" fill="#98d975"/>${g}<g class="vg-spot-marks"></g></svg>`}

  const sc=vgSpotMake(),TOTAL=60;let left=TOTAL,found=0,done=false,timer=null;const t0=Date.now();
  const m=vgModal(`<h3>🔍 틀린그림찾기</h3><p class="vg-mp">오른쪽 그림에서 다른 곳 <b>5개</b>를 찾아 클릭하세요 · 잘못 누르면 −5초</p><div class="vg-spot-bar"><span>찾은 개수 <b id="vgSpFound">0</b>/5</span><div class="vg-store-bar" style="flex:1;margin:0 10px"><span id="vgSpTime" style="width:100%"></span></div><span><b id="vgSpSec">${TOTAL}</b>초</span></div><div class="vg-spot-wrap">${vgSpotSvg(sc,false)}${vgSpotSvg(sc,true)}</div><div id="vgSpMsg" class="vg-result">&nbsp;</div>`,'vg-xwide');

  const tick=()=>{left=Math.max(0,TOTAL-(Date.now()-t0)/1000-pen);m.querySelector('#vgSpSec').textContent=Math.ceil(left);m.querySelector('#vgSpTime').style.width=(left/TOTAL*100)+'%';if(left<=0)finish()};let pen=0;timer=setInterval(tick,200);
  m.querySelectorAll('.vg-spot-svg').forEach(svg=>svg.addEventListener('click',e=>{if(done)return;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());

  async function finish(){if(done)return;done=true;clearInterval(timer);const secs=Math.round((Date.now()-t0)/1000);const msg=m.querySelector('#vgSpMsg');

function vgCanAuto(){const bt=VD.battle;return !!bt&&bt.floor>0&&bt.floor<=((VD.st&&VD.st.best)||0)}
function vgAutoPick(){const bt=VD.battle,b=bt.boss,P=bt.party,big=b.next==='smash'||b.next==='sweep'||b.next==='poison';
  const low=P.some(p=>p.hp>0&&p.hp<p.max*.55),dead=P.some(p=>p.hp<=0);
  const DEF=['shield','aegis','taunt','counter','dodge','timestop','stun'],HEAL=['heal','revive','rebirth','cleanse','grove'];
  let defUsed=false;
  return P.map(p=>{if(p.hp<=0||p.stun>0)return 'attack';const s=p.skill,ready=!(p.cd>0);
    if(ready&&b.next==='smash'&&DEF.includes(s)&&!defUsed){defUsed=true;return 'skill'}
    if(ready&&HEAL.includes(s))return (low||dead)?'skill':'attack';
    if(ready&&DEF.includes(s))return big&&!defUsed?(defUsed=true,'skill'):(s==='stun'||s==='timestop'?'skill':'attack');
    if(b.next==='smash'&&!defUsed)return 'guard';
    return ready?'skill':'attack'})}

const EQ_SLOT={weapon:['🗡️','무기','공격'],armor:['🛡️','갑옷','체력'],acc:['💍','장신구','방어']};

function eqMain(slot,g,l){return Math.round(({weapon:[0,20,40,70,110],armor:[0,150,300,520,800],acc:[0,8,16,28,44]})[slot][g]*(1+.1*l))}

function eqSellV(e){return [0,200,600,2000,6000][e.grade]+Math.floor([0,1,2,4,8][e.grade]*300*e.lvl*(e.lvl+1)/2/2)}

   <div class="eq-subs">${(e.subs||[]).map(x=>`<span>${EQ_SUB[x.k]||x.k} +${x.v}%</span>`).join('')||'<span class="none">부가 옵션 없음</span>'}</div>
   ${it?`<div class="eq-on">${vgArtSvg(vgK(it))} ${esc(c?.name||'')} 착용 중</div>`:''}</div>
   ${btns?`<div class="eq-btns"><button class="vg-btn sm purple" data-eqon="${e.id}">${it?'교체':'장착'}</button>${it?`<button class="vg-btn sm" data-eqoff="${e.id}">해제</button>`:''}<button class="vg-btn sm gold" data-equp="${e.id}" ${e.lvl>=10?'disabled':''}>${e.lvl>=10?'MAX':`강화 ${vgN(eqCost(e))}`}</button><button class="vg-btn sm" data-eqsell="${e.id}">판매</button></div>`:''}</div>`}

const AW={list:null,unlocked:new Set(),stones:0,err:null};
function awSet(r){if(!r)return;AW.list=r.list||AW.list||[];AW.unlocked=new Set(r.unlocked||[]);AW.stones=Number(r.stones)||0;if(TW.st)TW.st.stones=AW.stones}

   <div class="aw-list">${rows.map(u=>{const c=VG.cat[u.key]||{},on=awOn(u.key),has=own.has(u.key),g=VG_GRADE[c.grade]||{name:''};
     return `<div class="aw-card ${on?'on':''} ${has?'':'no'}"><div class="aw-art">${vgArtSvg(u.key)}<span class="vg-grade vg-g${c.grade}">${g.name}</span>${vgElB(c)}</div>
      <div class="grow"><b class="aw-cn">${esc(c.name||u.key)}</b><div class="aw-sk">${esc(u.emoji)} ${esc(u.name)}</div><small class="aw-d">${esc(u.descr)}</small></div>

    try{awSet(await window.fitVillage.awUnlock(u.key));awRender(m);await vgUniqueCut({name:u.name,emoji:u.emoji,awaken:true},{key:u.key,skill:c.skill});vgToast(`🌟 ${c.name} 각성! 고유 스킬 [${u.name}] 해금`);

/* 고유 스킬 컷신 (탑에서는 고유 스킬 때만 컷신) — 영상: images/chars/{키}_unique.mp4 가 있으면 우선, 없으면 캐릭터 영상 → 기본 연출 */
async function vgUniqueCut(e,mem){if(!vgCutPref().ally)return false;const c=VG.cat[mem.key]||{},col=((typeof VFX!=='undefined'&&VFX[mem.skill])||{}).c||'#ffd34d';

/* ===== 심연의 탑 4단계 : 하위 등급 한계돌파 (일반·희귀·영웅 · ★5 이후 +1~+5) ===== */
const LB_RATE={1:.36,2:.26,3:.16},LB_STONE=[2,3,4,6,8],LB_COIN={1:1000,2:2000,3:4000};
function vgLbOk(it){const c=it&&VG.cat[it.item_key];return !!(c&&c.kind==='animal'&&LB_RATE[c.grade])}
function vgLbM(it,lb){const c=VG.cat[it.item_key]||{};return 1+(LB_RATE[c.grade]||0)*(lb==null?(Number(it.lb)||0):lb)}
function vgLbBadge(it,cls=''){const l=Number(it&&it.lb)||0;return l?`<span class="lb-badge ${cls} ${l>=5?'max':''}" title="한계돌파 +${l}">🔓+${l}</span>`:''}

function vgTwStat(it){const c=VG.cat[it.item_key],g=c.stat_grade||c.grade;return (VG_GSTAT[g]||VG_GSTAT[1]).map(v=>Math.round(v*(1+.1*(it.tr||0))*vgLbM(it)))}

  const st=VG_GSTAT[c.stat_grade||c.grade]||VG_GSTAT[1],at=x=>st.map(v=>Math.round(v*1.5*vgLbM(it,x))),cur=at(l),nx=l<5?at(l+1):null;
  const ns=LB_STONE[l],nc=l<5?LB_COIN[c.grade]*(l+1):0,stones=vgLbStones(),coins=Number(VG.state.village.coins)||0;

   <small class="lb-note">심연의 탑 전투에 적용 · 단계마다 능력치 <b>+${Math.round(LB_RATE[c.grade]*100)}%</b> · 필살기 위력 +6%</small>
   ${row('탑 체력',0)}${row('탑 공격',1)}${row('탑 방어',2)}<div class="vt-row"><span>필살기 위력</span><b>+${t*12+l*6}%</b>${nx?`<em>→ +${t*12+(l+1)*6}%</em>`:''}</div>
   <div class="vt-mile ${l>=5?'on':''}">+5 돌파 각성 — 탑에서 치명타 확률 +10%</div>

   <button class="vg-btn purple full" id="lbGo" ${l>=5||stones<ns||coins<nc?'disabled':''}>${l>=5?'최대 한계돌파 (+5) 달성!':stones<ns?`돌파석이 부족해요 (🔶 ${ns}개 필요)`:coins<nc?`코인이 부족해요 (${vgN(nc)})`:`🔓 +${l+1} 한계돌파 · 🔶${ns} + ${vgN(nc)}코인`}</button></div>`}
async function vgLimitBreak(){const F=VG.fuse,it=(VG.state.items||[]).find(i=>i.id===F.ti);if(!it||!vgLbOk(it))return;const l=(Number(it.lb)||0)+1,c=VG.cat[it.item_key];

function ptStat(it){const b=vgTwStat(it),a={hp:0,atk:0,def:0},p={hp:0,atk:0,def:0,crit:0,skill:0};

  DX.m=vgModal('<div class="fs-load">📖 도감 여는 중…</div>','vg-wide dx-modal');
  try{DX.st=await window.fitVillage.dexState()}catch(e){DX.m.remove();vgToast(e.setup?'Supabase에 fit_village_update32.sql 실행이 필요합니다.':(e.message||String(e)),true);return}
  dxRender()}
function dxRender(){const s=DX.st,box=DX.m.querySelector('.vg-modal-box'),L=s[DX.tab]||[],got=L.filter(x=>x.got).length,steps=s.steps[DX.tab]||[],cl=new Set(s.claimed||[]);
  const card=DX.tab==='cook'?x=>{const g=fmG(x.k);return `<div class="dx-c ${x.got?'':'no'}">${x.gr?'<i class="dx-star" title="대성공 달성">⭐</i>':''}<img src="${g.icon}" alt=""><b>${x.got?esc(g.name):'???'}</b><small>${x.got?`${x.n}개 만듦`:Object.keys(x.in||{}).map(k=>`<img class="dx-ing" src="${fmG(k).icon}" alt="" title="${esc(fmG(k).name)}">`).join('')}</small></div>`}
   :x=>{const g=fmG(x.k),gr=VG_GRADE[x.g]||VG_GRADE[1];return `<div class="dx-c ${x.got?'':'no'} g${x.g}"><span class="vg-grade vg-g${x.g}" style="position:static">${gr.name}</span><img src="${g.icon}" alt=""><b>${x.got?esc(g.name):'???'}</b><small>${x.got?`${x.n}마리`:'아직 못 낚음'}</small></div>`};
  box.innerHTML=`<button class="vg-x" title="닫기">✕</button><h3>📖 농장 도감</h3>
   <div class="dx-tabs">${[['cook','🍳 요리'],['fish','🐟 물고기']].map(([k,n])=>`<button class="vg-btn sm ${DX.tab===k?'gold':''}" data-dt="${k}">${n} ${(s[k]||[]).filter(x=>x.got).length}/${(s[k]||[]).length}</button>`).join('')}<span class="fm-chip fc">🌾 ${vgN(s.farm_coins||0)}</span></div>
   <div class="dx-prog"><i style="width:${L.length?got/L.length*100:0}%"></i><span>${got} / ${L.length}</span></div>
   <div class="dx-steps">${steps.map(([need,rw],i)=>{const n=need||L.length,id=`${DX.tab}:${i+1}`,done=cl.has(id),ok=got>=n;
     return `<div class="dx-st ${done?'done':ok?'ok':''}"><b>${need?`${n}개`:'전부'}</b><small>🌾+${rw}</small>${done?'<em>✅</em>':ok?`<button class="vg-btn sm gold" data-dc="${i+1}">받기</button>`:`<em>${got}/${n}</em>`}</div>`}).join('')}</div>
   <p class="vg-note">${DX.tab==='cook'?'요리 공방에서 처음 만든 요리는 🌾 +1 · 요리마다 첫 <b>⭐대성공</b>은 코인 보너스! 못 만든 요리는 재료 힌트가 보여요.':'낚시터에서 잡아요. 전설 · 신화는 처음 잡으면 🌾 +2 보너스!'}</p>
   <div class="dx-grid">${L.map(card).join('')}</div>`;
  box.querySelector('.vg-x').onclick=()=>{DX.m.remove();DX.m=null};
  box.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>{DX.tab=b.dataset.dt;dxRender()});
  box.querySelectorAll('[data-dc]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await window.fitVillage.dexClaim(DX.tab,Number(b.dataset.dc));DX.st=r;vgToast(`📖 도감 보상! 🌾 농장코인 +${r.gain}`);if(FM.st){FM.st.farm_coins=r.farm_coins;if(FM.m)fmRender()}dxRender()}catch(e){b.disabled=false;vgToast(e.message||String(e),true)}})}


function daily(){

      </div>

    </div>
    <div style="margin-bottom:20px;">
      <label style="display:block; margin-bottom:8px;">⚡ 자주 먹는 음식 빠른 추가</label>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        ${[...presets,...(db.profile.customFoods||[])].map((p,i)=>`<button class="preset-btn" data-add-preset="${esc(p.name)}" data-cal="${p.cal}" data-protein="${p.protein}">＋ ${esc(p.name)} (${p.cal}kcal)</button>`).join('')}
      </div>
    </div>
    <div class="panel section" style="padding:14px;margin-bottom:18px;">
      <h3 style="margin:0 0 10px;font-size:15px;">📌 나만의 음식 등록</h3>
      <p class="mini-note">자주 먹는 음식을 저장하면 다음부터 빠른 추가 버튼으로 사용할 수 있어요. 영양정보는 제품 라벨이나 신뢰할 수 있는 자료를 확인해 입력하세요.</p>
      <div class="fieldgrid">
        <div class="field"><label>음식 이름</label><input id="customFoodName" placeholder="예: 그릭요거트 100g"></div>
        <div class="field"><label>기준 수량</label><input id="customFoodUnit" placeholder="예: 1개, 100g (선택)"></div>
        <div class="field"><label>칼로리 (kcal)</label><input id="customFoodCal" type="number" min="0" placeholder="예: 95"></div>
        <div class="field"><label>단백질 (g)</label><input id="customFoodProtein" type="number" min="0" placeholder="예: 10"></div>
      </div>
      <button class="primary" id="saveCustomFood" style="margin-top:10px;">내 음식으로 등록</button>
      <div class="mini-note" style="margin-top:8px;">등록한 음식은 아래 빠른 추가 영역에 표시되며, 브라우저/클라우드 저장 데이터에 함께 저장됩니다.</div>
    </div>
    <div style="background:var(--surface2); border:1px solid var(--border); padding:14px; border-radius:10px; margin-bottom:20px;">
      <h3 style="margin:0 0 10px 0; font-size:15px;">➕ 직접 입력하기</h3>
      <div class="fieldgrid">
        <div class="field"><label>식사 구분</label><select id="addMealType"><option value="breakfast">아침</option><option value="lunch" selected>점심</option><option value="dinner">저녁</option><option value="snacks">간식/음료</option></select></div>
        <div class="field"><label>음식명</label><input id="addMealName" list="customFoodSuggestions" placeholder="음식 이름 입력 또는 내 음식 선택" autocomplete="off"><datalist id="customFoodSuggestions">${(db.profile.customFoods||[]).map(f=>`<option value="${esc(f.name)}">`).join('')}</datalist></div>
        <div class="field"><label>수량</label><input id="addMealQty" type="number" value="1" min="0.5" step="0.5"></div>
        <div class="field"><label>칼로리(kcal)</label><input id="addMealCal" type="number" placeholder="예: 120"></div>
        <div class="field"><label>단백질(g)</label><input id="addMealProtein" type="number" placeholder="예: 23"></div>
      </div>
      <button class="primary" id="btnAddMealItem" style="margin-top:12px; width:100%;">음식 목록에 추가</button>
    </div>
    <div class="section">
      <h2>🍽️ 오늘의 식단 & 특이사항 메모</h2>
      ${mealTypes.map(m=>`
        <div class="meal-card">
          <div style="display:flex; justify-content:space-between; align-items:center; font-weight:bold; font-size:16px;">
            <span>${m.name}</span>
            <span style="font-size:13px; color:var(--accent);">합계: ${calcMealTypeTotals(selectedDate,m.key).cal} kcal${calcMealTypeTotals(selectedDate,m.key).deltaCal?` <small style="display:block;color:var(--muted);font-weight:500">기본 ${calcMealTypeTotals(selectedDate,m.key).rawCal} → 메모 반영 ${calcMealTypeTotals(selectedDate,m.key).cal} kcal</small>`:''}</span>
          </div>
          ${(r.meals[m.key].items||[]).map((it, idx)=>`
            <div class="meal-item">
              <div><b>${esc(it.name)}</b> <small>(${it.cal}kcal)</small></div>
              <div style="display:flex; align-items:center; gap:8px;">
                <button class="qty-btn" data-qty-change="${m.key}:${idx}:-1">-</button>
                <span><b>${it.qty||1}</b>개</span>
                <button class="qty-btn" data-qty-change="${m.key}:${idx}:1">+</button>
                <button class="danger" style="padding:2px 6px; font-size:12px;" data-del-item="${m.key}:${idx}">삭제</button>
              </div>
            </div>
          `).join('')}
          <div class="note-box">
            <label style="font-size:12px; font-weight:bold; color:var(--accent);">📝 메모</label>
            <textarea id="note_${m.key}" class="meal-note-input" data-meal-key="${m.key}" placeholder="특이사항 입력" style="min-height:40px; margin-top:4px;">${esc(r.meals[m.key].note||'')}</textarea>
          </div>
        </div>
      `).join('')}
    </div>
    <section class="eval-box"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3 style="margin:0 0 8px">🤖 식단 의미 분석 · 코칭</h3><span class="pill" id="mealAISourceBadge">${getMealAnalysis(selectedDate).source==='ai'?'AI 분석':'기본 의미 분석'}</span></div><div id="mealEvaluation">${mealEvaluation(selectedDate)}</div><div id="mealAIStatus" class="mini-note" style="margin:12px 0">메모 저장 후 AI 분석을 요청합니다. AI 연결 전에도 섭취량 변화·추가 재료를 해석하는 기본 분석이 작동합니다.</div><p class="mini-note">AI 분석을 실행하면 해당 날짜의 음식명, 영양값, 수량, 메모가 Vercel 서버를 거쳐 AI API로 전송됩니다. API 키는 브라우저에 저장하지 않습니다. 칼로리 조정은 추정치이며 제품 라벨·실제 섭취량이 우선입니다.</p><button type="button" id="btnMealEvaluate">🤖 AI 코칭 다시 받기</button></section>
    <div class="actions" style="margin-top:25px;">
      <button class="primary" id="btnSaveDaily">💾 식단 전체 저장</button>
      <button class="danger" data-action="clear-day">이 날짜 기록 삭제</button>
    </div>
  </section>`;
}

function wireDaily(){
  const d=$('#date');if(d)d.onchange=()=>{selectedDate=d.value||todayISO();render()};
  const w=$('#weight');if(w)w.onchange=()=>{let r=rec(selectedDate);r.weight=w.value;save()};
  $$('.meal-note-input').forEach(ta=>{
    const updateLocal=()=>{let r=rec(selectedDate);r.meals[ta.dataset.mealKey].note=ta.value.trim();save();const box=$('#mealEvaluation');if(box)box.innerHTML=mealEvaluation(selectedDate);const badge=$('#mealAISourceBadge');if(badge)badge.textContent='기본 의미 분석';const st=$('#mealAIStatus');if(st)st.textContent='메모를 저장했어요. 저장 후 자동으로 AI 분석을 시도합니다.';};
    ta.oninput=updateLocal;
    ta.onchange=()=>{updateLocal();runAIMealAnalysis(selectedDate,true)};
  });
  $$('[data-add-preset]').forEach(b=>{b.onclick=()=>{let r=rec(selectedDate);r.meals[$('#addMealType')?.value||'lunch'].items.push({name:b.dataset.addPreset,cal:Number(b.dataset.cal),protein:Number(b.dataset.protein),qty:1});save();render()}});
  const saveFood=$('#saveCustomFood');if(saveFood)saveFood.onclick=()=>{let name=$('#customFoodName').value.trim(),cal=$('#customFoodCal').value,protein=$('#customFoodProtein').value,unit=$('#customFoodUnit').value.trim();if(!name||cal===''||protein===''){alert('음식 이름, 칼로리, 단백질을 입력해 주세요.');return}db.profile.customFoods=db.profile.customFoods||[];const existing=db.profile.customFoods.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());const item={name,unit,cal:Number(cal),protein:Number(protein)};if(existing>=0)db.profile.customFoods[existing]=item;else db.profile.customFoods.push(item);save();alert('나만의 음식으로 등록했습니다.');render()};
  const mealNameInput=$('#addMealName');const applySavedFood=()=>{if(!mealNameInput)return;const typed=mealNameInput.value.trim().toLocaleLowerCase();const food=(db.profile.customFoods||[]).find(f=>String(f.name).trim().toLocaleLowerCase()===typed);if(food){$('#addMealCal').value=food.cal??'';$('#addMealProtein').value=food.protein??'';const qty=$('#addMealQty');if(qty&&!qty.value)qty.value=1;mealNameInput.dataset.savedFood='1'}else if(mealNameInput.dataset.savedFood==='1'){mealNameInput.dataset.savedFood='0';$('#addMealCal').value='';$('#addMealProtein').value=''}};
  if(mealNameInput){mealNameInput.addEventListener('input',applySavedFood);mealNameInput.addEventListener('change',applySavedFood);mealNameInput.addEventListener('blur',applySavedFood)}
  $('#btnAddMealItem').onclick=()=>{let type=$('#addMealType').value,name=$('#addMealName').value.trim();if(!name)return;applySavedFood();let r=rec(selectedDate);r.meals[type].items.push({name,cal:Number($('#addMealCal').value)||0,protein:Number($('#addMealProtein').value)||0,qty:Number($('#addMealQty').value)||1});delete r.aiMealAnalysis;save();render()};
  $$('[data-qty-change]').forEach(b=>{let [t,i,diff]=b.dataset.qtyChange.split(':');b.onclick=()=>{let item=rec(selectedDate).meals[t].items[Number(i)];if(item){item.qty=Math.max(0.5,(Number(item.qty)||1)+Number(diff));delete rec(selectedDate).aiMealAnalysis;save();render()}}});
  $$('[data-del-item]').forEach(b=>{let [t,i]=b.dataset.delItem.split(':');b.onclick=()=>{rec(selectedDate).meals[t].items.splice(Number(i),1);delete rec(selectedDate).aiMealAnalysis;save();render()}});
  $('#btnSaveDaily').onclick=()=>{save();alert('저장되었습니다.');};
  const ev=$('#btnMealEvaluate');if(ev)ev.onclick=()=>runAIMealAnalysis(selectedDate,false);
  const cached=getMealAnalysis(selectedDate),badge=$('#mealAISourceBadge'),status=$('#mealAIStatus');if(badge)badge.textContent=cached.source==='ai'?'AI 분석':'기본 의미 분석';if(status&&cached.source==='ai')status.textContent='이 메모와 현재 음식 기록을 바탕으로 한 AI 분석 결과가 저장되어 있습니다.';
}
function weekdayBoxes(ds){const names=['일','월','화','수','목','금','토'];return `<div class="day-box-grid">${ds.map(d=>{const r=rec(d),t=calcMealTotals(d),wd=workoutDataForDate(d),date=new Date(d+'T12:00:00'),active=wd.hasWorkout,weight=r.weight?`${esc(r.weight)}kg`:'';return `<article class="day-box ${active?'active':''} ${d===todayISO()?'today':''}"><span class="day-name">${names[date.getDay()]}요일</span><span class="day-date">${Number(d.slice(8,10))}일</span><div class="day-status">${active?'🏋️ 운동 기록 있음':'운동 기록 없음'}<br>${t.cal?`🍽️ ${t.cal} kcal`:'식단 —'}<br>${weight?`⚖️ ${weight}`:'체중 —'}</div><button data-open-day="${d}">기록 보기</button></article>`}).join('')}</div>`}

function inbodySparkline(rows,key,label,unit,color,period='date'){const points=rows.map(r=>({date:r.date,value:inbodyNum(r,key)})).filter(x=>x.value!==null);if(!points.length)return `<div class="inbody-chart-card"><div class="inbody-chart-title"><b>${label}</b><span>기록 없음</span></div><div class="inbody-chart-empty">측정값을 등록하면 월별 추이를 표시합니다.</div></div>`;const vals=points.map(x=>x.value),min=Math.min(...vals),max=Math.max(...vals),range=max-min||Math.max(Math.abs(max)*.04,1),w=320,h=72,px=12,py=10;const coords=points.map((pt,i)=>{const x=points.length===1?w/2:px+i*(w-2*px)/(points.length-1);const y=py+(max-pt.value)/(range)*(h-2*py);return {x:+x.toFixed(1),y:+y.toFixed(1),...pt}});const line=coords.map(p=>`${p.x},${p.y}`).join(' ');const last=points[points.length-1];const labels=points.map(x=>`<span>${esc(period==='month'?String(x.date).slice(0,7).replace('-','.'):String(x.date).slice(5).replace('-','.'))}</span>`).join('');return `<div class="inbody-chart-card"><div class="inbody-chart-title"><b>${label}</b><span>${last.value.toFixed(1)} ${unit}</span></div><svg class="inbody-sparkline" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label} 월별 측정 변화 그래프"><polyline points="${line}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${coords.map((pt,i)=>`<circle cx="${pt.x}" cy="${pt.y}" r="${i===coords.length-1?4.5:2.7}" fill="${color}"/>`).join('')}</svg><div class="inbody-chart-dates" style="grid-template-columns:repeat(${points.length},minmax(0,1fr))">${labels}</div></div>`}
function inbodyTrendCharts(rows){const subset=monthlyInbodyRows(rows).slice(-6);return `<div class="inbody-chart-grid">${inbodySparkline(subset,'weight','체중','kg','#7868e8','month')}${inbodySparkline(subset,'muscle','골격근량','kg','#1b9b78','month')}${inbodySparkline(subset,'fatRate','체지방률','%','#ea8d48','month')}</div>`}
function inbodyFeedback(rows){if(!rows.length)return '<div class="eval-box">인바디 기록을 입력하면 월별 변화와 목표까지의 가이드를 보여 드립니다.</div>';const ctx=inbodyMonthContext(rows),latest=ctx.latest,base=ctx.base,p=db.profile||{},comments=[];const currFat=inbodyNum(latest,'fatRate'),baseFat=base?inbodyNum(base,'fatRate'):null,currMuscle=inbodyNum(latest,'muscle'),baseMuscle=base?inbodyNum(base,'muscle'):null,currWeight=inbodyNum(latest,'weight'),baseWeight=base?inbodyNum(base,'weight'):null;const comparisonLabel=ctx.mode==='previous-month'?'전월 대비':'이번 달 첫 측정 대비';
 if(base){if(currFat!==null&&baseFat!==null){const d=+(currFat-baseFat).toFixed(1);if(d<=-0.5)comments.push(`체지방률이 ${comparisonLabel} ${Math.abs(d).toFixed(1)}%p 낮아졌어요. 측정 조건이 비슷했다면 긍정적인 변화일 수 있으니 다음 달에도 같은 조건으로 확인하세요.`);else if(d>=0.5)comments.push(`체지방률이 ${comparisonLabel} ${d.toFixed(1)}%p 높아요. 한 번의 변화만으로 식사나 운동을 크게 바꾸기보다 수분·식사·측정 시간 조건을 맞춰 다음 측정에서도 지속되는지 확인하세요.`);else comments.push(`체지방률은 ${comparisonLabel} 큰 차이가 없어요. 현재 루틴을 이어가며 월별 흐름으로 판단하세요.`);}
 if(currMuscle!==null&&baseMuscle!==null){const d=+(currMuscle-baseMuscle).toFixed(1);if(d>=0.3)comments.push(`골격근량은 ${comparisonLabel} ${d.toFixed(1)}kg 높게 기록됐어요. 근력운동 수행과 회복이 잘 유지되는지 함께 확인하세요.`);else if(d<=-0.5)comments.push(`골격근량이 ${comparisonLabel} ${Math.abs(d).toFixed(1)}kg 낮게 나왔어요. 체수분 영향일 수 있으니 같은 조건에서 재측정하고, 지속된다면 근력운동·단백질 섭취·수면과 회복을 점검하세요.`);else comments.push(`골격근량은 ${comparisonLabel} 큰 차이가 없습니다. 운동 중량·반복 수와 회복 상태도 함께 기록하면 해석에 도움이 됩니다.`);}
 if(currWeight!==null&&baseWeight!==null){const d=+(currWeight-baseWeight).toFixed(1);if(Math.abs(d)>=0.3)comments.push(`체중은 ${comparisonLabel} ${d>0?'+':''}${d.toFixed(1)}kg 변했어요. 체중만 단독으로 보지 말고 체지방률·골격근량과 함께 해석하세요.`);}}
 else comments.push(`${ctx.month}월 기록은 아직 한 건이고 비교할 전월 데이터도 없어요. 이번 달과 다음 달 기록이 쌓이면 월간 변화 평가가 더 정확해집니다.`);
 const tf=Number(p.targetFatRate),tm=Number(p.targetMuscleKg);if(Number.isFinite(tf)&&tf>0&&currFat!==null){const gap=+(currFat-tf).toFixed(1);if(gap>0.2)comments.push(`설정한 체지방률 목표 ${tf.toFixed(1)}%까지 ${gap.toFixed(1)}%p 차이가 있어요. 주 2회 이상 근력운동을 유지하고, 무리한 절식 대신 식사 기록과 월간 추세를 기준으로 조금씩 조정하세요.`);else if(gap< -0.2)comments.push(`현재 체지방률은 설정 목표보다 ${Math.abs(gap).toFixed(1)}%p 낮아요. 더 낮추는 것만 목표로 하기보다 에너지·수면·근력 유지도 살펴보세요.`);else comments.push('현재 체지방률이 설정 목표에 가까워요. 현재 습관을 유지하며 월별 추세를 확인하세요.');}

function inbodySummary(){const arr=sortedInbody();if(!arr.length)return `<div class="inbody-empty-hero"><span class="inbody-empty-icon">📊</span><div><b>아직 등록된 인바디 기록이 없어요</b><p>첫 기록을 저장하면 체중·골격근량·체지방률 변화 그래프가 여기에 나타납니다.</p><button class="primary" data-go="inbody">첫 인바디 입력하기 →</button></div></div>`;const ctx=inbodyMonthContext(arr),latest=ctx.latest,base=ctx.base;return `<div class="inbody-dashboard-summary"><div class="inbody-latest-head"><div><span class="mini-note">최근 측정일 · 월별 평가 기준</span><h3>${esc(latest.date)}</h3></div><span class="pill">${esc(ctx.month)} 평가 · ${arr.length}회</span></div><div class="inbody-stat-grid"><div class="inbody-stat"><span>⚖️ 체중</span><b>${inbodyNum(latest,'weight')===null?'—':inbodyNum(latest,'weight').toFixed(1)+' kg'}</b>${inbodyDeltaMonthly(latest,ctx,'weight','kg',null)}</div><div class="inbody-stat"><span>💪 골격근량</span><b>${inbodyNum(latest,'muscle')===null?'—':inbodyNum(latest,'muscle').toFixed(1)+' kg'}</b>${inbodyDeltaMonthly(latest,ctx,'muscle','kg',false)}</div><div class="inbody-stat"><span>🔥 체지방률</span><b>${inbodyNum(latest,'fatRate')===null?'—':inbodyNum(latest,'fatRate').toFixed(1)+'%'}</b>${inbodyDeltaMonthly(latest,ctx,'fatRate','%p',true)}</div></div>${inbodyTrendCharts(arr)}${inbodyFeedback(arr)}</div>`}
function recentActivitySummary(){const dates=new Set(),rows={};const ensure=d=>{if(!d)return;dates.add(d);rows[d]=rows[d]||{date:d,items:[],kind:[]}};const recordDays=Object.keys(db.records||{});recordDays.forEach(d=>{const r=db.records[d]||{},t=calcMealTotals(d);if(t.cal>0||t.protein>0||String(r.weight||'').trim()||String(r.workout||'').trim()||Number(r.duration)>0||(r.files||[]).length||String(r.notes||'').trim()){ensure(d);if(t.cal>0)rows[d].items.push(`식단 ${Math.round(t.cal)} kcal`);if(String(r.weight||'').trim())rows[d].items.push(`체중 ${r.weight} kg`);if(String(r.workout||'').trim())rows[d].items.push('운동 메모');if(Number(r.duration)>0)rows[d].items.push(`운동 ${r.duration}분`);if((r.files||[]).length)rows[d].items.push(`첨부 ${r.files.length}개`);rows[d].kind.push('daily')}});Object.entries(db.exerciseLogs||{}).forEach(([d,v])=>{if(Array.isArray(v)&&v.length){ensure(d);rows[d].items.push(`웨이트 ${v.length}개`);rows[d].kind.push('exercise')}});Object.entries(db.cardioLogs||{}).forEach(([d,v])=>{if(Array.isArray(v)&&v.length){ensure(d);rows[d].items.push(`유산소 ${v.length}개`);rows[d].kind.push('cardio')}});(db.inbodyRecords||[]).forEach(r=>{if(r?.date){ensure(r.date);rows[r.date].items.push(`인바디 · 체중 ${inbodyNum(r,'weight')===null?'—':inbodyNum(r,'weight').toFixed(1)+' kg'} · 체지방 ${inbodyNum(r,'fatRate')===null?'—':inbodyNum(r,'fatRate').toFixed(1)+'%'}`);rows[r.date].kind.push('inbody')}});const latest=[...dates].sort((a,b)=>b.localeCompare(a)).slice(0,3);if(!latest.length)return '<div class="empty recent-empty"><div>🗂️</div><b>최근 기록이 아직 없어요</b><p>식단, 운동 또는 인바디를 입력하면 날짜별로 간단히 모아 보여 드립니다.</p></div>';const iconFor=r=>r.kind.includes('inbody')?'📈':r.kind.includes('exercise')?'🏋️':r.kind.includes('cardio')?'🏃':'📝';return `<div class="recent-activity-list">${latest.map(d=>{const r=rows[d],onlyInbody=r.kind.length&&r.kind.every(k=>k==='inbody');return `<article class="recent-activity-row"><div class="recent-activity-icon">${iconFor(r)}</div><div class="recent-activity-main"><div class="recent-activity-date">${esc(d)}</div><div class="recent-activity-items">${r.items.slice(0,3).map(x=>`<span>${esc(x)}</span>`).join('')}</div></div><button data-open-day="${esc(d)}">열기</button></article>`}).join('')}</div>`}
function inbodyHistoryHtml(arr){if(!arr.length)return '<p class="muted">저장된 기록이 없습니다.</p>';return `<div class="inbody-history-list">${arr.slice().reverse().map(r=>`<article class="inbody-history-row"><div class="inbody-history-date"><span>📅</span><b>${esc(r.date)}</b></div><div class="inbody-history-metrics"><span>체중 <b>${inbodyNum(r,'weight')===null?'—':inbodyNum(r,'weight').toFixed(1)+'kg'}</b></span><span>골격근량 <b>${inbodyNum(r,'muscle')===null?'—':inbodyNum(r,'muscle').toFixed(1)+'kg'}</b></span><span>체지방률 <b>${inbodyNum(r,'fatRate')===null?'—':inbodyNum(r,'fatRate').toFixed(1)+'%'}</b></span></div>${r.notes?`<div class="mini-note inbody-history-note">${esc(r.notes)}</div>`:''}<div class="inbody-history-actions"><button data-ib-edit="${esc(r.id)}">수정</button><button class="danger" data-ib-delete="${esc(r.id)}">삭제</button></div></article>`).join('')}</div>`}
function inbodyPage(){db.inbodyRecords=db.inbodyRecords||[];const arr=sortedInbody();return `${head('인바디 분석·추이','입력값을 검증하고, 최근 측정 변화와 목표까지의 방향을 함께 확인합니다.')}<section class="panel"><div class="panelhead"><h2>🧾 인바디 결과 입력</h2><span class="pill">값 확인 후 저장</span></div><div class="notice">인바디 결과지에 표시된 값을 그대로 입력하세요. 이미지 자동 인식(OCR)은 참고 후보만 채우며 숫자·단위·항목을 직접 확인해야 합니다. BMI와 체지방량은 다른 입력값과 비교해 확인합니다.</div><div class="fieldgrid inbody-entry-grid"><div class="field inbody-upload-field"><label for="inbodyImage">결과지 사진/스크린샷 (선택)</label><input id="inbodyImage" type="file" accept="image/*"><div id="ocrStatus" class="mini-note">이미지를 올리면 텍스트를 인식하고 후보 값을 입력합니다. 잘못 읽을 수 있으니 반드시 확인하세요.</div><img id="inbodyPreview" class="preview-img" style="display:none" alt="업로드한 인바디 결과 미리보기"><details class="ocr-details"><summary>OCR 읽기 결과 보기</summary><pre id="ocrRawText">아직 인식한 텍스트가 없습니다.</pre></details></div><div class="field inbody-fields"><label for="ibDate">측정일</label><input id="ibDate" type="date" value="${todayISO()}" max="${todayISO()}" required><div class="field"><label for="ibWeight">체중 (Weight, kg)</label><input id="ibWeight" type="number" min="20" max="350" step="0.1" placeholder="예: 72.4"><span class="mini-note">결과지의 ‘체중’ 값</span></div><div class="field"><label for="ibMuscle">골격근량 (SMM, kg)</label><input id="ibMuscle" type="number" min="1" max="100" step="0.1" placeholder="예: 31.2"><span class="mini-note">‘골격근량’ 또는 SMM 값이며, 제지방량과 다릅니다.</span></div><div class="field"><label for="ibFatMass">체지방량 (Body Fat Mass, kg)</label><input id="ibFatMass" type="number" min="0" max="150" step="0.1" placeholder="예: 18.1"></div><div class="field"><label for="ibFatRate">체지방률 (PBF, %)</label><input id="ibFatRate" type="number" min="1" max="70" step="0.1" placeholder="예: 24.9"><span class="mini-note">% 기호는 입력하지 말고 숫자만 입력</span></div><div class="field"><label for="ibHeight">키 (cm, BMI 검증용 · 선택)</label><input id="ibHeight" type="number" min="100" max="250" step="0.1" placeholder="예: 173.5"><span class="mini-note">BMI 대조를 원할 때만 입력하세요. 자동으로 추정하지 않습니다.</span></div><div class="field"><label for="ibBMI">BMI (kg/m²)</label><input id="ibBMI" type="number" min="10" max="70" step="0.1" placeholder="예: 23.1"></div><div class="field"><label for="ibNotes">측정 메모 (선택)</label><textarea id="ibNotes" placeholder="예: 아침 공복, 운동 전 측정"></textarea></div><div class="actions"><button class="primary" id="ibSave">${editingInbodyId?'수정 저장':'인바디 기록 저장'}</button><button id="ibCancelEdit" style="display:${editingInbodyId?'inline-flex':'none'}">수정 취소</button></div></div></div></section><section class="panel section"><div class="panelhead"><h2>📈 월별 변화 그래프</h2><span class="mini-note">최근 6개월 · 월 마지막 측정값</span></div>${inbodyTrendCharts(arr)}${inbodyFeedback(arr)}</section><section class="panel section"><div class="panelhead"><h2>측정 기록</h2><span class="pill">총 ${arr.length}건</span></div>${inbodyHistoryHtml(arr)}</section>`}
function parseInbodyOCRCandidates(raw){const lines=String(raw||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const specs=[{id:'ibWeight',name:'체중',re:/(?:\bweight\b|체중|몸무게)/i,min:20,max:350},{id:'ibMuscle',name:'골격근량',re:/(?:\bSMM\b|skeletal\s*muscle(?:\s*mass)?|골격근량|골격근)/i,min:1,max:100},{id:'ibFatMass',name:'체지방량',re:/(?:body\s*fat\s*mass|fat\s*mass|체지방량)/i,min:0,max:150},{id:'ibFatRate',name:'체지방률',re:/(?:percent\s*body\s*fat|body\s*fat\s*(?:percentage|percent)|\bPBF\b|체지방률|체지방\s*율)/i,min:1,max:70},{id:'ibBMI',name:'BMI',re:/\bBMI\b/i,min:10,max:70}];const anyLabel=/(?:\bweight\b|체중|몸무게|\bSMM\b|skeletal\s*muscle|골격근|body\s*fat\s*mass|fat\s*mass|체지방량|percent\s*body\s*fat|body\s*fat\s*(?:percentage|percent)|\bPBF\b|체지방률|체지방\s*율|\bBMI\b)/i;const out=[];for(const spec of specs){let found=null;for(let i=0;i<lines.length&&!found;i++){const line=lines[i];const match=line.match(spec.re);if(!match)continue;let candidates=[];const remainder=line.slice((match.index||0)+match[0].length);candidates.push(remainder);for(let j=i+1;j<Math.min(lines.length,i+3);j++){if(anyLabel.test(lines[j]))break;candidates.push(lines[j])}for(const part of candidates){const m=String(part).match(/(?:^|[^A-Za-z])([0-9]{1,3}(?:[.,][0-9]{1,2})?)(?![A-Za-z])/);if(!m)continue;const v=Number(m[1].replace(',','.'));if(Number.isFinite(v)&&v>=spec.min&&v<=spec.max){found=v;break}}}if(found!==null){const el=$('#'+spec.id);if(el&&!el.value)el.value=found.toFixed(1);out.push(`${spec.name} ${found.toFixed(1)}`)}}return out}
function validateInbodyInput(){const date=$('#ibDate').value;if(!date){alert('측정일을 입력해 주세요.');return null}if(date>todayISO()){alert('측정일은 오늘 이후 날짜로 입력할 수 없습니다.');return null}const heightRaw=$('#ibHeight')?.value||'';let heightCm=null;if(heightRaw!==''){heightCm=Number(heightRaw);if(!Number.isFinite(heightCm)||heightCm<100||heightCm>250){alert('BMI 검증용 키는 100~250cm 범위로 입력해 주세요.');$('#ibHeight').focus();return null}}const specs=[['ibWeight','체중',20,350],['ibMuscle','골격근량',1,100],['ibFatMass','체지방량',0,150],['ibFatRate','체지방률',1,70],['ibBMI','BMI',10,70]],v={date,notes:$('#ibNotes').value.trim(),heightCm};for(const [id,label,min,max] of specs){const raw=$('#'+id).value;if(raw===''){v[id]=null;continue}const num=Number(raw);if(!Number.isFinite(num)||num<min||num>max){alert(`${label}은 ${min}~${max} 범위의 숫자로 입력해 주세요. 결과지에 해당 값이 없다면 비워 둘 수 있습니다.`);$('#'+id).focus();return null}v[id]=num}if(specs.every(([id])=>v[id]===null)){alert('인바디 수치를 하나 이상 입력해 주세요.');return null}const warnings=[];if(v.ibFatMass!==null&&v.ibWeight!==null&&v.ibFatMass>v.ibWeight)warnings.push('체지방량이 체중보다 큽니다. 항목이나 단위를 잘못 입력했는지 확인해 주세요.');if(v.ibMuscle!==null&&v.ibWeight!==null&&v.ibMuscle>v.ibWeight)warnings.push('골격근량이 체중보다 큽니다. 입력값을 다시 확인해 주세요.');if(v.ibFatMass!==null&&v.ibFatRate!==null&&v.ibWeight!==null){const expected=v.ibWeight*v.ibFatRate/100;const diff=Math.abs(expected-v.ibFatMass);if(diff>Math.max(2,v.ibWeight*.04))warnings.push(`체지방량 ${v.ibFatMass.toFixed(1)}kg과 체중·체지방률로 계산한 참고값 ${expected.toFixed(1)}kg의 차이가 큽니다.`)}if(v.ibBMI!==null&&v.ibWeight!==null&&v.heightCm!==null){const h=v.heightCm/100,calc=v.ibWeight/(h*h);if(Math.abs(calc-v.ibBMI)>1.5)warnings.push(`입력 BMI ${v.ibBMI.toFixed(1)}과 입력한 키·체중으로 계산한 BMI 약 ${calc.toFixed(1)}의 차이가 큽니다.`)}if(warnings.length&&!confirm('입력값을 한 번 더 확인해 주세요.\n\n'+warnings.join('\n')+'\n\n이 값으로 저장할까요?'))return null;return {date,weight:v.ibWeight===null?'':v.ibWeight,muscle:v.ibMuscle===null?'':v.ibMuscle,fatMass:v.ibFatMass===null?'':v.ibFatMass,fatRate:v.ibFatRate===null?'':v.ibFatRate,bmi:v.ibBMI===null?'':v.ibBMI,heightCm:v.heightCm===null?'':v.heightCm,notes:v.notes}}
function wireInbody(){const file=$('#inbodyImage');if(file)file.onchange=async()=>{const f=file.files?.[0];if(!f)return;const img=$('#inbodyPreview');img.src=URL.createObjectURL(f);img.style.display='block';const st=$('#ocrStatus'),rawBox=$('#ocrRawText');if(!window.Tesseract){st.textContent='OCR 라이브러리를 불러오지 못했습니다. 결과지 값을 직접 입력해 주세요.';return}st.textContent='결과지를 읽는 중입니다…';try{const out=await Tesseract.recognize(f,'eng+kor');const text=out.data.text||'';if(rawBox)rawBox.textContent=text||'인식된 텍스트가 없습니다.';const candidates=parseInbodyOCRCandidates(text);st.textContent=candidates.length?`자동 인식 후보: ${candidates.join(' · ')}. 입력칸을 결과지와 비교해 수정한 뒤 저장하세요.`:'항목 이름과 숫자를 정확히 찾지 못했어요. 자동 입력하지 않았으니 결과지 값을 직접 입력해 주세요.'}catch(e){st.textContent='인식 실패: OCR이 숫자나 항목을 잘못 읽을 수 있습니다. 결과지 값을 직접 입력해 주세요.'}};
 const saveBtn=$('#ibSave');saveBtn.onclick=()=>{const v=validateInbodyInput();if(!v)return;const id=editingInbodyId||(crypto.randomUUID?crypto.randomUUID():String(Date.now()));const r={id,...v};db.inbodyRecords=db.inbodyRecords||[];const index=db.inbodyRecords.findIndex(x=>x.id===id);if(index>=0)db.inbodyRecords[index]=r;else db.inbodyRecords.push(r);db.inbodyRecords.sort((a,b)=>String(a.date).localeCompare(String(b.date)));editingInbodyId=null;save();render()};$('#ibCancelEdit')?.addEventListener('click',()=>{editingInbodyId=null;render()});$$('[data-ib-delete]').forEach(b=>b.onclick=()=>{if(confirm('이 인바디 기록을 삭제할까요?')){db.inbodyRecords=(db.inbodyRecords||[]).filter(r=>r.id!==b.dataset.ibDelete);if(String(editingInbodyId)===String(b.dataset.ibDelete))editingInbodyId=null;save();render()}});$$('[data-ib-edit]').forEach(b=>b.onclick=()=>{const r=(db.inbodyRecords||[]).find(x=>String(x.id)===String(b.dataset.ibEdit));if(!r)return;editingInbodyId=r.id;$('#ibDate').value=r.date||todayISO();$('#ibWeight').value=r.weight??'';$('#ibMuscle').value=r.muscle??'';$('#ibFatMass').value=r.fatMass??'';$('#ibFatRate').value=r.fatRate??'';$('#ibBMI').value=r.bmi??'';$('#ibHeight').value=r.heightCm??'';$('#ibNotes').value=r.notes??'';$('#ibSave').textContent='수정 저장';$('#ibCancelEdit').style.display='inline-flex';window.scrollTo({top:0,behavior:'smooth'})})}

function recordTable(rs){if(!rs.length)return '<div class="empty">기록 없음</div>';return `<div class="tablewrap"><table><thead><tr><th>날짜</th><th>칼로리</th><th>운동</th><th>체중</th><th>작업</th></tr></thead><tbody>${rs.map(r=>{let t=calcMealTotals(r.date);return `<tr><td>${fmtDate(r.date)}</td><td>${t.cal} kcal</td><td>${esc(workoutSummaryForDate(r.date))}</td><td>${r.weight?esc(r.weight)+'kg':'—'}</td><td><button data-open-day="${r.date}">열기</button></td></tr>`}).join('')}</tbody></table></div>`}
function reports(){const allDates=[...new Set([...Object.keys(db.records||{}),...Object.keys(db.exerciseLogs||{}),...Object.keys(db.cardioLogs||{})])].sort().reverse();return `${head('실적 조회','저장된 전체 기록')}<section class="panel">${recordTable(recordsFor(allDates))}</section>`}
// Korean InBody Report measurements, shown as age/sex reference averages rather than individual targets.
const BODY_REFERENCE={
  male:[{fat:21.5,smi:8.3},{fat:24.0,smi:8.4},{fat:24.3,smi:8.4},{fat:24.2,smi:8.2},{fat:25.0,smi:7.9},{fat:25.9,smi:7.6}],
  female:[{fat:31.4,smi:6.2},{fat:31.7,smi:6.4},{fat:31.7,smi:6.5},{fat:32.8,smi:6.5},{fat:33.8,smi:6.4},{fat:35.3,smi:6.2}]
};
function bodyGuideHtml(age,sex,height,targetFat,targetMuscle){
  const ageN=Number(age),h=Number(height),tf=Number(targetFat),tm=Number(targetMuscle);
  if(!ageN||ageN<18||!sex||!h||h<100||h>250)return '<div class="notice">나이(만 18세 이상), 성별, 키를 입력하면 해당 연령대의 체지방률·골격근지수 참고 평균과 목표 가이드를 보여 줍니다.</div>';
  const decade=Math.min(7,Math.max(2,Math.floor(ageN/10))),index=decade-2,ref=BODY_REFERENCE[sex]?.[index];
  if(!ref)return '<div class="notice">평균값 비교를 위해 성별을 남성 또는 여성으로 선택해 주세요.</div>';
  const ageBand=decade===7?(ageN>=80?'70대 참고값':'70대'):`${decade}0대`,limbKg=ref.smi*Math.pow(h/100,2);
  const ib=(db.inbodyRecords||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]||{};
  const currentFat=ib.fatRate!==''&&ib.fatRate!=null&&Number.isFinite(Number(ib.fatRate))?Number(ib.fatRate):null;
  const currentMuscle=ib.muscle!==''&&ib.muscle!=null&&Number.isFinite(Number(ib.muscle))?Number(ib.muscle):null;
  let feedback=[];
  if(currentFat===null)feedback.push('현재 체지방률이 등록되어 있지 않아요. 인바디 분석 화면에서 최근 측정치를 입력하면 목표와 비교할 수 있습니다.');
  else if(Number.isFinite(tf)&&tf>0){const diff=currentFat-tf;if(diff>0.2)feedback.push(`현재 체지방률 ${currentFat.toFixed(1)}%에서 목표 ${tf.toFixed(1)}%까지 약 ${diff.toFixed(1)}%p 차이가 있습니다. 월간 변화와 식사 기록을 보며 무리하지 않게 조정하세요.`);else if(diff< -0.2)feedback.push(`현재 체지방률 ${currentFat.toFixed(1)}%가 설정한 목표 ${tf.toFixed(1)}%보다 낮습니다. 더 낮추기보다 컨디션과 근력 유지도 함께 확인하세요.`);else feedback.push(`최근 체지방률 ${currentFat.toFixed(1)}%가 설정한 목표 ${tf.toFixed(1)}%에 가깝습니다. 같은 측정 조건으로 추이를 확인하세요.`)}
  else if(currentFat>ref.fat+3)feedback.push(`최근 체지방률 ${currentFat.toFixed(1)}%는 같은 성별·연령대 InBody Report 평균 ${ref.fat.toFixed(1)}%보다 높습니다. 평균은 개인에게 꼭 맞는 목표가 아니므로 허리둘레·컨디션·검진 결과와 함께 판단하세요.`);
  else if(currentFat!==null)feedback.push(`최근 체지방률 ${currentFat.toFixed(1)}%는 참고 평균 ${ref.fat.toFixed(1)}% 부근 또는 그보다 낮습니다. 체지방을 더 줄여야 한다고 단정하지 말고 근력·컨디션도 함께 보세요.`);
  if(Number.isFinite(tm)&&tm>0&&currentMuscle!==null){const diff=tm-currentMuscle;if(diff>0.1)feedback.push(`최근 골격근량 ${currentMuscle.toFixed(1)}kg에서 개인 목표 ${tm.toFixed(1)}kg까지 약 ${diff.toFixed(1)}kg 차이입니다. 주요 근육군 근력운동을 주 2회 이상 하고 중량·반복 수를 점진적으로 올려 보세요.`);else feedback.push(`최근 골격근량 ${currentMuscle.toFixed(1)}kg이 설정 목표 ${tm.toFixed(1)}kg에 도달했거나 넘었습니다. 중량만 높이기보다 자세와 회복도 유지하세요.`)}
  else if(currentMuscle===null)feedback.push('최근 골격근량이 없어요. 인바디 분석에 골격근량을 저장하고, 선택적으로 개인 근육량 목표를 입력해 보세요.');
  const fatInput=Number.isFinite(tf)&&tf>0?`<span class="goal-chip">체지방 목표 ${tf.toFixed(1)}%</span>`:'<span class="goal-chip">체지방 목표 미설정</span>';
  const muscleInput=Number.isFinite(tm)&&tm>0?`<span class="goal-chip">근육량 목표 ${tm.toFixed(1)}kg</span>`:'<span class="goal-chip">근육량 목표 미설정</span>';
  return `<div class="bodyguide-grid"><div class="bodyguide-metric"><span>${ageBand} · 체지방률 참고 평균</span><b>${ref.fat.toFixed(1)}%</b><span>현재 인바디: ${currentFat===null?'미등록':currentFat.toFixed(1)+'%'}</span></div><div class="bodyguide-metric"><span>${ageBand} · 골격근지수(SMI) 참고 평균</span><b>${ref.smi.toFixed(1)} kg/m²</b><span>키 ${h.toFixed(1)}cm일 때 사지 근육량 환산 약 ${limbKg.toFixed(1)}kg</span></div></div><div class="actions">${fatInput}${muscleInput}</div><h3 style="font-size:15px;margin:18px 0 8px">🎯 목표 달성 가이드</h3><ul class="guide-list">${feedback.map(x=>`<li>${esc(x)}</li>`).join('')}<li>기본 루틴 예시: 주요 근육군 근력운동을 주 2일 이상, 중강도 유산소를 주 150~300분 범위에서 현재 체력에 맞춰 점진적으로 진행하세요.</li><li>체지방을 줄이는 목표라면 식사량을 급격히 줄이기보다 기록한 평균 섭취량과 월간 체중 추세를 보고 한 달 단위로 작은 조정을 해 보세요. 근육 증가가 목표라면 충분히 먹고 훈련 사이 회복을 확보하세요.</li><li>체중·체지방률은 같은 시간대, 비슷한 수분·식사 조건에서 측정해 월별 추이를 비교하세요.</li></ul><p class="source-note">참고값: InBody Report 2024 한국 측정자 데이터의 연령·성별 평균(20대~70대). SMI는 키 제곱으로 보정한 사지 골격근지수로, 인바디의 전체 골격근량(kg)과 같은 지표가 아닙니다. ‘평균’은 이상적인 목표나 진단 기준이 아닙니다. <a href="https://www.inbody.co.kr/assets/download/2024InBody%20Report_ENG_web.pdf" target="_blank" rel="noopener">자료 출처</a>. 만 18~19세는 20대 참고값, 80세 이상은 70대 참고값을 적용합니다. 성인 신체활동 참고: <a href="https://www.who.int/initiatives/behealthy/physical-activity/" target="_blank" rel="noopener">WHO 권고</a>.</p>`;

function normalizeWorkoutRoutine(){
  const p=db.profile||(db.profile={});
  const r=p.workoutRoutine||(p.workoutRoutine={weights:[],cardio:[]});
  if(!Array.isArray(r.weights))r.weights=[];
  if(!Array.isArray(r.cardio))r.cardio=[];
  r.weights.forEach(x=>{
    if(!x.category){
      const g=String(x.group||'');
      x.category=(g==='하체'||g==='엉덩이')?'lower':'upper';
    }
    if(x.category!=='upper'&&x.category!=='lower')x.category=(x.group==='하체'||x.group==='엉덩이')?'lower':'upper';
    // 이전 루틴의 요일 값은 더 이상 쓰지 않습니다. 저장된 기구와 중량/세트/횟수는 유지합니다.
    delete x.day;
  });
  r.cardio.forEach(x=>delete x.day);
  return r;
}
function routineGroupsForCategory(category){

}

}

    async eqList(){vNeed();const {data,error}=await supa.from('fit_village_equips').select('id,slot,grade,lvl,subs,item_id,created_at').eq('user_id',user.id).order('created_at');if(error)throw vErr(error);return data||[]},

    async bossEggs(){vNeed();const {data,error}=await supa.from('fit_village_boss_eggs').select('id,floor,created_at').eq('user_id',user.id).order('created_at');if(error)throw vErr(error);return data||[]},

    async bosses(){vNeed();const {data,error}=await supa.from('fit_village_bosses').select('*').order('floor');if(error)throw vErr(error);return data||[]},
    async villageOf(uid){vNeed();const [v,i,tr]=await Promise.all([supa.from('fit_village').select('*').eq('user_id',uid).maybeSingle(),supa.from('fit_village_items').select('id,item_key,x,y,flip,lb').eq('user_id',uid).not('x','is',null),supa.from('fit_village_terrain').select('x,y,h,t').eq('user_id',uid)]);if(v.error)throw vErr(v.error);if(i.error)throw vErr(i.error);return {village:v.data,items:(i.data||[]).map(x=>({...x,f:x.flip})),terrain:tr.error?[]:(tr.data||[]),server_time:new Date().toISOString()}},
    async friends(){vNeed();const [v,p,i,c]=await Promise.all([supa.from('fit_village').select('*'),supa.from('fit_workspace_profiles').select('user_id,display_name'),supa.from('fit_village_items').select('user_id,item_key').not('x','is',null),supa.from('fit_village_catalog').select('item_key,kind,grade,rate')]);
      for(const r of [v,p,i,c])if(r.error)throw vErr(r.error);
      const names={},cat={};(p.data||[]).forEach(r=>names[r.user_id]=r.display_name);(c.data||[]).forEach(r=>cat[r.item_key]=r);
      return (v.data||[]).map(r=>{const mine=(i.data||[]).filter(x=>x.user_id===r.user_id&&cat[x.item_key]?.kind==='animal');let top=null;mine.forEach(x=>{if(!top||Number(cat[x.item_key].rate)>Number(cat[top].rate))top=x.item_key});return {...r,display_name:names[r.user_id]||'이름 없는 마을',animals:mine.length,top_key:r.rep_key||top}}).sort((a,b)=>(Number(b.likes_received)||0)-(Number(a.likes_received)||0))},
    async likedToday(){vNeed();const d=new Date(Date.now()+9*36e5).toISOString().slice(0,10);const {data,error}=await supa.from('fit_village_likes').select('to_user').eq('from_user',user.id).eq('like_date',d);if(error)throw vErr(error);return new Set((data||[]).map(r=>r.to_user))}
  };


  async function getRow(){
    const {data,error} = await supa.from('fit_manager_data').select('data').eq('user_id', user.id).maybeSingle();
    if(error) throw error;
    return data || null;
  }

  async function put(x){
    const {error} = await supa.from('fit_manager_data').upsert({user_id:user.id, data:x, updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(error) throw error;
  }

  async function activate(data){
    ignore = true;
    db = data;
    save();
    render();
    document.getElementById('fitCloudShield').style.display='none';
    const logoutBtn = document.getElementById('fitCloudLogout');
    if(logoutBtn) logoutBtn.classList.add('visible');
    const badge = document.getElementById('syncStatusBadge');
    if(badge){ badge.textContent='클라우드 동기화'; badge.className='pill good'; }
    ignore = false;
    say('로그인 완료');
  }

  async function signedIn(u){
    user = u;
    say('개별 클라우드 데이터 로딩 중...');
    try{
      const row = await getRow();
      if(row && row.data){ await activate(row.data); }
      else { await put(db); await activate(db); }
    } catch(e) {
      document.getElementById('fitCloudShield').style.display='flex';
      say('동기화 오류: ' + (e.message || e));
    }
  }

  async function handleLogin(){
    const email = document.getElementById('fitCloudEmail').value.trim();
    const password = document.getElementById('fitCloudPassword').value;
    if(!email || !password){ say('이메일과 비밀번호를 모두 입력해 주세요.'); return; }
    say('로그인 인증 중...');
    try {
      if(!supa && window.supabase){ supa = window.supabase.createClient(SUPABASE_URL, KEY); }
      const { data, error } = await supa.auth.signInWithPassword({ email, password });
      if(error) throw error;
      await signedIn(data.user);
    } catch(e) {
      say('로그인 실패: ' + (e.message || String(e)));
    }
  }

  async function handleSignup(){
    const email = document.getElementById('fitCloudEmail').value.trim();
    const password = document.getElementById('fitCloudPassword').value;
    if(!email || password.length < 6){ say('올바른 이메일과 6자 이상의 비밀번호를 입력해 주세요.'); return; }
    say('회원가입 요청 중...');
    try {
      if(!supa && window.supabase){ supa = window.supabase.createClient(SUPABASE_URL, KEY); }
      const { data, error } = await supa.auth.signUp({ email, password });
      if(error) throw error;
      if(data.session) await signedIn(data.session.user);
      else say('회원가입이 완료되었습니다. 로그인해 주세요.');
    } catch(e) {
      say('회원가입 실패: ' + (e.message || String(e)));
    }
  }

  window.fitCloudSaveHook = function(currentDB){
    if(user && !ignore){
      if(timer) clearTimeout(timer);
      timer = setTimeout(async ()=>{
        if(busy) return;
        busy = true;
        try { await put(currentDB); } catch(e){}
        finally { busy = false; }
      }, 800);
    }
  };

  document.addEventListener('DOMContentLoaded', ()=>{
    document.getElementById('fitCloudLogin').addEventListener('click', handleLogin);
    document.getElementById('fitCloudSignup').addEventListener('click', handleSignup);

    const logout = document.createElement('button');
    logout.id = 'fitCloudLogout';
    logout.textContent = '로그아웃';
    logout.addEventListener('click', async ()=>{
      if(supa) await supa.auth.signOut();
      user = null;
      document.getElementById('fitCloudShield').style.display='flex';
      say('로그아웃되었습니다.');
    });

    const targetHeader = document.querySelector('header .right');
    if(targetHeader) targetHeader.insertBefore(logout, targetHeader.firstChild);

    try {
      if(window.supabase){
        supa = window.supabase.createClient(SUPABASE_URL, KEY);
        supa.auth.getSession().then(({data})=>{
          if(data && data.session) signedIn(data.session.user);
        }).catch(()=>{ say('계정 정보를 입력 후 로그인하세요.'); });
      } else {
        say('Supabase 라이브러리를 로드하지 못했습니다.');
      }
    } catch(err){
      say('초기화 에러: ' + err.message);
    }
  });
})();
</script>
