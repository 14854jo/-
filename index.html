<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f6fa,#111827);--surface:light-dark(#fff,#1f2937);--surface2:light-dark(#f8fafc,#273449);--text:light-dark(#172033,#f3f4f6);--muted:light-dark(#64748b,#aab6c8);--border:light-dark(#e2e8f0,#3b4658);--accent:light-dark(#2457c5,#8db2ff);--accentbg:light-dark(#eaf0ff,#243b64);--green:light-dark(#16845b,#5ed6a5);--amber:light-dark(#a8650b,#f5bd62);--red:light-dark(#b83c45,#ff8e96)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;font-size:15px}
.app{min-height:100vh;background:var(--bg)}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:3}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px}
.logo{background:#2457c5;color:white;border-radius:10px;padding:9px}
.sub{font-size:12px;color:var(--muted);font-weight:500}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 68px)}
aside{background:var(--surface);border-right:1px solid var(--border);padding:20px 13px}
.navlabel{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em;padding:12px 12px 8px}
.nav{width:100%;border:0;background:transparent;color:var(--text);padding:12px;border-radius:9px;text-align:left;display:flex;gap:11px;align-items:center;cursor:pointer;font-size:14px;margin:2px 0}

.aside-note{margin:26px 7px 0;padding:13px;border:1px solid var(--border);border-radius:10px;font-size:12px;color:var(--muted);line-height:1.6}
main{padding:28px;max-width:1500px;width:100%;margin:0 auto}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:22px}
.pagehead h1{font-size:25px;margin:0 0 6px}

button,.button{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:650;font-size:14px}
.primary{background:#2457c5;color:#fff;border-color:#2457c5}
.danger{color:var(--red)}

.card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:19px;min-width:0}
.metric-label{font-size:13px;color:var(--muted);font-weight:600}
.metric{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:10px 0 6px}
.metric small{font-size:14px;font-weight:600}
.hint{font-size:12px;color:var(--muted)}

.panel h2{font-size:17px;margin:0 0 16px}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.panelhead h2{margin:0}
.barrow{display:grid;grid-template-columns:75px 1fr 52px;gap:12px;align-items:center;margin:17px 0;font-size:13px}
.bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}

.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:13px;font-weight:700;color:var(--muted)}
input,textarea,select{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:11px 12px;border-radius:8px;font:inherit;min-width:0}
textarea{min-height:84px;resize:vertical}
.section{margin-top:16px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}
.pill{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:750;background:var(--accentbg);color:var(--accent)}
.pill.good{background:light-dark(#e5f7ef,#174b3a);color:var(--green)}
.pill.warn{background:light-dark(#fff4dd,#503b1d);color:var(--amber)}
.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:680px}

th{background:var(--surface2);color:var(--muted);font-weight:750}
tbody tr:last-child td{border-bottom:0}
.muted{color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.notice{padding:12px 14px;border-radius:9px;background:var(--accentbg);color:var(--text);font-size:13px;line-height:1.6;margin-bottom:16px}
.right{display:flex;gap:8px;align-items:center}
.mobilemenu{display:none}

.meal-item{display:flex;justify-content:space-between;align-items:center;background:var(--surface);padding:8px 12px;border-radius:8px;border:1px solid var(--border);margin-top:8px}

    if(!accessToken)throw new Error('AI 분석은 로그인 후 사용할 수 있습니다. 다시 로그인한 뒤 시도해 주세요.');
    const response=await fetch('/api/meal-analysis',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${accessToken}`},body:JSON.stringify(mealAIPayload(d))});
    const result=await response.json().catch(()=>({}));
    if(!response.ok){const e=new Error(result.error||`AI 서버 응답 오류 (${response.status})`);e.code=result.code;throw e;}
    const clean=clampMealAdjustment(result,d);clean.signature=mealNoteSignature(d);clean.source='ai';clean.updated_at=new Date().toISOString();rec(d).aiMealAnalysis=clean;save();
    if(page==='daily'&&selectedDate===d){render();const st=$('#mealAIStatus');if(st)st.textContent='AI 분석 완료 · 메모 의미를 바탕으로 추정 열량과 피드백을 반영했습니다.';}
    return true;
  }catch(e){
    if(status){status.textContent=e.code==='AI_NOT_CONFIGURED'||e.code==='AI_ENDPOINT_MISSING'?'AI 연결 설정이 아직 완료되지 않았어요. 현재는 메모 의미를 해석하는 기본 분석으로 평가합니다. Vercel에 API 파일과 OPENAI_API_KEY를 설정하면 AI 분석이 활성화됩니다.':(String(e.message||'').includes('로그인')?'로그인 세션을 확인해 주세요. 현재는 기본 의미 분석을 표시합니다.':'AI 분석 연결에 실패해 기본 의미 분석으로 평가했어요. 서버 설정과 배포 상태를 확인해 주세요.');}
    const box=$('#mealEvaluation');if(box)box.innerHTML=mealEvaluation(d);return false;
  }finally{if(button&&document.body.contains(button)){button.disabled=false;button.textContent='🤖 AI 코칭 다시 받기';}}
}

function weekDates(date){let d=new Date(date+'T12:00:00'),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return Array.from({length:7},(_,i)=>{let x=new Date(d);x.setDate(d.getDate()+i);return x.toISOString().slice(0,10)})}
// 모든 운동 집계 화면에서 같은 기준을 사용합니다: 일일 메모, 웨이트 로그, 유산소 로그 중 하나라도 있으면 운동한 날입니다.
function workoutDataForDate(date){
  const r=(db.records||{})[date]||{};
  const weights=Array.isArray((db.exerciseLogs||{})[date])?(db.exerciseLogs||{})[date]:[];
  const cardio=Array.isArray((db.cardioLogs||{})[date])?(db.cardioLogs||{})[date]:[];
  const dailyWorkout=String(r.workout||'').trim().length>0||n(r.duration)>0;
  const cardioMinutes=cardio.reduce((total,item)=>total+Math.max(0,n(item.minutes)),0);
  return {weights,cardio,dailyWorkout,hasWorkout:dailyWorkout||weights.length>0||cardio.length>0,cardioMinutes};
}
function isWorkoutLogged(date){return workoutDataForDate(date).hasWorkout}
function workoutMinutesForDate(date){const d=workoutDataForDate(date),dailyMinutes=Math.max(0,n(((db.records||{})[date]||{}).duration));
  // 일일 기록에 전체 운동 시간이 있고 세부 유산소도 있으면 중복 합산하지 않도록 큰 값을 사용합니다.
  return Math.max(dailyMinutes,d.cardioMinutes);
}
function workoutSummaryForDate(date){const d=workoutDataForDate(date),r=(db.records||{})[date]||{},parts=[];
  if(d.weights.length)parts.push(`웨이트 ${d.weights.length}개`);
  if(d.cardio.length)parts.push(`유산소 ${d.cardio.length}건`);
  if(String(r.workout||'').trim())parts.push(String(r.workout).trim());
  if(!parts.length&&n(r.duration)>0)parts.push('운동 기록');
  return parts.join(' · ')||'—';
}
function recordsFor(ds){return ds.map(d=>({date:d,...rec(d)})).filter(r=>{let t=calcMealTotals(r.date);return t.cal>0||t.protein>0||r.weight||r.files?.length||String(r.workout||'').trim()||n(r.duration)>0||isWorkoutLogged(r.date);})}
function fmtDate(d){return d?d.replaceAll('-','.'):''}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}
function sum(ds){
  let rs=recordsFor(ds);
  return {rs,cal:ds.reduce((a,d)=>a+calcMealTotals(d).cal,0),protein:ds.reduce((a,d)=>a+calcMealTotals(d).protein,0),days:ds.filter(isWorkoutLogged).length,minutes:ds.reduce((total,d)=>total+workoutMinutesForDate(d),0)}
}
function weeklyExerciseSummaryHTML(ds){
  const active=ds.filter(isWorkoutLogged);
  if(!active.length)return `<div class="empty">이번 주 운동 기록이 없습니다. 웨이트나 유산소 기록을 저장하면 여기에 표시됩니다.<div class="actions"><button data-go="exercise">웨이트 기록하기</button><button data-go="cardio">유산소 기록하기</button></div></div>`;
  return `<div class="weekly-workout-list">${active.map(date=>{const d=workoutDataForDate(date),details=[];if(d.weights.length)details.push(`<span>🏋️ 웨이트 ${d.weights.length}개</span>`);if(d.cardio.length)details.push(`<span>🏃 유산소 ${d.cardio.length}건</span>`);if(String(((db.records||{})[date]||{}).workout||'').trim())details.push(`<span>📝 ${esc(String(db.records[date].workout).trim())}</span>`);const min=workoutMinutesForDate(date);if(min>0)details.push(`<span>⏱️ ${min}분</span>`);return `<div class="weekly-workout-row"><div class="weekly-workout-date">${esc(date.slice(5).replace('-','/'))}</div><div class="weekly-workout-details">${details.join('')}</div></div>`}).join('')}</div>`;
}

function getWorkoutSummary(date){
  const parts=[];const weights=(db.exerciseLogs||{})[date]||[];const cardio=(db.cardioLogs||{})[date]||[];const d=rec(date);
  weights.forEach(x=>parts.push(`🏋 ${x.group||''} · ${x.machine||x.exercise||'웨이트'} ${x.weight?x.weight+'kg':'중량 미기록'} × ${x.sets||'?'}세트 × ${x.reps||'?'}회`));
  cardio.forEach(x=>parts.push(`🏃 ${x.machine||'유산소'} · ${x.minutes||0}분${x.intensity?' · 강도 '+x.intensity:''}${x.distance?' · '+x.distance+'km':''}`));
  if(String(d.workout||'').trim())parts.push('운동 메모: '+String(d.workout).trim());
  if(String(d.cardio||'').trim()&&!cardio.length)parts.push('유산소 메모: '+String(d.cardio).trim());
  return parts.join('\n');
}

  const pmap=new Map((profiles||[]).map(p=>[p.user_id,p]));const ordered=[...entries].sort((a,b)=>(a.entry_date||'').localeCompare(b.entry_date||'')||(a.created_at||'').localeCompare(b.created_at||''));const previous={};
  ordered.forEach(e=>{const old=previous[e.user_id]||{};e._weightDiff=(e.weight_kg!=null&&old.weight!=null)?Number(e.weight_kg)-Number(old.weight):null;e._fatDiff=(e.body_fat_rate!=null&&old.fat!=null)?Number(e.body_fat_rate)-Number(old.fat):null;if(e.weight_kg!=null)old.weight=Number(e.weight_kg);if(e.body_fat_rate!=null)old.fat=Number(e.body_fat_rate);previous[e.user_id]=old});
  return [...ordered].reverse().map(e=>{const p=pmap.get(e.user_id)||{},a=animalInfo(p.animal_type);const weight=e.weight_kg==null?'':`<span class="share-metric">체중 ${Number(e.weight_kg).toFixed(1)}kg${e._weightDiff===null?'':` <small class="${e._weightDiff<0?'trend-good':e._weightDiff>0?'trend-neutral':''}">${e._weightDiff>0?'+':''}${e._weightDiff.toFixed(1)}</small>`}</span>`;const fat=e.body_fat_rate==null?'':`<span class="share-metric">체지방 ${Number(e.body_fat_rate).toFixed(1)}%${e._fatDiff===null?'':` <small class="${e._fatDiff<0?'trend-good':e._fatDiff>0?'trend-neutral':''}">${e._fatDiff>0?'+':''}${e._fatDiff.toFixed(1)}%p</small>`}</span>`;
    return `<article class="feed-card"><div class="feed-avatar">${animalGrowthSvg(p.animal_type,Math.floor((Number(p.intimacy)||0)/50)+1,'mini')}</div><div class="feed-body"><div class="feed-top"><b>${esc(p.display_name||'FIT 러너')} <span class="muted">· ${esc(p.pet_name||a.name)}</span></b><span>${esc(e.entry_date||'')}</span></div><h3>${esc(e.title||'오늘의 운동')}</h3><p class="feed-summary">${esc(e.workout_summary||'운동 기록').replace(/\n/g,'<br>')}</p><div class="feed-meta"><span>⏱ ${Number(e.duration_minutes)||0}분</span>${weight}${fat}<span class="pill good">+${Number(e.points_earned)||20}P</span></div></div></article>`
  }).join('');
}

  const mealNameInput=$('#addMealName');const applySavedFood=()=>{if(!mealNameInput)return;const typed=mealNameInput.value.trim().toLocaleLowerCase();const food=(db.profile.customFoods||[]).find(f=>String(f.name).trim().toLocaleLowerCase()===typed);if(food){$('#addMealCal').value=food.cal??'';$('#addMealProtein').value=food.protein??'';const qty=$('#addMealQty');if(qty&&!qty.value)qty.value=1;mealNameInput.dataset.savedFood='1'}else if(mealNameInput.dataset.savedFood==='1'){mealNameInput.dataset.savedFood='0';$('#addMealCal').value='';$('#addMealProtein').value=''}};

  $$('[data-qty-change]').forEach(b=>{let [t,i,diff]=b.dataset.qtyChange.split(':');b.onclick=()=>{let item=rec(selectedDate).meals[t].items[Number(i)];if(item){item.qty=Math.max(0.5,(Number(item.qty)||1)+Number(diff));delete rec(selectedDate).aiMealAnalysis;save();render()}}});

function weekly(){let ds=weekDates(selectedDate),s=sum(ds),goal=n(db.profile.weeklyWorkouts)||4,calGoal=n(db.profile.calorieTarget)||1720,proteinGoal=n(db.profile.proteinTarget)||138;return `${head('주별 관리','선택한 날짜가 포함된 주의 식단·운동·체중 기록입니다.',`<input type="date" id="periodDate" value="${selectedDate}">`)}<section class="panel"><div class="cards section">${metric('운동 횟수',`${s.days}회`,`목표 ${goal}회`)}${metric('하루 평균 열량',`${Math.round(s.cal/7).toLocaleString()} kcal`,`목표 ${calGoal} kcal`)}${metric('하루 평균 단백질',`${Math.round(s.protein/7)} g`,`목표 ${proteinGoal} g`)}${metric('기록 일수',`${s.rs.length}/7일`,'식단·체중·운동 기록')}</div><div class="progress-row">운동 목표 달성률 <b>${pct(s.days,goal)}%</b><div class="bar"><span style="width:${pct(s.days,goal)}%"></span></div></div><h2>요일별 기록</h2>${recordTable(ds.map(d=>({date:d,...rec(d)})).filter(r=>{let t=calcMealTotals(r.date);return t.cal>0||r.weight||String(r.workout||'').trim()||isWorkoutLogged(r.date)}))}<h2 style="margin-top:20px">주간 체중 추이</h2>${ds.filter(d=>rec(d).weight).map(d=>`<div class="statline"><span>${fmtDate(d)}</span><b>${esc(rec(d).weight)} kg</b></div>`).join('')||'<p class="muted">체중 기록이 없습니다.</p>'}</section>`}
function monthly(){let ym=selectedDate.slice(0,7),ds=Array.from({length:new Date(Number(ym.slice(0,4)),Number(ym.slice(5,7)),0).getDate()},(_,i)=>`${ym}-${String(i+1).padStart(2,'0')}`),s=sum(ds),logged=ds.filter(d=>{let r=rec(d),t=calcMealTotals(d);return t.cal>0||r.weight||String(r.workout||'').trim()||isWorkoutLogged(d)}).length,avgCal=Math.round(s.cal/ds.length),avgProtein=Math.round(s.protein/ds.length);return `${head('월별 관리','월간 실적과 꾸준함을 확인합니다.',`<input type="month" id="monthDate" value="${ym}">`)}<section class="panel"><div class="cards section">${metric('기록률',`${Math.round(logged/ds.length*100)}%`,`${logged}/${ds.length}일`)}${metric('총 섭취 열량',`${s.cal.toLocaleString()} kcal`,'월간 합계')}${metric('하루 평균 열량',`${avgCal.toLocaleString()} kcal`,'목표와 비교')}${metric('하루 평균 단백질',`${avgProtein} g`,'목표와 비교')}${metric('운동 일수',`${s.days}일`,`목표 참고: ${n(db.profile.weeklyWorkouts)||4}회/주`)}</div><h2>월간 코칭 요약</h2><p>${logged===0?'아직 기록이 없습니다. 먼저 식단·체중·운동을 기록해 보세요.':`이번 달 ${logged}일 기록했습니다. ${avgCal>(n(db.profile.calorieTarget)||1720)*1.1?'평균 열량이 목표보다 높습니다. 식사량과 간식 빈도를 점검해 보세요.':avgCal<(n(db.profile.calorieTarget)||1720)*0.75?'평균 열량이 목표보다 낮습니다. 지나친 제한은 피하고 컨디션을 함께 확인하세요.':'평균 열량은 목표 범위와 비교해 확인할 수 있습니다.'} ${avgProtein<(n(db.profile.proteinTarget)||138)*0.8?'단백질 섭취를 조금 더 챙겨보세요.':'단백질 섭취 기록도 꾸준히 이어가세요.'}`}</p>${recordTable(ds.map(d=>({date:d,...rec(d)})).filter(r=>{let t=calcMealTotals(r.date);return t.cal>0||r.weight||String(r.workout||'').trim()}))}</section>`}
function mealEvaluation(d){
  const base=calcMealBaseTotals(d),t=calcMealTotals(d),calGoal=n(db.profile.calorieTarget)||1720,pGoal=n(db.profile.proteinTarget)||138,r=rec(d),analysis=getMealAnalysis(d);
  const notes=MEAL_KEYS.map(k=>({meal:k,text:String(r.meals[k].note||'').trim()})).filter(x=>x.text);
  if(!base.cal&&!base.protein&&!notes.length)return '아직 음식 기록이 없습니다. 음식과 수량, 조리법·남긴 양·추가 재료를 기록하면 실제 먹은 양을 고려한 평가를 받을 수 있습니다.';
  const parts=[];
  if(t.cal>calGoal*1.1)parts.push(`메모 반영 추정 열량 ${t.cal} kcal은 하루 목표 ${calGoal.toLocaleString()} kcal보다 높아요. 다음 식사는 무리하게 굶기보다 채소와 단백질을 포함하고, 추가 소스·기름·간식 중 하나를 줄여 균형을 맞춰 보세요.`);
  else if(t.cal<calGoal*.75&&base.cal>0)parts.push(`현재 기록 열량은 목표 ${calGoal.toLocaleString()} kcal의 75%보다 낮아요. 하루 기록이 완성되지 않았다면 남은 식사를 입력하고, 의도적인 과도한 제한은 피하세요.`);
  else if(base.cal>0)parts.push(`메모 반영 추정 열량은 ${t.cal} kcal이며 하루 목표 ${calGoal.toLocaleString()} kcal의 ${pct(t.cal,calGoal)}%예요. 목표와 비교하되 하루 중간 기록이라면 남은 끼니도 함께 보세요.`);
  parts.push(t.protein<pGoal*.8?`단백질은 약 ${Math.round(t.protein)} g으로 목표 ${pGoal} g의 80% 미만이에요. 다음 끼니에 달걀·두부·생선·살코기·그릭요거트 중 하나를 더해 보세요.`:`단백질은 약 ${Math.round(t.protein)} g으로 목표 ${pGoal} g 대비 ${pct(t.protein,pGoal)}%예요. 하루 총량과 식사별 분배를 함께 확인하세요.`);
  if(notes.length){parts.push(`<b>메모 해석</b>: ${esc(analysis.interpretation||'메모를 분석했지만 열량 변경 근거가 충분하지 않습니다.')}`);(analysis.adjustments||[]).forEach(a=>{const label=MEAL_LABELS[a.meal_key]||a.meal_key;const sign=Number(a.kcal_delta)>0?'+':'';parts.push(`<b>${esc(label)} 조정</b>: ${esc(a.summary||'메모 반영')} — ${sign}${Number(a.kcal_delta)||0} kcal${Number(a.protein_delta)?`, 단백질 ${Number(a.protein_delta)>0?'+':''}${Number(a.protein_delta)} g`:''}. ${esc(a.reason||'')}`)});
    (analysis.feedback||[]).slice(0,4).forEach(f=>parts.push(esc(f)));
    if(analysis.clarifying_question)parts.push(`더 정확히 계산하려면: ${esc(analysis.clarifying_question)}`);
  }
  return `<div class="bodyguide-grid" style="margin-top:8px"><div class="bodyguide-metric"><span>등록 음식 기준</span><b>${base.cal.toLocaleString()} kcal</b><span>수량을 곱한 기본값</span></div><div class="bodyguide-metric"><span>메모 반영 추정</span><b>${t.cal.toLocaleString()} kcal</b><span>${t.deltaCal?`조정 ${t.deltaCal>0?'+':''}${t.deltaCal} kcal`:'칼로리 조정 없음'} · 확신도 ${analysis.confidence==='high'?'높음':analysis.confidence==='medium'?'보통':'낮음'}</span></div></div><ul style="margin:10px 0 0;padding-left:20px">${parts.map(x=>`<li style="margin:8px 0;line-height:1.65">${x}</li>`).join('')}</ul><div class="mini-note" style="margin-top:12px">${analysis.source==='ai'?'AI가 음식명·수량·메모의 의미를 바탕으로 작성한 추정입니다.':'기본 의미 분석이 음식명·메모에서 확인되는 섭취량 변화만 추정했습니다.'} 제품별 실제 영양성분과 먹은 양을 계량한 값이 우선이며, 측정되지 않은 국물·소스 열량과 나트륨은 정확한 수치가 아닙니다.</div>`;
}

function inbodyDelta(cur,prev,key,unit,lowerBetter=false){const a=inbodyNum(cur,key),b=inbodyNum(prev,key);if(a===null||b===null)return '<span class="inbody-delta neutral">이전 수치 없음</span>';const d=+(a-b).toFixed(1);if(Math.abs(d)<0.05)return '<span class="inbody-delta neutral">변화 없음</span>';const arrow=d>0?'▲':'▼',cls=lowerBetter===null?'neutral':((lowerBetter?(d<0):(d>0))?'positive':'neutral');return `<span class="inbody-delta ${cls}">${arrow} ${d>0?'+':''}${d.toFixed(1)} ${unit}</span>`}
function previousInbodyMonth(monthKey){const [year,month]=monthKey.split('-').map(Number);const d=new Date(year,month-2,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function monthlyInbodyRows(rows){const byMonth=new Map();rows.forEach(r=>{if(r?.date)byMonth.set(r.date.slice(0,7),r)});return [...byMonth.values()].sort((a,b)=>a.date.localeCompare(b.date))}
function inbodyMonthContext(rows){if(!rows.length)return null;const latest=rows[rows.length-1],month=latest.date.slice(0,7),prevMonth=previousInbodyMonth(month),thisMonthRows=rows.filter(r=>String(r.date).startsWith(month)),prevMonthRows=rows.filter(r=>String(r.date).startsWith(prevMonth));if(prevMonthRows.length)return {latest,month,prevMonth,base:prevMonthRows[prevMonthRows.length-1],mode:'previous-month'};if(thisMonthRows.length>1)return {latest,month,prevMonth,base:thisMonthRows[0],mode:'within-month'};return {latest,month,prevMonth,base:null,mode:'insufficient'}}
function inbodyDeltaMonthly(cur,context,key,unit,lowerBetter=false){const a=inbodyNum(cur,key),b=inbodyNum(context?.base,key);if(a===null||b===null)return '<span class="inbody-delta neutral">월간 비교 기록 부족</span>';const d=+(a-b).toFixed(1);if(Math.abs(d)<0.05)return `<span class="inbody-delta neutral">${context.mode==='previous-month'?'전월 대비':'이번 달 첫 측정 대비'} 변화 없음</span>`;const arrow=d>0?'▲':'▼',cls=lowerBetter===null?'neutral':((lowerBetter?(d<0):(d>0))?'positive':'neutral'),prefix=context.mode==='previous-month'?'전월 대비':'이번 달 첫 측정 대비';return `<span class="inbody-delta ${cls}">${prefix} ${arrow} ${d>0?'+':''}${d.toFixed(1)} ${unit}</span>`}
function inbodySparkline(rows,key,label,unit,color,period='date'){const points=rows.map(r=>({date:r.date,value:inbodyNum(r,key)})).filter(x=>x.value!==null);if(!points.length)return `<div class="inbody-chart-card"><div class="inbody-chart-title"><b>${label}</b><span>기록 없음</span></div><div class="inbody-chart-empty">측정값을 등록하면 월별 추이를 표시합니다.</div></div>`;const vals=points.map(x=>x.value),min=Math.min(...vals),max=Math.max(...vals),range=max-min||Math.max(Math.abs(max)*.04,1),w=320,h=72,px=12,py=10;const coords=points.map((pt,i)=>{const x=points.length===1?w/2:px+i*(w-2*px)/(points.length-1);const y=py+(max-pt.value)/(range)*(h-2*py);return {x:+x.toFixed(1),y:+y.toFixed(1),...pt}});const line=coords.map(p=>`${p.x},${p.y}`).join(' ');const last=points[points.length-1];const labels=points.map(x=>`<span>${esc(period==='month'?String(x.date).slice(0,7).replace('-','.'):String(x.date).slice(5).replace('-','.'))}</span>`).join('');return `<div class="inbody-chart-card"><div class="inbody-chart-title"><b>${label}</b><span>${last.value.toFixed(1)} ${unit}</span></div><svg class="inbody-sparkline" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label} 월별 측정 변화 그래프"><polyline points="${line}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${coords.map((pt,i)=>`<circle cx="${pt.x}" cy="${pt.y}" r="${i===coords.length-1?4.5:2.7}" fill="${color}"/>`).join('')}</svg><div class="inbody-chart-dates" style="grid-template-columns:repeat(${points.length},minmax(0,1fr))">${labels}</div></div>`}
function inbodyTrendCharts(rows){const subset=monthlyInbodyRows(rows).slice(-6);return `<div class="inbody-chart-grid">${inbodySparkline(subset,'weight','체중','kg','#7868e8','month')}${inbodySparkline(subset,'muscle','골격근량','kg','#1b9b78','month')}${inbodySparkline(subset,'fatRate','체지방률','%','#ea8d48','month')}</div>`}
function inbodyFeedback(rows){if(!rows.length)return '<div class="eval-box">인바디 기록을 입력하면 월별 변화와 목표까지의 가이드를 보여 드립니다.</div>';const ctx=inbodyMonthContext(rows),latest=ctx.latest,base=ctx.base,p=db.profile||{},comments=[];const currFat=inbodyNum(latest,'fatRate'),baseFat=base?inbodyNum(base,'fatRate'):null,currMuscle=inbodyNum(latest,'muscle'),baseMuscle=base?inbodyNum(base,'muscle'):null,currWeight=inbodyNum(latest,'weight'),baseWeight=base?inbodyNum(base,'weight'):null;const comparisonLabel=ctx.mode==='previous-month'?'전월 대비':'이번 달 첫 측정 대비';
 if(base){if(currFat!==null&&baseFat!==null){const d=+(currFat-baseFat).toFixed(1);if(d<=-0.5)comments.push(`체지방률이 ${comparisonLabel} ${Math.abs(d).toFixed(1)}%p 낮아졌어요. 측정 조건이 비슷했다면 긍정적인 변화일 수 있으니 다음 달에도 같은 조건으로 확인하세요.`);else if(d>=0.5)comments.push(`체지방률이 ${comparisonLabel} ${d.toFixed(1)}%p 높아요. 한 번의 변화만으로 식사나 운동을 크게 바꾸기보다 수분·식사·측정 시간 조건을 맞춰 다음 측정에서도 지속되는지 확인하세요.`);else comments.push(`체지방률은 ${comparisonLabel} 큰 차이가 없어요. 현재 루틴을 이어가며 월별 흐름으로 판단하세요.`);}
 if(currMuscle!==null&&baseMuscle!==null){const d=+(currMuscle-baseMuscle).toFixed(1);if(d>=0.3)comments.push(`골격근량은 ${comparisonLabel} ${d.toFixed(1)}kg 높게 기록됐어요. 근력운동 수행과 회복이 잘 유지되는지 함께 확인하세요.`);else if(d<=-0.5)comments.push(`골격근량이 ${comparisonLabel} ${Math.abs(d).toFixed(1)}kg 낮게 나왔어요. 체수분 영향일 수 있으니 같은 조건에서 재측정하고, 지속된다면 근력운동·단백질 섭취·수면과 회복을 점검하세요.`);else comments.push(`골격근량은 ${comparisonLabel} 큰 차이가 없습니다. 운동 중량·반복 수와 회복 상태도 함께 기록하면 해석에 도움이 됩니다.`);}
 if(currWeight!==null&&baseWeight!==null){const d=+(currWeight-baseWeight).toFixed(1);if(Math.abs(d)>=0.3)comments.push(`체중은 ${comparisonLabel} ${d>0?'+':''}${d.toFixed(1)}kg 변했어요. 체중만 단독으로 보지 말고 체지방률·골격근량과 함께 해석하세요.`);}}
 else comments.push(`${ctx.month}월 기록은 아직 한 건이고 비교할 전월 데이터도 없어요. 이번 달과 다음 달 기록이 쌓이면 월간 변화 평가가 더 정확해집니다.`);

function inbodySummary(){const arr=sortedInbody();if(!arr.length)return `<div class="inbody-empty-hero"><span class="inbody-empty-icon">📊</span><div><b>아직 등록된 인바디 기록이 없어요</b><p>첫 기록을 저장하면 체중·골격근량·체지방률 변화 그래프가 여기에 나타납니다.</p><button class="primary" data-go="inbody">첫 인바디 입력하기 →</button></div></div>`;const ctx=inbodyMonthContext(arr),latest=ctx.latest,base=ctx.base;return `<div class="inbody-dashboard-summary"><div class="inbody-latest-head"><div><span class="mini-note">최근 측정일 · 월별 평가 기준</span><h3>${esc(latest.date)}</h3></div><span class="pill">${esc(ctx.month)} 평가 · ${arr.length}회</span></div><div class="inbody-stat-grid"><div class="inbody-stat"><span>⚖️ 체중</span><b>${inbodyNum(latest,'weight')===null?'—':inbodyNum(latest,'weight').toFixed(1)+' kg'}</b>${inbodyDeltaMonthly(latest,ctx,'weight','kg',null)}</div><div class="inbody-stat"><span>💪 골격근량</span><b>${inbodyNum(latest,'muscle')===null?'—':inbodyNum(latest,'muscle').toFixed(1)+' kg'}</b>${inbodyDeltaMonthly(latest,ctx,'muscle','kg',false)}</div><div class="inbody-stat"><span>🔥 체지방률</span><b>${inbodyNum(latest,'fatRate')===null?'—':inbodyNum(latest,'fatRate').toFixed(1)+'%'}</b>${inbodyDeltaMonthly(latest,ctx,'fatRate','%p',true)}</div></div>${inbodyTrendCharts(arr)}${inbodyFeedback(arr)}</div>`}
function recentActivitySummary(){const dates=new Set(),rows={};const ensure=d=>{if(!d)return;dates.add(d);rows[d]=rows[d]||{date:d,items:[],kind:[]}};const recordDays=Object.keys(db.records||{});recordDays.forEach(d=>{const r=db.records[d]||{},t=calcMealTotals(d);if(t.cal>0||t.protein>0||String(r.weight||'').trim()||String(r.workout||'').trim()||Number(r.duration)>0||(r.files||[]).length||String(r.notes||'').trim()){ensure(d);if(t.cal>0)rows[d].items.push(`식단 ${Math.round(t.cal)} kcal`);if(String(r.weight||'').trim())rows[d].items.push(`체중 ${r.weight} kg`);if(String(r.workout||'').trim())rows[d].items.push('운동 메모');if(Number(r.duration)>0)rows[d].items.push(`운동 ${r.duration}분`);if((r.files||[]).length)rows[d].items.push(`첨부 ${r.files.length}개`);rows[d].kind.push('daily')}});Object.entries(db.exerciseLogs||{}).forEach(([d,v])=>{if(Array.isArray(v)&&v.length){ensure(d);rows[d].items.push(`웨이트 ${v.length}개`);rows[d].kind.push('exercise')}});Object.entries(db.cardioLogs||{}).forEach(([d,v])=>{if(Array.isArray(v)&&v.length){ensure(d);rows[d].items.push(`유산소 ${v.length}개`);rows[d].kind.push('cardio')}});(db.inbodyRecords||[]).forEach(r=>{if(r?.date){ensure(r.date);rows[r.date].items.push(`인바디 · 체중 ${inbodyNum(r,'weight')===null?'—':inbodyNum(r,'weight').toFixed(1)+' kg'} · 체지방 ${inbodyNum(r,'fatRate')===null?'—':inbodyNum(r,'fatRate').toFixed(1)+'%'}`);rows[r.date].kind.push('inbody')}});const latest=[...dates].sort((a,b)=>b.localeCompare(a)).slice(0,3);if(!latest.length)return '<div class="empty recent-empty"><div>🗂️</div><b>최근 기록이 아직 없어요</b><p>식단, 운동 또는 인바디를 입력하면 날짜별로 간단히 모아 보여 드립니다.</p></div>';const iconFor=r=>r.kind.includes('inbody')?'📈':r.kind.includes('exercise')?'🏋️':r.kind.includes('cardio')?'🏃':'📝';return `<div class="recent-activity-list">${latest.map(d=>{const r=rows[d],onlyInbody=r.kind.length&&r.kind.every(k=>k==='inbody');return `<article class="recent-activity-row"><div class="recent-activity-icon">${iconFor(r)}</div><div class="recent-activity-main"><div function inbodyHistoryHtml(arr){if(!arr.length)return '<p class="muted">저장된 기록이 없습니다.</p>';return `<div class="inbody-history-list">${arr.slice().reverse().map(r=>`<article class="inbody-history-row"><div class="inbody-history-date"><span>📅</span><b>${esc(r.date)}</b></div><div class="inbody-history-metrics"><span>체중 <b>${inbodyNum(r,'weight')===null?'—':inbodyNum(r,'weight').toFixed(1)+'kg'}</b></span><span>골격근량 <b>${inbodyNum(r,'muscle')===null?'—':inbodyNum(r,'muscle').toFixed(1)+'kg'}</b></span><span>체지방률 <b>${inbodyNum(r,'fatRate')===null?'—':inbodyNum(r,'fatRate').toFixed(1)+'%'}</b></span></div>${r.notes?`<div class="mini-note inbody-history-note">${esc(r.notes)}</div>`:''}<div class="inbody-history-actions"><button data-ib-edit="${esc(r.id)}">수정</button><button class="danger" data-ib-delete="${esc(r.id)}">삭제</button></div></article>`).join('')}</div>`}
function inbodyPage(){db.inbodyRecords=db.inbodyRecords||[];const arr=sortedInbody();return `${head('인바디 분석·추이','입력값을 검증하고, 최근 측정 변화와 목표까지의 방향을 함께 확인합니다.')}<section class="panel"><div class="panelhead"><h2>🧾 인바디 결과 입력</h2><span class="pill">값 확인 후 저장</span></div><div class="notice">인바디 결과지에 표시된 값을 그대로 입력하세요. 이미지 자동 인식(OCR)은 참고 후보만 채우며 숫자·단위·항목을 직접 확인해야 합니다. BMI와 체지방량은 다른 입력값과 비교해 확인합니다.</div><div class="fieldgrid inbody-entry-grid"><div class="field inbody-upload-field"><label for="inbodyImage">결과지 사진/스크린샷 (선택)</label><input id="inbodyImage" type="file" accept="image/*"><div id="ocrStatus" class="mini-note">이미지를 올리면 텍스트를 인식하고 후보 값을 입력합니다. 잘못 읽을 수 있으니 반드시 확인하세요.</div><img id="inbodyPreview" class="preview-img" style="display:none" alt="업로드한 인바디 결과 미리보기"><details class="ocr-details"><summary>OCR 읽기 결과 보기</summary><pre id="ocrRawText">아직 인식한 텍스트가 없습니다.</pre></details></div><div class="field inbody-fields"><label for="ibDate">측정일</label><input id="ibDate" type="date" value="${todayISO()}" max="${todayISO()}" required><div class="field"><label for="ibWeight">체중 (Weight, kg)</label><input id="ibWeight" type="number" min="20" max="350" step="0.1" placeholder="예: 72.4"><span class="mini-note">결과지의 ‘체중’ 값</span></div><div class="field"><label for="ibMuscle">골격근량 (SMM, kg)</label><input id="ibMuscle" type="number" min="1" max="100" step="0.1" placeholder="예: 31.2"><span class="mini-note">‘골격근량’ 또는 SMM 값이며, 제지방량과 다릅니다.</span></div><div class="field"><label for="ibFatMass">체지방량 (Body Fat Mass, kg)</label><input id="ibFatMass" type="number" min="0" max="150" step="0.1" placeholder="예: 18.1"></div><div class="field"><label for="ibFatRate">체지방률 (PBF, %)</label><input id="ibFatRate" type="number" min="1" max="70" step="0.1" placeholder="예: 24.9"><span class="mini-note">% 기호는 입력하지 말고 숫자만 입력</span></div><div class="field"><label for="ibHeight">키 (cm, BMI 검증용 · 선택)</label><input id="ibHeight" type="number" min="100" max="250" step="0.1" placeholder="예: 173.5"><span class="mini-note">BMI 대조를 원할 때만 입력하세요. 자동으로 추정하지 않습니다.</span></div><div class="field"><label for="ibBMI">BMI (kg/m²)</label><input id="ibBMI" type="number" min="10" max="70" step="0.1" placeholder="예: 23.1"></div><div class="field"><label for="ibNotes">측정 메모 (선택)</label><textarea id="ibNotes" placeholder="예: 아침 공복, 운동 전 측정"></textarea></div><div class="actions"><button class="primary" id="ibSave">${editingInbodyId?'수정 저장':'인바디 기록 저장'}</button><button id="ibCancelEdit" style="display:${editingInbodyId?'inline-flex':'none'}">수정 취소</button></div></div></div></section><section class="panel section"><div class="panelhead"><h2>📈 월별 변화 그래프</h2><span class="mini-note">최근 6개월 · 월 마지막 측정값</span></div>${inbodyTrendCharts(arr)}${inbodyFeedback(arr)}</section><section class="panel section"><div class="panelhead"><h2>측정 기록</h2><span class="pill">총 ${arr.length}건</span></div>${inbodyHistoryHtml(arr)}</section>`}
function parseInbodyOCRCandidates(raw){const lines=String(raw||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const specs=[{id:'ibWeight',name:'체중',re:/(?:\bweight\b|체중|몸무게)/i,min:20,max:350},{id:'ibMuscle',name:'골격근량',re:/(?:\bSMM\b|skeletal\s*muscle(?:\s*mass)?|골격근량|골격근)/i,min:1,max:100},{id:'ibFatMass',name:'체지방량',re:/(?:body\s*fat\s*mass|fat\s*mass|체지방량)/i,min:0,max:150},{id:'ibFatRate',name:'체지방률',re:/(?:percent\s*body\s*fat|body\s*fat\s*(?:percentage|percent)|\bPBF\b|체지방률|체지방\s*율)/i,min:1,max:70},{id:'ibBMI',name:'BMI',re:/\bBMI\b/i,min:10,max:70}];const anyLabel=/(?:\bweight\b|체중|몸무게|\bSMM\b|skeletal\s*muscle|골격근|body\s*fat\s*mass|fat\s*mass|체지방량|percent\s*body\s*fat|body\s*fat\s*(?:percentage|percent)|\bPBF\b|체지방률|체지방\s*율|\bBMI\b)/i;const out=[];for(const spec of specs){let found=null;for(let i=0;i<lines.length&&!found;i++){const line=lines[i];const match=line.match(spec.re);if(!match)continue;let candidates=[];const remainder=line.slice((match.index||0)+match[0].length);candidates.push(remainder);for(let j=i+1;j<Math.min(lines.length,i+3);j++){if(anyLabel.test(lines[j]))break;candidates.push(lines[j])}for(const part of candidates){const m=String(part).match(/(?:^|[^A-Za-z])([0-9]{1,3}(?:[.,][0-9]{1,2})?)(?![A-Za-z])/);if(!m)continue;const v=Number(m[1].replace(',','.'));if(Number.isFinite(v)&&v>=spec.min&&v<=spec.max){found=v;break}}}if(found!==null){const el=$('#'+spec.id);if(el&&!el.value)el.value=found.toFixed(1);out.push(`${spec.name} ${found.toFixed(1)}`)}}return out}
function validateInbodyInput(){const date=$('#ibDate').value;if(!date){alert('측정일을 입력해 주세요.');return null}if(date>todayISO()){alert('측정일은 오늘 이후 날짜로 입력할 수 없습니다.');return null}const heightRaw=$('#ibHeight')?.value||'';let heightCm=null;if(heightRaw!==''){heightCm=Number(heightRaw);if(!Number.isFinite(heightCm)||heightCm<100||heightCm>250){alert('BMI 검증용 키는 100~250cm 범위로 입력해 주세요.');$('#ibHeight').focus();return null}}const specs=[['ibWeight','체중',20,350],['ibMuscle','골격근량',1,100],['ibFatMass','체지방량',0,150],['ibFatRate','체지방률',1,70],['ibBMI','BMI',10,70]],v={date,notes:$('#ibNotes').value.trim(),heightCm};for(const [id,label,min,max] of specs){const raw=$('#'+id).value;if(raw===''){v[id]=null;continue}const num=Number(raw);if(!Number.isFinite(num)||num<min||num>max){alert(`${label}은 ${min}~${max} 범위의 숫자로 입력해 주세요. 결과지에 해당 값이 없다면 비워 둘 수 있습니다.`);$('#'+id).focus();return null}v[id]=num}if(specs.every(([id])=>v[id]===null)){alert('인바디 수치를 하나 이상 입력해 주세요.');return null}const warnings=[];if(v.ibFatMass!==null&&v.ibWeight!==null&&v.ibFatMass>v.ibWeight)warnings.push('체지방량이 체중보다 큽니다. 항목이나 단위를 잘못 입력했는지 확인해 주세요.');if(v.ibMuscle!==null&&v.ibWeight!==null&&v.ibMuscle>v.ibWeight)warnings.push('골격근량이 체중보다 큽니다. 입력값을 다시 확인해 주세요.');if(v.ibFatMass!==null&&v.ibFatRate!==null&&v.ibWeight!==null){const expected=v.ibWeight*v.ibFatRate/100;const diff=Math.abs(expected-v.ibFatMass);if(diff>Math.max(2,v.ibWeight*.04))warnings.push(`체지방량 ${v.ibFatMass.toFixed(1)}kg과 체중·체지방률로 계산한 참고값 ${expected.toFixed(1)}kg의 차이가 큽니다.`)}if(v.ibBMI!==null&&v.ibWeight!==null&&v.heightCm!==null){const h=v.heightCm/100,calc=v.ibWeight/(h*h);if(Math.abs(calc-v.ibBMI)>1.5)warnings.push(`입력 BMI ${v.ibBMI.toFixed(1)}과 입력한 키·체중으로 계산한 BMI 약 ${calc.toFixed(1)}의 차이가 큽니다.`)}if(warnings.length&&!confirm('입력값을 한 번 더 확인해 주세요.\n\n'+warnings.join('\n')+'\n\n이 값으로 저장할까요?'))return null;return {date,weight:v.ibWeight===null?'':v.ibWeight,muscle:v.ibMuscle===null?'':v.ibMuscle,fatMass:v.ibFatMass===null?'':v.ibFatMass,fatRate:v.ibFatRate===null?'':v.ibFatRate,bmi:v.ibBMI===null?'':v.ibBMI,heightCm:v.heightCm===null?'':v.heightCm,notes:v.notes}}
function wireInbody(){const file=$('#inbodyImage');if(file)file.onchange=async()=>{const f=file.files?.[0];if(!f)return;const img=$('#inbodyPreview');img.src=URL.createObjectURL(f);img.style.display='block';const st=$('#ocrStatus'),rawBox=$('#ocrRawText');if(!window.Tesseract){st.textContent='OCR 라이브러리를 불러오지 못했습니다. 결과지 값을 직접 입력해 주세요.';return}st.textContent='결과지를 읽는 중입니다…';try{const out=await Tesseract.recognize(f,'eng+kor');const text=out.data.text||'';if(rawBox)rawBox.textContent=text||'인식된 텍스트가 없습니다.';const candidates=parseInbodyOCRCandidates(text);st.textContent=candidates.length?`자동 인식 후보: ${candidates.join(' · ')}. 입력칸을 결과지와 비교해 수정한 뒤 저장하세요.`:'항목 이름과 숫자를 정확히 찾지 못했어요. 자동 입력하지 않았으니 결과지 값을 직접 입력해 주세요.'}catch(e){st.textContent='인식 실패: OCR이 숫자나 항목을 잘못 읽을 수 있습니다. 결과지 값을 직접 입력해 주세요.'}};
 const saveBtn=$('#ibSave');saveBtn.onclick=()=>{const v=validateInbodyInput();if(!v)return;const id=editingInbodyId||(crypto.randomUUID?crypto.randomUUID():String(Date.now()));const r={id,...v};db.inbodyRecords=db.inbodyRecords||[];const index=db.inbodyRecords.findIndex(x=>x.id===id);if(index>=0)db.inbodyRecords[index]=r;else db.inbodyRecords.push(r);db.inbodyRecords.sort((a,b)=>String(a.date).localeCompare(String(b.date)));editingInbodyId=null;save();render()};$('#ibCancelEdit')?.addEventListener('click',()=>{editingInbodyId=null;render()});$$('[data-ib-delete]').forEach(b=>b.onclick=()=>{if(confirm('이 인바디 기록을 삭제할까요?')){db.inbodyRecords=(db.inbodyRecords||[]).filter(r=>r.id!==b.dataset.ibDelete);if(String(editingInbodyId)===String(b.dataset.ibDelete))editingInbodyId=null;save();render()}});$$('[data-ib-edit]').forEach(b=>b.onclick=()=>{const r=(db.inbodyRecords||[]).find(x=>String(x.id)===String(b.dataset.ibEdit));if(!r)return;editingInbodyId=r.id;$('#ibDate').value=r.date||todayISO();$('#ibWeight').value=r.weight??'';$('#ibMuscle').value=r.muscle??'';$('#ibFatMass').value=r.fatMass??'';$('#ibFatRate').value=r.fatRate??'';$('#ibBMI').value=r.bmi??'';$('#ibHeight').value=r.heightCm??'';$('#ibNotes').value=r.notes??'';$('#ibSave').textContent='수정 저장';$('#ibCancelEdit').style.display='inline-flex';window.scrollTo({top:0,behavior:'smooth'})})}

function recordTable(rs){if(!rs.length)return '<div class="empty">기록 없음</div>';return `<div class="tablewrap"><table><thead><tr><th>날짜</th><th>칼로리</th><th>운동</th><th>체중</th><th>작업</th></tr></thead><tbody>${rs.map(r=>{let t=calcMealTotals(r.date);return `<tr><td>${fmtDate(r.date)}</td><td>${t.cal} kcal</td><td>${esc(workoutSummaryForDate(r.date))}</td><td>${r.weight?esc(r.weight)+'kg':'—'}</td><td><button data-edit-date="${r.date}">열기</button></td></tr>`}).join('')}</tbody></table></div>`}
function reports(){const allDates=[...new Set([...Object.keys(db.records||{}),...Object.keys(db.exerciseLogs||{}),...Object.keys(db.cardioLogs||{})])].sort().reverse();return `${head('실적 조회','저장된 전체 기록')}<section class="panel">${recordTable(recordsFor(allDates))}</section>`}
// Korean InBody Report measurements, shown as age/sex reference averages rather than individual targets.
const BODY_REFERENCE={
  male:[{fat:21.5,smi:8.3},{fat:24.0,smi:8.4},{fat:24.3,smi:8.4},{fat:24.2,smi:8.2},{fat:25.0,smi:7.9},{fat:25.9,smi:7.6}],
  female:[{fat:31.4,smi:6.2},{fat:31.7,smi:6.4},{fat:31.7,smi:6.5},{fat:32.8,smi:6.5},{fat:33.8,smi:6.4},{fat:35.3,smi:6.2}]
};
function bodyGuideHtml(age,sex,height,targetFat,targetMuscle){
  const ageN=Number(age),h=Number(height),tf=Number(targetFat),tm=Number(targetMuscle);
  if(!ageN||ageN<18||!sex||!h||h<100||h>250)return '<div class="notice">나이(만 18세 이상), 성별, 키를 입력하면 해당 연령대의 체지방률·골격근지수 참고 평균과 목표 가이드를 보여 줍니다.</div>';
  const decade=Math.min(7,Math.max(2,Math.floor(ageN/10))),index=decade-2,ref=BODY_REFERENCE[sex]?.[index];
  if(!ref)return '<div class="notice">평균값 비교를 위해 성별을 남성 또는 여성으로 선택해 주세요.</div>';
  const ageBand=decade===7?(ageN>=80?'70대 참고값':'70대'):`${decade}0대`,limbKg=ref.smi*Math.pow(h/100,2);
  const ib=(db.inbodyRecords||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]||{};
  const currentFat=ib.fatRate!==''&&ib.fatRate!=null&&Number.isFinite(Number(ib.fatRate))?Number(ib.fatRate):null;
  const currentMuscle=ib.muscle!==''&&ib.muscle!=null&&Number.isFinite(Number(ib.muscle))?Number(ib.muscle):null;
  let feedback=[];
  if(currentFat===null)feedback.push('현재 체지방률이 등록되어 있지 않아요. 인바디 분석 화면에서 최근 측정치를 입력하면 목표와 비교할 수 있습니다.');
  else if(Number.isFinite(tf)&&tf>0){const diff=currentFat-tf;if(diff>0.2)feedback.push(`현재 체지방률 ${currentFat.toFixed(1)}%에서 목표 ${tf.toFixed(1)}%까지 약 ${diff.toFixed(1)}%p 차이가 있습니다. 월간 변화와 식사 기록을 보며 무리하지 않게 조정하세요.`);else if(diff< -0.2)feedback.push(`현재 체지방률 ${currentFat.toFixed(1)}%가 설정한 목표 ${tf.toFixed(1)}%보다 낮습니다. 더 낮추기보다 컨디션과 근력 유지도 함께 확인하세요.`);else feedback.push(`최근 체지방률 ${currentFat.toFixed(1)}%가 설정한 목표 ${tf.toFixed(1)}%에 가깝습니다. 같은 측정 조건으로 추이를 확인하세요.`)}
  else if(currentFat>ref.fat+3)feedback.push(`최근 체지방률 ${currentFat.toFixed(1)}%는 같은 성별·연령대 InBody Report 평균 ${ref.fat.toFixed(1)}%보다 높습니다. 평균은 개인에게 꼭 맞는 목표가 아니므로 허리둘레·컨디션·검진 결과와 함께 판단하세요.`);
  else if(currentFat!==null)feedback.push(`최근 체지방률 ${currentFat.toFixed(1)}%는 참고 평균 ${ref.fat.toFixed(1)}% 부근 또는 그보다 낮습니다. 체지방을 더 줄여야 한다고 단정하지 말고 근력·컨디션도 함께 보세요.`);
  if(Number.isFinite(tm)&&tm>0&&currentMuscle!==null){const diff=tm-currentMuscle;if(diff>0.1)feedback.push(`최근 골격근량 ${currentMuscle.toFixed(1)}kg에서 개인 목표 ${tm.toFixed(1)}kg까지 약 ${diff.toFixed(1)}kg 차이입니다. 주요 근육군 근력운동을 주 2회 이상 하고 중량·반복 수를 점진적으로 올려 보세요.`);else feedback.push(`최근 골격근량 ${currentMuscle.toFixed(1)}kg이 설정 목표 ${tm.toFixed(1)}kg에 도달했거나 넘었습니다. 중량만 높이기보다 자세와 회복도 유지하세요.`)}
  else if(currentMuscle===null)feedback.push('최근 골격근량이 없어요. 인바디 분석에 골격근량을 저장하고, 선택적으로 개인 근육량 목표를 입력해 보세요.');
  const fatInput=Number.isFinite(tf)&&tf>0?`<span class="goal-chip">체지방 목표 ${tf.toFixed(1)}%</span>`:'<span class="goal-chip">체지방 목표 미설정</span>';
  const muscleInput=Number.isFinite(tm)&&tm>0?`<span class="goal-chip">근육량 목표 ${tm.toFixed(1)}kg</span>`:'<span class="goal-chip">근육량 목표 미설정</span>';
  return `<div class="bodyguide-grid"><div class="bodyguide-metric"><span>${ageBand} · 체지방률 참고 평균</span><b>${ref.fat.toFixed(1)}%</b><span>현재 인바디: ${currentFat===null?'미등록':currentFat.toFixed(1)+'%'}</span></div><div class="bodyguide-metric"><span>${ageBand} · 골격근지수(SMI) 참고 평균</span><b>${ref.smi.toFixed(1)} kg/m²</b><span>키 ${h.toFixed(1)}cm일 때 사지 근육량 환산 약 ${limbKg.toFixed(1)}kg</span></div></div><div class="actions">${fatInput}${muscleInput}</div><h3 style="font-size:15px;margin:18px 0 8px">🎯 목표 달성 가이드</h3><ul class="guide-list">${feedback.map(x=>`<li>${esc(x)}</li>`).join('')}<li>기본 루틴 예시: 주요 근육군 근력운동을 주 2일 이상, 중강도 유산소를 주 150~300분 범위에서 현재 체력에 맞춰 점진적으로 진행하세요.</li><li>체지방을 줄이는 목표라면 식사량을 급격히 줄이기보다 기록한 평균 섭취량과 월간 체중 추세를 보고 한 달 단위로 작은 조정을 해 보세요. 근육 증가가 목표라면 충분히 먹고 훈련 사이 회복을 확보하세요.</li><li>체중·체지방률은 같은 시간대, 비슷한 수분·식사 조건에서 측정해 월별 추이를 비교하세요.</li></ul><p class="source-note">참고값: InBody Report 2024 한국 측정자 데이터의 연령·성별 평균(20대~70대). SMI는 키 제곱으로 보정한 사지 골격근지수로, 인바디의 전체 골격근량(kg)과 같은 지표가 아닙니다. ‘평균’은 이상적인 목표나 진단 기준이 아닙니다. <a href="https://www.inbody.co.kr/assets/download/2024InBody%20Report_ENG_web.pdf" target="_blank" rel="noopener">자료 출처</a>. 만 18~19세는 20대 참고값, 80세 이상은 70대 참고값을 적용합니다. 성인 신체활동 참고: <a href="https://www.who.int/initiatives/behealthy/physical-activity/" target="_blank" rel="noopener">WHO 권고</a>.</p>`;
}

function settings(){let p=db.profile;p.workoutRoutine=p.workoutRoutine||{weights:[],cardio:[]};let routine=p.workoutRoutine;return `${head('설정','기본 목표, 신체 정보 기반 가이드와 나만의 주간 운동 루틴을 설정합니다.')}<section class="panel"><h2>🎯 기본 목표</h2><div class="fieldgrid"><div class="field"><label>칼로리 목표</label><input id="calorieTarget" type="number" value="${esc(p.calorieTarget)}"></div><div class="field"><label>단백질 목표(g)</label><input id="proteinTarget" type="number" value="${esc(p.proteinTarget)}"></div><div class="field"><label>주간 운동 목표(회)</label><input id="weeklyWorkouts" type="number" value="${esc(p.weeklyWorkouts)}"></div></div><button class="primary" id="saveTargets" style="margin-top:12px;">목표 저장</button></section>

function wire(){const st=$('#saveTargets');if(st)st.onclick=()=>{db.profile.calorieTarget=n($('#calorieTarget').value)||1720;db.profile.proteinTarget=n($('#proteinTarget').value)||138;db.profile.weeklyWorkouts=n($('#weeklyWorkouts').value)||4;save();alert('목표를 저장했습니다.');render()};const guideInputs=['profileAge','profileSex','profileHeight','targetFatRate','targetMuscleKg'];guideInputs.forEach(id=>$('#'+id)?.addEventListener('input',updateBodyGuidePreview));const saveBody=$('#saveBodyProfile');if(saveBody)saveBody.onclick=()=>{const age=Number($('#profileAge').value),sex=$('#profileSex').value,height=Number($('#profileHeight').value),fatRaw=$('#targetFatRate').value,muscleRaw=$('#targetMuscleKg').value,status=$('#bodyProfileStatus');if($('#profileAge').value&&(!Number.isFinite(age)||age<18||age>100)){if(status)status.textContent='나이는 만 18~100세로 입력해 주세요.';return}if($('#profileHeight').value&&(!Number.isFinite(height)||height<100||height>250)){if(status)status.textContent='키는 100~250cm 범위로 입력해 주세요.';return}if(fatRaw!==''&&(!Number.isFinite(Number(fatRaw))||Number(fatRaw)<3||Number(fatRaw)>70)){if(status)status.textContent='목표 체지방률은 3~70% 범위로 입력해 주세요.';return}if(muscleRaw!==''&&(!Number.isFinite(Number(muscleRaw))||Number(muscleRaw)<1||Number(muscleRaw)>150)){if(status)status.textContent='목표 골격근량은 1~150kg 범위로 입력해 주세요.';return}db.profile.age=$('#profileAge').value?age:null;db.profile.sex=sex;db.profile.height=$('#profileHeight').value?height:null;db.profile.targetFatRate=fatRaw!==''?Number(fatRaw):null;db.profile.targetMuscleKg=muscleRaw!==''?Number(muscleRaw):null;save();if(status)status.textContent='신체 정보와 목표를 저장했습니다.';updateBodyGuidePreview()};const rg=$('#routineGroup'),rm=$('#routineMachine');if(rg&&rm)rg.onchange=()=>{rm.innerHTML=(weightExercises[rg.value]||[]).map(x=>`<option>${x}</option>`).join('')};const addRW=$('#addRoutineWeight');if(addRW)addRW.onclick=()=>{let sets=$('#routineSets').value,reps=$('#routineReps').value;if(!sets||!reps){alert('세트와 횟수를 입력해 주세요 function wireExercise(){const group=$('#exGroup'),machine=$('#exMachine');group.onchange=()=>{machine.innerHTML=(weightExercises[group.value]||[]).map(x=>`<option>${x}</option>`).join('')};$('#exDate').onchange=()=>{selectedDate=$('#exDate').value||todayISO();render()};$('#exAdd').onclick=()=>{weightDraft.push({group:group.value,machine:machine.value,weight:$('#exWeight').value,sets:$('#exSets').value,reps:$('#exReps').value});db.exerciseLogs=db.exerciseLogs||{};db.exerciseLogs[selectedDate]=JSON.parse(JSON.stringify(weightDraft));save();render()};$$('[data-ex-remove]').forEach(b=>b.onclick=()=>{weightDraft.splice(Number(b.dataset.exRemove),1);db.exerciseLogs=db.exerciseLogs||{};db.exerciseLogs[selectedDate]=JSON.parse(JSON.stringify(weightDraft));if(!weightDraft.length)delete db.exerciseLogs[selectedDate];save();render()});$('#exSave').onclick=()=>{db.exerciseLogs=db.exerciseLogs||{};db.exerciseLogs[selectedDate]=JSON.parse(JSON.stringify(weightDraft));save();alert('웨이트 기록을 저장했습니다.');render()}}
function cardioRows(){let rows=(db.cardioLogs||{})[selectedDate]||[];return rows.length?`<div class="tablewrap"><table><thead><tr><th>종류</th><th>시간</th><th>강도</th><th>거리(km)</th><th>메모</th><th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${esc(r.machine)}</td><td>${esc(r.minutes)}분</td><td>${esc(r.intensity||'보통')}</td><td>${esc(r.distance||'—')}</td><td>${esc(r.notes||'')}</td><td><button data-cardio-remove="${i}">삭제</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">아직 등록한 유산소 운동이 없습니다.</p>'}
function cardioPage(){db.cardioLogs=db.cardioLogs||{};return `${head('유산소 기록','헬스장 유산소 기구와 야외 활동을 등록하고 시간·강도를 기록하세요.')}<section class="panel"><div class="fieldgrid"><div class="field"><label>날짜</label><input id="cardioDate" type="date" value="${selectedDate}"></div><div class="field"><label>유산소 기구/운동</label><select id="cardioMachine">${cardioMachines.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>운동 시간 (분)</label><input id="cardioMinutes" type="number" min="1" step="1" placeholder="예: 25"></div><div class="field"><label>강도</label><select id="cardioIntensity"><option>가벼움</option><option selected>보통</option><option>높음</option></select></div><div class="field"><label>거리 (km, 선택)</label><input id="cardioDistance" type="number" min="0" step="0.1" placeholder="선택 입력"></div><div class="field"><label>메모 (선택)</label><input id="cardioNotes" placeholder="예: 경사도 5, 속도 6"></div></div><button class="primary" id="cardioAdd" style="margin-top:14px;">유산소 추가</button></section><section class="panel section"><h2>오늘의 유산소 목록</h2><div id="cardioRows">${cardioRows()}</div><button class="primary" id="cardioSave" style="margin-top:14px;">유산소 기록 저장</button></section>`}
function wireCardio(){const date=$('#cardioDate');date.onchange=()=>{selectedDate=date.value||todayISO();render()};$('#cardioAdd').onclick=()=>{let minutes=$('#cardioMinutes').value;if(!minutes||Number(minutes)<=0){alert('운동 시간을 분 단위로 입력해 주세요.');return}db.cardioLogs=db.cardioLogs||{};db.cardioLogs[selectedDate]=db.cardioLogs[selectedDate]||[];db.cardioLogs[selectedDate].push({machine:$('#cardioMachine').value,minutes,distance:$('#cardioDistance').value,intensity:$('#cardioIntensity').value,notes:$('#cardioNotes').value});save();render()};$$('[data-cardio-remove]').forEach(b=>b.onclick=()=>{db.cardioLogs[selectedDate].splice(Number(b.dataset.cardioRemove),1);save();render()});$('#cardioSave').onclick=()=>{save();alert('유산소 기록을 저장했습니다.');render()}}
</script>

<!-- 사용자별 개별 계정 로그인 및 클라우드 동기화 쉴드 레이어 -->
<style>
#fitCloudShield{position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:18px}
#fitCloudShield .fit-card{width:min(100%,480px);background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:25px;box-shadow:0 18px 60px #0002}
#fitCloudShield h1{font-size:22px;margin:0 0 8px}
#fitCloudShield .fit-fields,#fitCloudShield .fit-actions{display:grid;gap:10px;margin-top:14px}
#fitCloudShield .fit-status{padding:10px;border-radius:8px;background:var(--accentbg);font-size:13px;margin-top:10px;word-break:break-all}
#fitCloudLogout{display:none}
#fitCloudLogout.visible{display:inline-flex}
</style>
<div id="fitCloudShield" role="dialog">
  <div class="fit-card">
    <h1>FIT 건강관리 포털</h1>
    <p style="color:var(--muted);font-size:13px;">이메일로 로그인하여 개별 클라우드 데이터를 동기화하세요.</p>
    <div id="fitCloudForm">
      <div class="fit-fields">
        <div class="field"><label>이메일</label><input id="fitCloudEmail" type="email" placeholder="email@example.com"></div>
        <div class="field"><label>비밀번호</label><input id="fitCloudPassword" type="password" placeholder="비밀번호 (6자 이상)"></div>
      </div>
      <div class="fit-actions">
        <button class="primary" id="fitCloudLogin" type="button">로그인</button>
        <button id="fitCloudSignup" type="button">새 계정 만들기</button>
      </div>
    </div>
    <div id="fitCloudStatus" class="fit-status">계정 정보를 입력하세요.</div>
  </div>
</div>

<script>
(function(){
  const SUPABASE_URL='https://krbqcwjtpkkuqouhwxph.supabase.co', KEY='sb_publishable_uOx8W7EG9l4j4ClQ7orB3g_ED0MCgCN';
  let supa=null, user=null, ignore=false, busy=false, timer=null;

  function say(msg){
    const el = document.getElementById('fitCloudStatus');
    if(el) el.textContent = msg;
  }

  window.fitApp = { get db(){return db}, set db(v){db=v}, save:save, render:render };
  window.fitAIGetAccessToken = async function(){
    if(!supa && window.supabase) supa=window.supabase.createClient(SUPABASE_URL, KEY);
    if(!supa) return null;
    const {data,error}=await supa.auth.getSession();
    if(error) throw error;
    return data && data.session ? data.session.access_token : null;
  };
  const animalIds=['cat','dog','fox','rabbit','bear','panda','penguin','otter','duck'];
  function randomAnimal(){return animalIds[Math.floor(Math.random()*animalIds.length)]}
  async function ensureWorkspaceProfile(){
    if(!supa||!user)throw new Error('먼저 로그인해 주세요.');
    const {data,error}=await supa.from('fit_workspace_profiles').select('user_id,display_name,animal_type,pet_name,points,intimacy,updated_at').eq('user_id',user.id).maybeSingle();
    if(error)throw error;
    if(data)return data;
    const suffix=String(Math.floor(1000+Math.random()*9000));
    const created={user_id:user.id,display_name:'FIT 러너 '+suffix,animal_type:randomAnimal(),pet_name:'콩이'};
    const out=await supa.from('fit_workspace_profiles').insert(created).select('user_id,display_name,animal_type,pet_name,points,intimacy,updated_at').single();
    if(out.error)throw out.error;return out.data;
  }
  window.fitWorkspace={
    ensureProfile:ensureWorkspaceProfile,
    async listProfiles(){if(!supa||!user)throw new Error('먼저 로그인해 주세요.');const {data,error}=await supa.from('fit_workspace_profiles').select('user_id,display_name,animal_type,pet_name,points,intimacy,updated_at').order('points',{ascending:false}).order('intimacy',{ascending:false}).limit(100);if(error)throw error;return data||[]},
    async listEntries(){if(!supa||!user)throw new Error('먼저 로그인해 주세요.');const {data,error}=await supa.from('fit_workspace_entries').select('id,user_id,entry_date,title,workout_summary,duration_minutes,weight_kg,body_fat_rate,points_earned,created_at').order('entry_date',{ascending:false}).order('created_at',{ascending:false}).limit(50);if(error)throw error;return data||[]},
    async saveProfile(displayName,animalType,petName){if(!supa||!user)throw new Error('먼저 로그인해 주세요.');if(!animalIds.includes(animalType))throw new Error('동물 선택이 올바르지 않습니다.');const normalizedPetName=String(petName||'콩이').trim();if(!normalizedPetName||normalizedPetName.length>16)throw new Error('동물 이름을 1~16자로 입력해 주세요.');const existing=await ensureWorkspaceProfile();if(animalType!==existing.animal_type)throw new Error('동물 교체는 동물 키우기 화면의 ‘동물 교체’ 버튼으로 진행해 주세요.');const {data,error}=await supa.from('fit_workspace_profiles').update({display_name:displayName,animal_type:animalType,pet_name:normalizedPetName,updated_at:new Date().toISOString()}).eq('user_id',user.id).select('user_id,display_name,animal_type,pet_name,points,intimacy,updated_at').single();if(error)throw error;return data},
    async switchAnimal(animalType){if(!supa||!user)throw new Error('먼저 로그인해 주세요.');if(!animalIds.includes(animalType))throw new Error('동물 선택이 올바르지 않습니다.');const current=await ensureWorkspaceProfile();if(animalType===current.animal_type)throw new Error('현재와 다른 동물을 선택해 주세요.');const starterNames={cat:'냥이',dog:'멍이',fox:'여우',rabbit:'토끼',bear:'곰이',panda:'판다',penguin:'펭귄',otter:'수달이',duck:'오리'};const {data,error}=await supa.from('fit_workspace_profiles').update({animal_type:animalType,pet_name:starterNames[animalType]||animalInfo(animalType).name,intimacy:0,updated_at:new Date().toISOString()}).eq('user_id',user.id).select('user_id,display_name,animal_type,pet_name,points,intimacy,updated_at').single();if(error)throw error;return data},
    async publishEntry(payload){if(!supa||!user)throw new Error('먼저 로그인해 주세요.');await ensureWorkspaceProfile();const entry={user_id:user.id,entry_date:payload.entry_date,title:String(payload.title||'오늘의 운동').slice(0,80),workout_summary:String(payload.workout_summary||'').slice(0,1200),duration_minutes:Math.max(0,Math.round(Number(payload.duration_minutes)||0)),weight_kg:payload.weight_kg==null?null:payload.weight_kg,body_fat_rate:payload.body_fat_rate==null?null:payload.body_fat_rate};const {data,error}=await supa.from('fit_workspace_entries').insert(entry).select('id,user_id,entry_date,title,workout_summary,duration_minutes,weight_kg,body_fat_rate,points_earned,created_at').single();if(error){if(error.code==='23505')throw new Error('이 날짜의 운동은 이미 공유했습니다. 하루 한 번만 포인트를 받을 수 있습니다.');throw error}return data},
    async feedCompanion(){if(!supa||!user)throw new Error('먼저 로그인해 주세요.');await ensureWorkspaceProfile();const {data,error}=await supa.rpc('fit_feed_companion');if(error)throw error;return data}
  };

  async function getRow(){
    const {data,error} = await supa.from('fit_manager_data').select('data').eq('user_id', user.id).maybeSingle();
    if(error) throw error;
    return data || null;
  }

  async function put(x){
    const {error} = await supa.from('fit_manager_data').upsert({user_id:user.id, data:x, updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(error) throw error;
  }

  async function activate(data){
    ignore = true;
    db = data;
    save();
    render();
    document.getElementById('fitCloudShield').style.display='none';
    const logoutBtn = document.getElementById('fitCloudLogout');
    if(logoutBtn) logoutBtn.classList.add('visible');
    const badge = document.getElementById('syncStatusBadge');
    if(badge){ badge.textContent='클라우드 동기화'; badge.className='pill good'; }
    ignore = false;
    say('로그인 완료');
  }

  async function signedIn(u){
    user = u;
    say('개별 클라우드 데이터 로딩 중...');
    try{
      const row = await getRow();
      if(row && row.data){ await activate(row.data); }
      else { await put(db); await activate(db); }
    } catch(e) {
      document.getElementById('fitCloudShield').style.display='flex';
      say('동기화 오류: ' + (e.message || e));
    }
  }

  async function handleLogin(){
    const email = document.getElementById('fitCloudEmail').value.trim();
    const password = document.getElementById('fitCloudPassword').value;
    if(!email || !password){ say('이메일과 비밀번호를 모두 입력해 주세요.'); return; }
    say('로그인 인증 중...');
    try {
      if(!supa && window.supabase){ supa = window.supabase.createClient(SUPABASE_URL, KEY); }
      const { data, error } = await supa.auth.signInWithPassword({ email, password });
      if(error) throw error;
      await signedIn(data.user);
    } catch(e) {
      say('로그인 실패: ' + (e.message || String(e)));
    }
  }

  async function handleSignup(){
    const email = document.getElementById('fitCloudEmail').value.trim();
    const password = document.getElementById('fitCloudPassword').value;
    if(!email || password.length < 6){ say('올바른 이메일과 6자 이상의 비밀번호를 입력해 주세요.'); return; }
    say('회원가입 요청 중...');
    try {
      if(!supa && window.supabase){ supa = window.supabase.createClient(SUPABASE_URL, KEY); }
      const { data, error } = await supa.auth.signUp({ email, password });
      if(error) throw error;
      if(data.session) await signedIn(data.session.user);
      else say('회원가입이 완료되었습니다. 로그인해 주세요.');
    } catch(e) {
      say('회원가입 실패: ' + (e.message || String(e)));
    }
  }

  window.fitCloudSaveHook = function(currentDB){
    if(user && !ignore){
      if(timer) clearTimeout(timer);
      timer = setTimeout(async ()=>{
        if(busy) return;
        busy = true;
        try { await put(currentDB); } catch(e){}
        finally { busy = false; }
      }, 800);
    }
  };

  document.addEventListener('DOMContentLoaded', ()=>{
    document.getElementById('fitCloudLogin').addEventListener('click', handleLogin);
    document.getElementById('fitCloudSignup').addEventListener('click', handleSignup);

    const logout = document.createElement('button');
    logout.id = 'fitCloudLogout';
    logout.textContent = '로그아웃';
    logout.addEventListener('click', async ()=>{
      if(supa) await supa.auth.signOut();
      user = null;
      document.getElementById('fitCloudShield').style.display='flex';
      say('로그아웃되었습니다.');
    });

    const targetHeader = document.querySelector('header .right');
    if(targetHeader) targetHeader.insertBefore(logout, targetHeader.firstChild);

    try {
      if(window.supabase){
        supa = window.supabase.createClient(SUPABASE_URL, KEY);
        supa.auth.getSession().then(({data})=>{
          if(data && data.session) signedIn(data.session.user);
        }).catch(()=>{ say('계정 정보를 입력 후 로그인하세요.'); });
      } else {
        say('Supabase 라이브러리를 로드하지 못했습니다.');
      }
    } catch(err){
      say('초기화 에러: ' + err.message);
    }
  });
})();
</script>
